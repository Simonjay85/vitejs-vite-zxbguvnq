            <span>ℹ️ Chi tiết sự kiện</span><span>{expanded?"▲":"▼"}</span>
          </button>
          {expanded&&<div style={{background:"rgba(255,255,255,0.02)",borderRadius:10,padding:"12px",marginBottom:10,border:"1px solid #1E2A3A"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[
                {l:"Chế độ",v:modeLbl},
                {l:"Số sân",v:`${ev.numCourts||5} sân`},
                {l:"Phí sân",v:ev.courtFee?`${Number(ev.courtFee).toLocaleString("vi-VN")}đ`:"Chưa có"},
                {l:"Phí thêm",v:ev.extraFee?`${Number(ev.extraFee).toLocaleString("vi-VN")}đ`:"Không có"},
                {l:"DUPR Rating",v:ev.updateDUPR?"✅ Có":"Không"},
                {l:"Tối đa người",v:ev.maxPlayers||"Không giới hạn"},
              ].map(({l,v})=><div key={l}>
                <div style={{fontSize:9,color:G.muted,fontWeight:700,marginBottom:2}}>{l}</div>
                <div style={{fontSize:12,fontWeight:700,color:G.text}}>{v}</div>
              </div>)}
            </div>
          </div>}
          {/* Book button */}
          <button onClick={()=>setShowQR(ev.id)} style={{width:"100%",padding:"11px",borderRadius:12,border:"none",background:G.accent,color:"#0B0F14",fontWeight:800,cursor:"pointer",fontSize:13}}>🎟 Giữ chỗ ngay</button>
        </div>;
      })}
    </div>
  </div>;
}



function PayQRBox({qrUrl,courtFee,extraFee,feePerPerson,players}){
  const total=(Number(courtFee)||0)+(Number(extraFee)||0);
  const ciCount=players.filter(p=>p?.checkedIn).length||1;
  const perPerson=feePerPerson>0?feePerPerson:(total>0?Math.ceil(total/ciCount):0);
  if(!total&&!qrUrl) return null;
  return <div style={{background:G.card,border:`1px solid ${G.gold}44`,borderRadius:12,padding:14,marginBottom:12,textAlign:"center"}}>
    <div style={{fontSize:11,fontWeight:700,color:G.gold,marginBottom:8}}>💰 CHI PHÍ BUỔI CHƠI</div>
    {total>0&&<div style={{marginBottom:8}}>
      <div style={{fontSize:20,fontWeight:900,color:G.gold}}>{perPerson.toLocaleString("vi-VN")}đ</div>
      <div style={{fontSize:10,color:G.muted}}>/ người ({ciCount} người check-in · tổng {total.toLocaleString("vi-VN")}đ)</div>
    </div>}
    {qrUrl&&qrUrl.startsWith("http")&&<div>
      <div style={{fontSize:10,color:G.muted,marginBottom:6}}>Quét để thanh toán</div>
      <img src={`https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(qrUrl)}`}
        style={{borderRadius:8,border:`2px solid ${G.gold}44`}} alt="QR TT" onError={e=>e.target.style.display='none'}/>
    </div>}
    {qrUrl&&!qrUrl.startsWith("http")&&<div style={{padding:"8px 12px",borderRadius:8,background:G.gold+"12",fontSize:12,color:G.gold,fontWeight:700}}>{qrUrl}</div>}
  </div>;
}

// ── CostTab: quản lý chi phí tất cả event
function CostTab({events,players,activeEventId,onUpdatePlayer,onUpdateEvent}){
  const [view,setView]=useState("event"); // event | player
  const [selEv,setSelEv]=useState(activeEventId||[...events].reverse()[0]?.id||"");

  // ── EVENT VIEW
  const ev=events.find(e=>e.id===selEv);
  const total=(Number(ev?.courtFee)||0)+(Number(ev?.extraFee)||0);
  const evPlayers=players.filter(p=>p?.checkedIn); // current event players
  const paidPlayers=evPlayers.filter(p=>p?.paid);
  const unpaidPlayers=evPlayers.filter(p=>!p?.paid);
  const denominator=ev?.maxPlayers>0?ev.maxPlayers:(evPlayers.length||1);
  const perPerson=ev.feePerPerson>0?ev.feePerPerson:(total>0?Math.ceil(total/denominator):0);
  const collected=paidPlayers.reduce((s,p)=>s+(p.paidAmount||perPerson),0);
  const profit=collected-total;

  // ── PLAYER STATS (all-time)
  const now=new Date();
  const thisMonth=now.getMonth();
  const thisYear=now.getFullYear();

  const playerStats=players.filter(p=>p?.name).map(p=>{
    // Sum up cost across all events player participated in
    // We track totalSpent on the player object, updated each time they pay
    const spent=p.totalSpent||0;
    const monthSpent=p.monthSpent||0;
    const evCount=p.eventCount||0;
    return {...p,spent,monthSpent,evCount};
  }).sort((a,b)=>b.spent-a.spent);

  const fmtVND=v=>v?v.toLocaleString("vi-VN")+"đ":"0đ";

  // Toggle paid for a player in current event
  const togglePaid=(p)=>{
    const nowPaid=!p.paid;
    const amt=nowPaid?perPerson:0;
    const newSpent=(p.totalSpent||0)+(nowPaid?perPerson:-(p.paidAmount||perPerson));
    onUpdatePlayer({...p, paid:nowPaid, paidAmount:nowPaid?perPerson:0,
      totalSpent:Math.max(0,newSpent),
      payMethod:nowPaid?(p.payMethod||"transfer"):p.payMethod
    });
  };

  const setPayMethod=(p,method)=>{
    onUpdatePlayer({...p,payMethod:method});
  };

  const setCustomAmt=(p,amt)=>{
    const diff=amt-(p.paidAmount||0);
    onUpdatePlayer({...p,paidAmount:amt,totalSpent:Math.max(0,(p.totalSpent||0)+diff)});
  };

  // ── TABS
  return <div>
    <div style={{display:"flex",gap:6,marginBottom:16,borderBottom:`1px solid ${G.border}`,paddingBottom:10}}>
      {[{id:"event",l:"📅 Theo Event"},{id:"player",l:"👥 Theo Người chơi"}].map(t=>
        <button key={t.id} onClick={()=>setView(t.id)}
          style={{padding:"7px 16px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",
            border:`1px solid ${view===t.id?G.gold:G.border}`,
            background:view===t.id?G.gold+"18":"transparent",
            color:view===t.id?G.gold:G.muted}}>
          {t.l}
        </button>
      )}
    </div>

    {/* ══ EVENT VIEW ══ */}
    {view==="event"&&<>
      {/* Event selector */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {[...events].reverse().map(e=><button key={e.id} onClick={()=>setSelEv(e.id)}
          style={{padding:"5px 12px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer",
            border:`1px solid ${selEv===e.id?G.accent:G.border}`,
            background:selEv===e.id?G.accent+"18":"transparent",
            color:selEv===e.id?G.accent:G.muted}}>
          {e.name}
        </button>)}
      </div>

      {ev&&<>
        {/* Event header + cost */}
        <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:13,padding:16,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <div style={{fontSize:15,fontWeight:800,color:G.text}}>{ev.name}</div>
              <div style={{fontSize:11,color:G.muted}}>{ev.date}{ev.location&&` · 📍${ev.location}`}</div>
            </div>
            {ev.ended&&<span style={{fontSize:10,padding:"2px 8px",borderRadius:6,background:G.muted+"22",color:G.muted,fontWeight:600}}>Đã KT</span>}
          </div>

          {/* Quick cost stats */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:10}}>
            {[
              {l:"👥 Người check-in",v:evPlayers.length+" người",c:G.blue},
              {l:"💰 Chi phí/người",v:fmtVND(perPerson),c:G.gold},
              {l:"🏟️ Giá sân",v:fmtVND(Number(ev.courtFee)||0),c:G.purple},
              {l:"🧾 Chi phí khác",v:fmtVND(Number(ev.extraFee)||0),c:G.muted},
            ].map(s=><div key={s.l} style={{padding:"9px 11px",borderRadius:9,background:G.card,border:`1px solid ${G.border}`}}>
              <div style={{fontSize:9,color:G.muted,marginBottom:2}}>{s.l}</div>
              <div style={{fontSize:13,fontWeight:900,color:s.c}}>{s.v}</div>
            </div>)}
          </div>

          {/* Inline edit fees */}
          <EventFeeEditor ev={ev} onSave={onUpdateEvent}/>
        </div>

        {/* Revenue summary */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:10}}>
          {[
            {l:"Đã thu",v:fmtVND(collected),c:"#34d399",bg:"#34d39918"},
            {l:"Tổng CP",v:fmtVND(total),c:G.gold,bg:G.gold+"12"},
            {l:profit>=0?"Lời":"Lỗ",v:fmtVND(Math.abs(profit)),c:profit>=0?"#34d399":G.red,bg:profit>=0?"#34d39918":G.red+"18"},
          ].map(s=><div key={s.l} style={{padding:"11px 8px",borderRadius:11,background:s.bg,border:`1px solid ${s.c}44`,textAlign:"center"}}>
            <div style={{fontSize:9,color:s.c,fontWeight:700,marginBottom:3}}>{s.l}</div>
            <div style={{fontSize:14,fontWeight:900,color:s.c}}>{s.v}</div>
          </div>)}
        </div>

        {/* Player payment list */}
        <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:13,padding:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:800,color:G.text}}>
              💳 Thanh toán ({paidPlayers.length}/{evPlayers.length})
            </div>
            <div style={{display:"flex",gap:5}}>
              <span style={{fontSize:10,color:"#34d399",fontWeight:600}}>✅{paidPlayers.length}</span>
              <span style={{fontSize:10,color:G.red,fontWeight:600}}>⏳{unpaidPlayers.length}</span>
            </div>
          </div>
          {evPlayers.length===0&&<div style={{color:G.dim,fontSize:11,textAlign:"center",padding:16}}>Chưa có người check-in</div>}
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {evPlayers.map(p=><PlayerPayRow key={p.id} p={p} perPerson={perPerson}
              onToggle={()=>togglePaid(p)}
              onMethod={m=>setPayMethod(p,m)}
              onAmount={a=>setCustomAmt(p,a)}/>)}
          </div>
        </div>
      </>}
      {!ev&&<div style={{color:G.dim,fontSize:12,textAlign:"center",padding:40}}>Không có event nào</div>}
    </>}

    {/* ══ PLAYER VIEW ══ */}
    {view==="player"&&<>
      <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:13,padding:14,marginBottom:10}}>

        {playerStats.length===0&&<div style={{color:G.dim,fontSize:11}}>Chưa có dữ liệu</div>}
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {playerStats.filter(p=>p.spent>0||p.gamesPlayed>0).slice(0,20).map((p,i)=>(
            <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
              borderRadius:10,background:i<3?G.gold+"08":G.card,
              border:`1px solid ${i===0?G.gold+"44":G.border}`}}>
              <div style={{fontSize:16,width:24,textAlign:"center",flexShrink:0}}>
                {i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}`}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,color:G.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{safe(p.name)}</div>
                <div style={{fontSize:10,color:G.muted,marginTop:1,display:"flex",gap:8}}>
                  <span>🎾 {p.gamesPlayed||0} trận</span>
                  <span>📅 {p.evCount||0} event</span>
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:13,fontWeight:900,color:G.gold}}>{fmtVND(p.spent)}</div>
                {p.monthSpent>0&&<div style={{fontSize:9,color:G.muted}}>tháng này: {fmtVND(p.monthSpent)}</div>}
              </div>
            </div>
          ))}
          {playerStats.filter(p=>p.spent===0&&p.gamesPlayed===0).length>0&&
            <div style={{fontSize:10,color:G.dim,textAlign:"center",padding:"8px 0"}}>
              + {playerStats.filter(p=>p.spent===0&&p.gamesPlayed===0).length} người chưa có dữ liệu
            </div>}
        </div>
      </div>

      {/* All events summary */}
      <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:13,padding:14}}>
        <div style={{fontSize:11,fontWeight:800,color:G.text,marginBottom:12}}>📅 Tổng kết theo event</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {[...events].reverse().map(e=>{
            const ePlayers=players.filter(p=>p?.checkedIn);
            const eTotal=(Number(e.courtFee)||0)+(Number(e.extraFee)||0);
            const ePaid=ePlayers.filter(p=>p?.paid);
            const eCollected=ePaid.reduce((s,p)=>s+(p.paidAmount||0),0);
            const eProfit=eCollected-eTotal;
            return <div key={e.id} style={{padding:"11px 13px",borderRadius:11,background:G.card,border:`1px solid ${G.border}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div>
                  <div style={{fontSize:12,fontWeight:700,color:G.text}}>{e.name}</div>
                  <div style={{fontSize:10,color:G.muted}}>{e.date}{e.location&&` · ${e.location}`}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:11,fontWeight:700,color:eProfit>=0?"#34d399":G.red}}>
                    {eProfit>=0?"💚":"🔴"} {eProfit>=0?"Lời":"Lỗ"} {fmtVND(Math.abs(eProfit))}
                  </div>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5}}>
                {[
                  {l:"Người chơi",v:ePlayers.length},
                  {l:"Chi phí sân",v:fmtVND(Number(e.courtFee)||0)},
                  {l:"Chi phí khác",v:fmtVND(Number(e.extraFee)||0)},
                  {l:"Đã thu",v:fmtVND(eCollected)},
                ].map(s=><div key={s.l} style={{textAlign:"center"}}>
                  <div style={{fontSize:9,color:G.muted}}>{s.l}</div>
                  <div style={{fontSize:11,fontWeight:700,color:G.text}}>{s.v}</div>
                </div>)}
              </div>
            </div>;
          })}
        </div>
      </div>
    </>}
  </div>;
}

// Thông báo sẵn sàng — hiện khi có trận được gán và người chơi cần xác nhận
function MatchReadyOverlay({notif,me,onReady,onNotReady}){
  const [sec,setSec]=useState(300);
  // Declare derived state first so useEffect hooks can reference them
  const alreadyReady=(notif.ready||[]).includes(me?.id);
  const alreadyDeclined=(notif.notReady||[]).includes(me?.id);
  const totalPlayers=4;
  const readyCount=(notif.ready||[]).length;
  const actionTaken=alreadyReady||alreadyDeclined;

  const [dismissed,setDismissed]=useState(()=>localStorage.getItem("dismissed_"+notif.id)==="1");

  useEffect(()=>{
    if(dismissed) localStorage.setItem("dismissed_"+notif.id,"1");
  },[dismissed, notif.id]);
  useEffect(()=>{
    if(alreadyReady){ setTimeout(()=>setDismissed(true), 3000); }
  },[alreadyReady]);
  useEffect(()=>{
    const startAt=notif.assignedAt||Date.now();
    const elapsed=Math.floor((Date.now()-startAt)/1000);
    setSec(Math.max(0,300-elapsed));
    const t=setInterval(()=>setSec(s=>Math.max(0,s-1)),1000);
    return()=>clearInterval(t);
  },[notif.id]);

  const mm=String(Math.floor(sec/60)).padStart(2,"0"),ss2=String(sec%60).padStart(2,"0");
  if(dismissed) return null;
  return <div style={{position:"fixed",inset:0,zIndex:900,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"#0D1520",borderRadius:24,padding:28,width:"100%",maxWidth:400,border:"2px solid rgba(0,255,178,0.5)",boxShadow:"0 0 60px rgba(0,255,178,0.2)",textAlign:"center",position:"relative"}}>
      {/* X dismiss button — only shown after action */}
      {actionTaken&&<button onClick={()=>setDismissed(true)} style={{position:"absolute",top:12,right:14,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:"50%",width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#9CA3AF",fontSize:14,fontWeight:700}}>✕</button>}
      <div style={{fontSize:40,marginBottom:8}}>🏓</div>
      <div style={{fontSize:20,fontWeight:900,color:"#00FFB2",marginBottom:4}}>ĐẾN LƯỢT BẠN RỒI!</div>
      <div style={{fontSize:13,color:"#9CA3AF",marginBottom:6}}>Chuẩn bị ra <strong style={{color:"#fff"}}>{notif.courtName}</strong></div>
      {/* VS layout */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 36px 1fr",gap:8,alignItems:"center",margin:"16px 0"}}>
        <div style={{background:"rgba(0,255,178,0.06)",borderRadius:14,padding:"10px 8px",border:"1px solid rgba(0,255,178,0.2)"}}>
          <div style={{fontSize:8,color:"#00FFB2",fontWeight:800,letterSpacing:1,marginBottom:5}}>ĐỘI BẠN</div>
          {(notif.match?.team1||[]).filter(Boolean).map(p=><div key={p.id} style={{fontSize:13,fontWeight:700,color:p.id===me?.id?"#00FFB2":"#fff",marginBottom:2}}>{safe(p.name)}{p.id===me?.id?" 👤":""}</div>)}
        </div>
        <div><div style={{fontSize:16,fontWeight:900,color:"#6B7280"}}>VS</div></div>
        <div style={{background:"rgba(245,158,11,0.06)",borderRadius:14,padding:"10px 8px",border:"1px solid rgba(245,158,11,0.2)"}}>
          <div style={{fontSize:8,color:"#F59E0B",fontWeight:800,letterSpacing:1,marginBottom:5}}>ĐỐI THỦ</div>
          {(notif.match?.team2||[]).filter(Boolean).map(p=><div key={p.id} style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:2}}>{safe(p.name)}</div>)}
        </div>
      </div>
      {/* Countdown */}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:36,fontWeight:900,color:sec>60?"#00FFB2":sec>30?"#F59E0B":"#EF4444",fontFamily:"monospace",letterSpacing:3}}>{mm}:{ss2}</div>
        <div style={{fontSize:10,color:"#6B7280",marginTop:2}}>{sec<=120?"⚠️ Sắp hết giờ! Hãy xác nhận ngay":"thời gian còn lại để xác nhận"}</div>
      </div>
      {/* Ready count */}
      <div style={{padding:"6px 12px",borderRadius:20,background:"rgba(255,255,255,0.04)",border:"1px solid #1E2A3A",fontSize:10,color:"#9CA3AF",marginBottom:14,display:"inline-block"}}>
        ✅ {readyCount}/{totalPlayers} người sẵn sàng
      </div>
      {alreadyDeclined?(
        <div style={{padding:"14px",borderRadius:14,background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.3)",color:"#EF4444",fontWeight:700,fontSize:13}}>
          ⏭️ Đã chọn đợi trận tiếp theo<br/><span style={{fontSize:11,color:"#9CA3AF"}}>Hệ thống đang tìm người thay thế...</span>
        </div>
      ):alreadyReady?(
        <div style={{padding:"14px",borderRadius:14,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",color:"#22C55E",fontWeight:800,fontSize:14}}>
          ✅ Bạn đã xác nhận! Chờ mọi người...
        </div>
      ):(
        <div style={{display:"flex",gap:10,flexDirection:"column"}}>
          <button onClick={onReady} style={{padding:"15px",borderRadius:14,border:"none",background:"#00FFB2",color:"#0B0F14",fontWeight:900,cursor:"pointer",fontSize:15,boxShadow:"0 4px 20px rgba(0,255,178,0.3)"}}>✅ Sẵn sàng!</button>
          <button onClick={onNotReady} style={{padding:"11px",borderRadius:14,border:"1px solid rgba(239,68,68,0.4)",background:"transparent",color:"#EF4444",fontWeight:700,cursor:"pointer",fontSize:12}}>Đợi trận tiếp theo</button>
        </div>
      )}
    </div>
  </div>;
}

          <button onClick={autoAss} style={{gridColumn:"span 2",border:"none",borderRadius:11,fontWeight:900,cursor:"pointer",fontSize:14,padding:"14px 8px",background:`linear-gradient(135deg,${G.accent},${G.blue})`,color:"#fff",boxShadow:`0 4px 20px ${G.accent}55`,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>▶ Auto Gán Sân</button>

      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div className="court-grid">

        </div>
        {history.filter(h=>h.eventId===activeEvent?.id).length>0&&<>
          <div style={{fontSize:9,color:G.muted,fontWeight:700,letterSpacing:2,marginTop:2}}>📋 KẾT QUẢ GẦN ĐÂY</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
            {history.filter(h=>h.eventId===activeEvent?.id).slice(0,4).map(h=><HCard key={h.id} h={h}/>)}
          </div>
        </>}
      </div>
    </div>
  </div>;
}

function PlayersTab({players,playIds,history,onToggle,onAdd,onCouple,onQR,onEdit,onResetAll}){
  const [search,setSearch]=useState(""),[fG,setFG]=useState("all"),[fS,setFS]=useState("all");
  const [fSt,setFSt]=useState("all"),[sort,setSort]=useState("sepc");
  let list=[...players].filter(p=>p?.name);
  const sq=safe(search).toLowerCase();
  if(sq)list=list.filter(p=>safe(p.name).toLowerCase().includes(sq)||safe(p.phone||"").includes(sq));
  if(fG!=="all")list=list.filter(p=>p.gender===fG);if(fS!=="all")list=list.filter(p=>p.skill===fS);
  if(fSt==="in")list=list.filter(p=>p.checkedIn);else if(fSt==="out")list=list.filter(p=>!p.checkedIn);
  else if(fSt==="playing")list=list.filter(p=>playIds.has(p.id));else if(fSt==="couple")list=list.filter(p=>p.coupleId);
  list.sort((a,b)=>{if(sort==="sepc")return (b.sepc||0)-(a.sepc||0);if(sort==="elo")return(b.elo||0)-(a.elo||0);if(sort==="name")return safe(a.name).localeCompare(safe(b.name));return(b.gamesPlayed||0)-(a.gamesPlayed||0);});
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={{fontSize:14,fontWeight:800,color:G.text}}>👥 Người chơi ({players.length})</div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
        {onResetAll&&<button onClick={onResetAll} style={{padding:"5px 9px",borderRadius:7,border:`1px solid ${G.red}44`,background:"transparent",color:G.red,fontWeight:600,cursor:"pointer",fontSize:10}}>⚠️ Reset mùa</button>}
        
        <button onClick={onCouple} style={{...bS,color:G.pink,border:`1px solid ${G.pink}44`}}>💑</button>
        <button onClick={onAdd} style={bP}>+ Thêm</button>
      </div>
    </div>
    <div style={{display:"flex",gap:5,marginBottom:9,flexWrap:"wrap"}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Tên / SĐT..." style={{...iS,maxWidth:160}}/>
      <select value={fG} onChange={e=>setFG(e.target.value)} style={{...iS,maxWidth:80}}><option value="all">Tất cả</option><option value="M">♂ Nam</option><option value="F">♀ Nữ</option></select>
      <select value={fS} onChange={e=>setFS(e.target.value)} style={{...iS,maxWidth:100}}><option value="all">Mọi trình</option>{SKILL_LEVELS.map(s=><option key={s} value={s}>{s}</option>)}</select>
      <select value={fSt} onChange={e=>setFSt(e.target.value)} style={{...iS,maxWidth:115}}><option value="all">Tất cả</option><option value="in">✅ Check-in</option><option value="out">❌ Chưa vào</option><option value="playing">🔴 Đang đấu</option><option value="couple">💑 Couple</option></select>
      <select value={sort} onChange={e=>setSort(e.target.value)} style={{...iS,maxWidth:110}}><option value="sepc">↓ Sepc</option><option value="elo">↓ ELO</option><option value="name">↓ Tên</option><option value="games">↓ Trận</option></select>
    </div>
    <div style={{background:G.panel,borderRadius:16,border:`1px solid ${G.border}`,overflow:"hidden"}}>
      <div style={{display:"grid",gridTemplateColumns:"165px 45px 58px 88px 55px 44px 46px 68px 52px 90px",padding:"7px 12px",borderBottom:`1px solid ${G.border}`,fontSize:9,color:G.muted,fontWeight:700}}>
        <div>NGƯỜI CHƠI</div><div>G</div><div>TRÌNH</div><div>TRẠNG THÁI</div><div>ELO</div><div>TRẬN</div><div>WIN%</div><div>SEPC</div><div style={{color:"#00FFB2"}}>MÃ</div><div>ACTION</div>
      </div>
      {list.map((p,i)=>{
        const playing=playIds.has(p.id),wr=(p.gamesPlayed||0)?Math.round((p.wins||0)/(p.gamesPlayed||1)*100):0,k=p.sepc||0;
        const badges = playerBadges(p, history);
        return <div key={p.id} style={{display:"grid",gridTemplateColumns:"165px 45px 58px 88px 55px 44px 46px 68px 52px 90px",padding:"7px 12px",borderBottom:i<list.length-1?`1px solid ${G.border}22`:undefined,background:i%2?"transparent":G.card+"44",alignItems:"center"}}>
          <div style={{fontSize:11,fontWeight:700,color:G.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:6}}>
            <PlayerAvatar name={p.name} size={24} color={p.avatarColor} />
            <div style={{display:"flex",flexDirection:"column"}}>
              <div style={{display:"flex",alignItems:"center",gap:3}}>
                {safe(p.name)}{p.coupleId&&<CBadge type={p.coupleType}/>}
                {p.membership?.type && <span title="Thành viên" style={{fontSize:10}}>💎</span>}
              </div>
              <div style={{display:"flex",gap:2}}>
                {badges.map(b=><span key={b.label} title={b.label} style={{fontSize:9}}>{b.icon}</span>)}
              </div>
            </div>
          </div>
          <div><GBadge gender={p.gender}/></div><div><SBadge skill={p.skill}/></div>
          <div>{playing?<Chip label="🔴 Đấu" color={G.red}/>:p.checkedIn?<Chip label="⏳ Chờ" color={G.purple}/>:<Chip label="❌ Out" color={G.muted}/>}</div>
          <div style={{fontSize:12,fontWeight:900,color:SKILL_COLOR[p.skill]||G.muted}}>{p.elo||"?"}</div>
          <div style={{fontSize:10,color:G.muted}}>{p.gamesPlayed||0}</div>
          <div style={{fontSize:10,color:wr>=50?G.accent:G.red,fontWeight:700}}>{wr}%</div>
          <div style={{fontSize:11,fontWeight:800,color:k>0?G.gold:k<0?G.red:G.muted}}>{k>0?"+":""}{k}</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:10,fontWeight:800,fontFamily:"monospace",letterSpacing:1,color:p.viewerCode?"#00FFB2":G.dim,padding:"2px 4px",borderRadius:4,background:p.viewerCode?"#00FFB211":"transparent",border:p.viewerCode?"1px solid #00FFB233":"none"}}>{p.viewerCode||"-"}</span>
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {p.viewerCode&&<button onClick={e=>{e.stopPropagation();navigator.clipboard.writeText(p.viewerCode);e.target.textContent="✓";setTimeout(()=>{if(e.target)e.target.textContent="📋"},1500);}} title="Copy mã" style={{padding:"3px 7px",borderRadius:5,border:"none",background:"rgba(0,255,178,0.15)",color:"#00FFB2",cursor:"pointer",fontSize:9,fontWeight:700,flexShrink:0}}>📋</button>}
            {onEdit&&<button onClick={e=>{e.stopPropagation();onEdit(p);}} title="Sửa" style={{padding:"3px 7px",borderRadius:5,border:`1px solid ${G.border}`,background:"transparent",color:G.muted,cursor:"pointer",fontSize:9,fontWeight:700}}>✏️</button>}
            <button onClick={e=>{e.stopPropagation();onToggle(p.id);}} title={p.checkedIn?"Checkout":"Check-in"} style={{padding:"3px 8px",borderRadius:5,border:"none",cursor:"pointer",fontWeight:700,fontSize:9,background:p.checkedIn?"rgba(226,62,87,0.15)":`linear-gradient(135deg,${G.accent},${G.blue})`,color:p.checkedIn?"#E23E57":"#fff"}}>{p.checkedIn?"✕":"IN"}</button>
          </div>
        </div>;
      })}
    </div>
  </div>;
}

function QueueTab({queue,setQueue,courts,available,history,elapsed,onScore,onAssign,genQ,autoAss,onCustom,activeEvent}){
  const playIds=new Set(courts.flatMap(c=>c.match?[...(c.match.team1||[]),...(c.match.team2||[])].filter(Boolean).map(p=>p.id):[]));
  const gamesInEvent=(pid)=>history.filter(h=>h.eventId===activeEvent?.id&&[...(h.team1||[]),...(h.team2||[])].some(p=>(p?.id||p)===pid)).length;
  const waitMins=(p)=>p.checkedInAt?Math.floor((Date.now()-p.checkedInAt)/60000):null;
  const TIER_MAP={"1.0":"Mới","1.5":"Mới","2.0":"Cơ bản","2.5":"Cơ bản","3.0":"Trung bình","3.5":"Trung bình","4.0":"Nâng cao","4.5":"Nâng cao","5.0":"Chuyên","5.5":"Pro"};
  const TIER_CLR={"Mới":"#9ca3af","Cơ bản":"#60a5fa","Trung bình":"#34d399","Nâng cao":"#f59e0b","Chuyên":"#f87171","Pro":"#e879f9"};
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
      <div style={{fontSize:14,fontWeight:800,color:G.text}}>⚔️ Hàng chờ & Live</div>
      <div style={{display:"flex",gap:7}}>
        <button onClick={genQ} style={{border:`1px solid ${G.border}`,borderRadius:10,fontWeight:800,cursor:"pointer",fontSize:12,padding:"9px 14px",background:G.card,color:G.text}}>🎲 Tạo trận</button>
        <button onClick={onCustom} style={{border:`1px solid ${G.purple}55`,borderRadius:10,fontWeight:800,cursor:"pointer",fontSize:12,padding:"9px 14px",background:G.purple+"22",color:G.purple}}>✏️ Custom</button>
        <button onClick={autoAss} style={{border:"none",borderRadius:10,fontWeight:900,cursor:"pointer",fontSize:13,padding:"10px 20px",background:`linear-gradient(135deg,${G.accent},${G.blue})`,color:"#fff",boxShadow:`0 3px 14px ${G.accent}55`}}>▶ Auto gán</button>
      </div>
    </div>
    <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:16,padding:14,marginBottom:11}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:800,color:G.text}}>⏳ Đang chờ</div>
        <span style={{fontSize:12,fontWeight:700,color:G.purple,background:G.purple+"22",padding:"2px 9px",borderRadius:20,border:`1px solid ${G.purple}44`}}>{available.length} người</span>
      </div>
      {!available.length
        ?<div style={{color:G.dim,fontSize:12,textAlign:"center",padding:"16px 0"}}><div style={{fontSize:28,marginBottom:4}}>✅</div>Tất cả đang đấu</div>
        :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:8}}>
          {available.sort((a,b)=>(gamesInEvent(a.id)||0)-(gamesInEvent(b.id)||0)||(waitMins(b)||0)-(waitMins(a)||0)).map(p=>{
            const evG=gamesInEvent(p.id);
            const wm=waitMins(p);
            const tier=TIER_MAP[p.skill]||p.skill||"?";
            const tc=TIER_CLR[tier]||G.muted;
            const sp=p.sepc||0;
            return <div key={p.id} style={{background:G.card,borderRadius:12,padding:"12px",border:`1px solid ${evG===0?G.gold+"66":tc+"33"}`,position:"relative",overflow:"hidden"}}>
              <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:tc}}/>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8,marginTop:2}}>
                <PlayerAvatar name={p.name} size={28} color={p.avatarColor}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:800,color:G.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{safe(p.name)}</div>
                  <div style={{fontSize:9,color:tc,fontWeight:700}}>{tier} · {p.skill||"?"}</div>
                </div>
                <GBadge gender={p.gender}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4}}>
                <div style={{textAlign:"center",background:G.panel,borderRadius:7,padding:"6px 4px"}}>
                  <div style={{fontSize:18,fontWeight:900,color:evG===0?G.gold:G.accent,lineHeight:1}}>{evG}</div>
                  <div style={{fontSize:8,color:G.dim,marginTop:2}}>Trận</div>
                </div>
                <div style={{textAlign:"center",background:G.panel,borderRadius:7,padding:"6px 4px"}}>
                  <div style={{fontSize:16,fontWeight:900,color:wm!==null?(wm>30?G.red:wm>15?G.gold:G.muted):G.dim,lineHeight:1}}>{wm!==null?wm+"'":"--"}</div>
                  <div style={{fontSize:8,color:G.dim,marginTop:2}}>Chờ</div>
                </div>
                <div style={{textAlign:"center",background:G.panel,borderRadius:7,padding:"6px 4px"}}>
                  <div style={{fontSize:16,fontWeight:900,color:sp>0?G.gold:sp<0?G.red:G.muted,lineHeight:1}}>{sp>0?"+":""}{sp}</div>
                  <div style={{fontSize:8,color:G.dim,marginTop:2}}>Hệ số</div>
                </div>
              </div>
              {evG===0&&<div style={{fontSize:9,color:G.gold,fontWeight:700,textAlign:"center",marginTop:6}}>🆕 Chưa đấu hôm nay</div>}
            </div>;
          })}
        </div>
      }
    </div>
    {queue.length>0&&<div style={{marginBottom:11}}>
      <div style={{fontSize:9,color:G.muted,fontWeight:700,marginBottom:6}}>📋 Hàng chờ ({queue.length})</div>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>{queue.map((q,i)=><QRow key={i} q={q} idx={i} courts={courts} onAssign={onAssign} onRemove={()=>setQueue(p=>p.filter((_,j)=>j!==i))}/>)}</div>
    </div>}
    <div style={{fontSize:9,color:G.muted,fontWeight:700,marginBottom:6}}>🔴 ĐANG ĐẤU</div>
    {!courts.filter(c=>c.match).length?<div style={{color:G.dim,fontSize:11}}>Chưa có</div>:
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:9}}>
      {courts.filter(c=>c.match).map(c=><CourtCard key={c.id} court={c} elapsed={elapsed[c.id]||0} next={[]} onScore={onScore} onAssign={onAssign}/>)}
    </div>}
  </div>;
}

          <div style={{background:G.dim,borderRadius:3,height:5,overflow:"hidden"}}><div style={{height:"100%",width:`${(s.total/maxSk)*100}%`,background:SKILL_COLOR[s.skill],borderRadius:3}}/></div>
        </div>)}
      </div>
      <div style={{background:G.panel,borderRadius:11,border:`1px solid ${G.border}`,padding:13}}>
        <div style={{fontSize:8,fontWeight:700,color:G.muted,letterSpacing:1,marginBottom:10}}>📊 OVERVIEW</div>
        {[{l:"Check-in",v:ci.length,c:G.accent},{l:"Đang đấu",v:courts.filter(c=>c.match).length,c:G.red},{l:"Trận xong",v:history.length,c:"#34d399"},{l:"Couples",v:Math.round(players.filter(p=>p?.coupleId).length/2),c:G.pink}].map(s=>(
          <div key={s.l} style={{display:"flex",justifyContent:"space-between",padding:"3px 0"}}><span style={{fontSize:10,color:G.muted}}>{s.l}</span><span style={{fontSize:11,fontWeight:800,color:s.c}}>{s.v}</span></div>
        ))}
      </div>
    </div>
  </div>;
}

// ══════════════════════════════════════
// HISTORY TAB — lịch sử theo event & tổng hợp
// ══════════════════════════════════════

function HistoryTab({history, events, players, readOnly, onEditEvent, onDeleteEvent, activeEventId}){
  const [view, setView] = useState("event");   // "event" | "all"
  const [selEvId, setSelEvId] = useState(activeEventId||"all");
  const [search, setSearch] = useState("");
  const [filterDtype, setFilterDtype] = useState("all");
  const [editingEv, setEditingEv] = useState(null);

  // Gom history theo eventId
  const byEvent = {};
  history.forEach(h=>{
    const eid = h.eventId||"legacy";
    if(!byEvent[eid]) byEvent[eid]=[];
    byEvent[eid].push(h);
  });

  const eventList = events||[];
  const sq = safe(search).toLowerCase();

  const filterH = (hs) => {
    let arr = [...hs];
    if(sq) arr=arr.filter(h=>[...(h.team1||[]),...(h.team2||[])].filter(Boolean).some(p=>safe(p.name).toLowerCase().includes(sq)));
    if(filterDtype!=="all") arr=arr.filter(h=>h.dtype===filterDtype);
    return arr;
  };

  // Stats cho một list history
  const calcStats = (hs) => {
    const total=hs.length;
    const byDtype={};
    const topWinner={};
    hs.forEach(h=>{
      byDtype[h.dtype]=(byDtype[h.dtype]||0)+1;
      const wt=(h.winner===1?h.team1:h.team2)||[];
      wt.filter(Boolean).forEach(p=>{topWinner[p.id]=(topWinner[p.id]||{name:p.name,wins:0});topWinner[p.id].wins++;});
    });
    const topP=Object.values(topWinner).sort((a,b)=>b.wins-a.wins).slice(0,3);
    const avgEloD=total?Math.round(hs.reduce((s,h)=>s+(h.eloDelta||0),0)/total):0;
    return {total,byDtype,topP,avgEloD};
  };

  // Render 1 event block
  const renderEventBlock = (ev, hs, collapsed, onToggle) => {
    const st=calcStats(hs);
    return <div key={ev.id} style={{background:G.panel,borderRadius:12,border:`1px solid ${ev.id===activeEventId?G.accent+"66":G.border}`,marginBottom:12,overflow:"hidden"}}>
      {/* Header */}
      <div onClick={onToggle} style={{padding:"10px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",background:ev.id===activeEventId?G.accent+"10":G.card,borderBottom:collapsed?undefined:`1px solid ${G.border}`}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:13,fontWeight:800,color:G.text}}>{ev.name}</span>
            {ev.id===activeEventId&&<span></span>}
          </div>
          <div style={{display:"flex",gap:8,marginTop:3,flexWrap:"wrap"}}>
            <span style={{fontSize:10,color:G.muted}}>{ev.date}</span>
            {ev.location&&<span style={{fontSize:10,color:G.blue}}>📍 {ev.location}</span>}
            <span style={{fontSize:10,color:G.gold}}>⚔️ {hs.length} trận</span>
            {ev.note&&<span style={{fontSize:10,color:G.dim}}>💬 {ev.note}</span>}
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {!readOnly&&<>
            <button onClick={e=>{e.stopPropagation();setEditingEv(ev);}} style={{...bS,padding:"3px 8px",fontSize:10}}>✏️</button>
          </>}
          <span style={{color:G.muted,fontSize:12}}>{collapsed?"▶":"▼"}</span>
        </div>
      </div>

      {!collapsed&&<div style={{padding:"10px 14px"}}>
        {/* Stats row */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:7,marginBottom:12}}>
          <div style={{textAlign:"center",padding:"7px",borderRadius:8,background:G.card,border:`1px solid ${G.border}`}}><div style={{fontSize:18,fontWeight:900,color:G.accent}}>{st.total}</div><div style={{fontSize:8,color:G.muted}}>Tổng trận</div></div>
          <div style={{textAlign:"center",padding:"7px",borderRadius:8,background:G.card,border:`1px solid ${G.border}`}}><div style={{fontSize:18,fontWeight:900,color:G.gold}}>±{st.avgEloD}</div><div style={{fontSize:8,color:G.muted}}>Avg ELO Δ</div></div>
          <div style={{textAlign:"center",padding:"7px",borderRadius:8,background:G.card,border:`1px solid ${G.border}`,gridColumn:"span 2"}}>
            <div style={{fontSize:8,color:G.muted,marginBottom:4}}>TOP THẮNG</div>
            {st.topP.map((p,i)=><span key={i} style={{fontSize:9,color:G.gold,marginRight:6}}>{["🥇","🥈","🥉"][i]}{p.name}×{p.wins}</span>)}
            {!st.topP.length&&<span style={{fontSize:9,color:G.dim}}>–</span>}
          </div>
        </div>

        {/* Filters */}
        <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Tên..." style={{...iS,maxWidth:140,fontSize:11}}/>
          <select value={filterDtype} onChange={e=>setFilterDtype(e.target.value)} style={{...iS,maxWidth:110,fontSize:11}}>
            <option value="all">Tất cả kiểu</option>
            {DTYPE_OPT.map(d=><option key={d.val} value={d.val}>{d.label}</option>)}
          </select>
        </div>

        {/* Match list */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:7}}>
          {filterH(hs).map(h=><HCard key={h.id} h={h}/>)}
        </div>
        {!filterH(hs).length&&<div style={{textAlign:"center",color:G.dim,padding:"16px 0",fontSize:11}}>Không có trận nào</div>}
      </div>}
    </div>;
  };

  // State collapse per event
  const [collapsed, setCollapsed] = useState({});
  const togCollapse = id => setCollapsed(p=>({...p,[id]:!p[id]}));

  // View: theo event
  const renderByEvent = () => {
    if(!eventList.length) return <div style={{textAlign:"center",color:G.dim,padding:"32px 0",fontSize:12}}>Chưa có event nào. Tạo event đầu tiên!</div>;
    return eventList.slice().reverse().map(ev=>{
      const hs=byEvent[ev.id]||[];
      return renderEventBlock(ev, hs, !!collapsed[ev.id], ()=>togCollapse(ev.id));
    });
  };

  // View: tổng hợp tất cả
  const renderAll = () => {
    const allH = filterH(history);
    const st = calcStats(history);
    return <>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:14}}>
        {[{l:"Tổng trận",v:st.total,c:G.accent},{l:"Events",v:eventList.length,c:G.blue},{l:"Avg ELO Δ",v:`±${st.avgEloD}`,c:G.gold},{l:"Người chơi",v:players.length,c:G.purple},{l:"Hôm nay",v:(byEvent[activeEventId]||[]).length,c:G.red}].map(s=>(
          <div key={s.l} style={{textAlign:"center",padding:"10px 6px",borderRadius:10,background:G.panel,border:`1px solid ${G.border}`}}>
            <div style={{fontSize:20,fontWeight:900,color:s.c}}>{s.v}</div><div style={{fontSize:8,color:G.muted,marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>
      {/* By dtype */}
      <div style={{background:G.panel,borderRadius:10,border:`1px solid ${G.border}`,padding:"10px 14px",marginBottom:12}}>
        <div style={{fontSize:9,color:G.muted,fontWeight:700,letterSpacing:1,marginBottom:8}}>PHÂN LOẠI KIỂU ĐÔI</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          {DTYPE_OPT.map(d=>{const cnt=st.byDtype[d.val]||0;return <div key={d.val} style={{padding:"5px 12px",borderRadius:7,background:d.color+"15",border:`1px solid ${d.color}33`}}>
            <span style={{fontSize:11,color:d.color,fontWeight:700}}>{d.label}</span><span style={{fontSize:11,color:G.muted,marginLeft:6}}>{cnt} trận</span>
          </div>;})}
        </div>
      </div>
      {/* Filters */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Tên..." style={{...iS,maxWidth:150,fontSize:11}}/>
        <select value={filterDtype} onChange={e=>setFilterDtype(e.target.value)} style={{...iS,maxWidth:120,fontSize:11}}>
          <option value="all">Tất cả kiểu</option>
          {DTYPE_OPT.map(d=><option key={d.val} value={d.val}>{d.label}</option>)}
        </select>
        <span style={{fontSize:10,color:G.muted,alignSelf:"center"}}>{allH.length}/{history.length} trận</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:7}}>
        {allH.map(h=><HCard key={h.id} h={h}/>)}
      </div>
      {!allH.length&&<div style={{textAlign:"center",color:G.dim,padding:"24px 0",fontSize:11}}>Không tìm thấy</div>}
    </>;
  };

  return <div>
    {editingEv&&<EventModal event={editingEv} onSave={ev=>{onEditEvent&&onEditEvent(ev);setEditingEv(null);}} onClose={()=>setEditingEv(null)} isNew={false}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{fontSize:14,fontWeight:800,color:G.text}}>📋 Lịch sử trận đấu</div>
      <div style={{display:"flex",gap:4}}>
        <button onClick={()=>setView("event")} style={{...bS,color:view==="event"?G.accent:G.muted,borderColor:view==="event"?G.accent:G.border,fontSize:11}}>🗓️ Theo event</button>
        <button onClick={()=>setView("all")} style={{...bS,color:view==="all"?G.accent:G.muted,borderColor:view==="all"?G.accent:G.border,fontSize:11}}>📊 Tổng hợp</button>
      </div>
    </div>
    {view==="event"?renderByEvent():renderAll()}
  </div>;
}

// KIOSK TAB
// ══════════════════════════════════════
function KioskTab({players, onRegister, queue, courts, history}){
  const [step, setStep] = useState("welcome");
  const [form, setForm] = useState({name:"",gender:"M",skill:"3.0",dtype:"any",cwith:"",ctype:"couple"});
  const [err, setErr] = useState("");
  const [submitted, setSubmitted] = useState(null);
  const [nameSearch, setNameSearch] = useState("");
  const [autoReset, setAutoReset] = useState(null);
  const timerRef = useRef();
  const sf = (k,v) => setForm(f=>({...f,[k]:v}));

  useEffect(()=>{
    if(step==="success"){
      let t=20; setAutoReset(t);
      timerRef.current=setInterval(()=>{t--;setAutoReset(t);if(t<=0){clearInterval(timerRef.current);resetKiosk();}},1000);
    }
    return()=>clearInterval(timerRef.current);
  },[step]);

  const resetKiosk=()=>{setStep("welcome");setForm({name:"",gender:"M",skill:"3.0",dtype:"any",cwith:"",ctype:"couple"});setErr("");setSubmitted(null);setAutoReset(null);};
  const checkedIn = players.filter(p=>p&&p.checkedIn&&p.name);
  const nsSafe = safe(nameSearch).toLowerCase();
  const suggestions = nsSafe.length>=1?players.filter(p=>p&&p.name&&safe(p.name).toLowerCase().includes(nsSafe)).slice(0,5):[];
  const selectExisting = (p) => {setForm({name:p.name,gender:p.gender,skill:p.skill,dtype:p.dtype||"any",cwith:"",ctype:"couple"});setNameSearch("");setStep("form");};
  const submit = () => {
    const nm = safe(form.name).trim();
    if(!nm){setErr("Vui lòng nhập tên");return;} setErr("");
    const existing = players.find(p=>p&&safe(p.name).toLowerCase()===nm.toLowerCase());
    let playerData;
    if(existing){
      if(existing.checkedIn){setErr(`${nm} đã check in rồi!`);return;}
      const cid=form.cwith?(existing.coupleId||`couple-${uid()}`):existing.coupleId;
      playerData={...existing,gender:form.gender,skill:form.skill,dtype:form.dtype,checkedIn:true,coupleId:form.cwith?cid:existing.coupleId,coupleType:form.cwith?form.ctype:existing.coupleType,coupleWithId:form.cwith||null,isNew:false};
    } else {
      playerData={id:uid(),name:nm,gender:form.gender,skill:form.skill,elo:skillElo(form.skill),dtype:form.dtype,checkedIn:true,gamesPlayed:0,wins:0,lastPartners:[],coupleId:form.cwith?`couple-${uid()}`:null,coupleType:form.cwith?form.ctype:null,coupleWithId:form.cwith||null,createdAt:nowStr(),isNew:true};
    }
    onRegister(playerData);
    setSubmitted(playerData);
    setStep("success");
  };

  if(step==="welcome") return <div style={{minHeight:"80vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
    <div style={{width:"100%",maxWidth:500,textAlign:"center"}}>
      <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:32}}>
        {[{v:courts.filter(c=>c.match).length,l:"Sân live",c:G.red},{v:players.filter(p=>p?.checkedIn).length,l:"Check-in",c:G.accent},{v:queue.length,l:"Queue",c:G.purple}].map(s=>(
          <div key={s.l} style={{padding:"10px 20px",borderRadius:12,background:s.c+"18",border:`1px solid ${s.c}44`,textAlign:"center"}}>
            <div style={{fontSize:28,fontWeight:900,color:s.c}}>{s.v}</div><div style={{fontSize:11,color:G.muted}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:56,marginBottom:12}}>🏓</div>
      <div style={{fontSize:26,fontWeight:900,color:"#fff",marginBottom:8}}>Chào mừng!</div>
      <div style={{fontSize:14,color:G.muted,marginBottom:32}}>Tự đăng ký để vào hàng chờ</div>
      <div style={{marginBottom:20}}>
        <input value={nameSearch} onChange={e=>setNameSearch(e.target.value)} placeholder="Tìm tên nhanh..." style={{...iS,fontSize:16,padding:"12px 16px",borderRadius:12,textAlign:"center"}} autoComplete="off"/>
        {suggestions.length>0&&<div style={{marginTop:8,display:"flex",flexDirection:"column",gap:6}}>
          {suggestions.map(p=><button key={p.id} onClick={()=>selectExisting(p)} disabled={p.checkedIn}
            style={{padding:"10px 16px",borderRadius:10,border:`1px solid ${p.checkedIn?G.accent+"66":G.border}`,background:p.checkedIn?G.accent+"10":G.card,cursor:p.checkedIn?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:10,width:"100%"}}>
            <div style={{flex:1,textAlign:"left"}}><div style={{fontSize:13,fontWeight:700,color:p.checkedIn?G.muted:G.text}}>{safe(p.name)}</div>
            <div style={{display:"flex",gap:4,marginTop:2}}><GBadge gender={p.gender}/><SBadge skill={p.skill}/></div></div>
            {p.checkedIn?<span style={{fontSize:10,color:G.accent}}>✅ Đã vào</span>:<span style={{fontSize:10,color:G.accent}}>Chọn →</span>}
          </button>)}
        </div>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}><div style={{flex:1,height:1,background:G.border}}/><span style={{fontSize:12,color:G.dim}}>hoặc</span><div style={{flex:1,height:1,background:G.border}}/></div>
      <button onClick={()=>{setNameSearch("");setStep("form");}} style={{...bP,width:"100%",padding:"18px",fontSize:16,borderRadius:14}}>✏️ Đăng ký mới</button>
      {history.length>0&&<div style={{marginTop:28,padding:"14px 16px",borderRadius:12,background:G.panel,border:`1px solid ${G.border}`}}>
        <div style={{fontSize:11,color:G.gold,fontWeight:700,marginBottom:10}}>🏆 TOP SEPC</div>
        {[...players].filter(p=>p?.name).map(p=>({...p,k:sepc(p,history)})).sort((a,b)=>b.k-a.k).slice(0,3).map((p,i)=>(
          <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:i<2?6:0}}>
            <span style={{fontSize:14}}>{["🥇","🥈","🥉"][i]}</span>
            <span style={{fontSize:13,fontWeight:700,color:G.text,flex:1}}>{safe(p.name)}</span>
            <span style={{fontSize:13,fontWeight:800,color:G.gold}}>{p.k>0?"+":""}{p.k}</span>
          </div>
        ))}
      </div>}
    </div>
  </div>;

  if(step==="form") return <div style={{minHeight:"80vh",display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 16px"}}>
    <div style={{width:"100%",maxWidth:480}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
        <button onClick={resetKiosk} style={{...bS,padding:"6px 12px"}}>← Quay lại</button>
        <div><div style={{fontSize:18,fontWeight:900,color:"#fff"}}>📝 Thông tin</div></div>
      </div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,color:G.muted,fontWeight:700,marginBottom:6}}>👤 TÊN *</div>
        <input value={form.name} onChange={e=>{sf("name",e.target.value);setErr("");}} placeholder="Tên đầy đủ..." style={{...iS,fontSize:18,padding:"14px 16px",borderRadius:12,border:`2px solid ${form.name?G.accent:G.border}`}} autoFocus autoComplete="off"/>
      </div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,color:G.muted,fontWeight:700,marginBottom:6}}>⚥ GIỚI TÍNH</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {[{v:"M",l:"♂ Nam",c:"#60a5fa",e:"👨"},{v:"F",l:"♀ Nữ",c:"#f472b6",e:"👩"}].map(g=>(
            <button key={g.v} onClick={()=>sf("gender",g.v)} style={{padding:"16px",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:16,textAlign:"center",border:`3px solid ${form.gender===g.v?g.c:G.border}`,background:form.gender===g.v?g.c+"25":"transparent",color:form.gender===g.v?g.c:G.muted,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <span style={{fontSize:28}}>{g.e}</span>{g.l}
            </button>
          ))}
        </div>
      </div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,color:G.muted,fontWeight:700,marginBottom:6}}>🎯 TRÌNH ĐỘ</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6}}>
          {SKILL_LEVELS.map(s=>{const c=SKILL_COLOR[s];const sel=form.skill===s;return(
            <button key={s} onClick={()=>sf("skill",s)} style={{padding:"12px 4px",borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:13,textAlign:"center",border:`3px solid ${sel?c:G.border}`,background:sel?c+"28":"transparent",color:sel?c:G.muted,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <span style={{fontSize:15,fontWeight:900}}>{s}</span>
              <span style={{fontSize:8,fontWeight:400,color:sel?c:G.dim}}>{SKILL_DESC[s]}</span>

      </div>
      <div style={{marginBottom:16}}>
        <div style={{fontSize:11,color:G.muted,fontWeight:700,marginBottom:6}}>⚤ KIỂU ĐÔI</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {DTYPE_OPT.map(d=>{const sel=form.dtype===d.val;return(

          {checkedIn.filter(p=>safe(p.name).toLowerCase()!==safe(form.name).toLowerCase().trim()).map(p=>(
            <option key={p.id} value={p.id}>{safe(p.name)} ({p.gender==="M"?"Nam":"Nữ"}, {p.skill})</option>

        </select>
      </div>}
