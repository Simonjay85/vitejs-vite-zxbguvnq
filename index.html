      <button onClick={submit} style={{...bP,width:"100%",padding:"18px",fontSize:16,borderRadius:14}}>✅ Xác nhận & Vào hàng chờ</button>
    </div>
  </div>;

  if(step==="success"&&submitted) return <div style={{minHeight:"80vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
    <div style={{width:"100%",maxWidth:440,textAlign:"center"}}>
      <div style={{fontSize:64,marginBottom:8}}>🎉</div>
      <div style={{fontSize:22,fontWeight:900,color:G.accent,marginBottom:4}}>Check in thành công!</div>
      <div style={{fontSize:26,fontWeight:900,color:"#fff",marginBottom:16}}>{safe(submitted.name)}</div>
      <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:20,flexWrap:"wrap"}}>
        <GBadge gender={submitted.gender}/><SBadge skill={submitted.skill}/><DBadge dtype={submitted.dtype}/>
        {submitted.isNew&&<span style={{fontSize:9,color:G.gold,fontWeight:700}}>🆕 Mới</span>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:24}}>
        <div style={{padding:"16px",borderRadius:12,background:G.accent+"15",border:`1px solid ${G.accent}44`,textAlign:"center"}}>
          <div style={{fontSize:9,color:G.muted,marginBottom:4}}>TRẠNG THÁI</div>
          <div style={{fontSize:16,fontWeight:900,color:G.accent}}>⏳ Chờ đấu</div>
        </div>
        <div style={{padding:"16px",borderRadius:12,background:G.purple+"15",border:`1px solid ${G.purple}44`,textAlign:"center"}}>
          <div style={{fontSize:9,color:G.muted,marginBottom:4}}>ĐANG CHỜ</div>
          <div style={{fontSize:16,fontWeight:900,color:G.purple}}>{players.filter(p=>p?.checkedIn).length} người</div>
        </div>
      </div>
      <div style={{padding:"12px 16px",borderRadius:12,background:G.card,border:`1px solid ${G.border}`,marginBottom:20,fontSize:12,color:G.muted,lineHeight:1.7}}>Hỏi Host khi sân trống 🏓</div>
      <div style={{display:"flex",gap:10,alignItems:"center",justifyContent:"center",marginBottom:16}}>
        {courts.map(c=><div key={c.id} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 8px",borderRadius:7,background:c.match?G.red+"15":G.accent+"15",border:`1px solid ${c.match?G.red+"44":G.accent+"44"}`}}>
          <div style={{width:6,height:6,borderRadius:"50%",background:c.match?G.red:G.accent}}/>
          <span style={{fontSize:10,color:G.text}}>{c.name.replace("Sân ","S")}</span>
        </div>)}
      </div>
      <div style={{marginBottom:16,fontSize:12,color:G.dim}}>Reset sau <span style={{color:G.accent,fontWeight:700}}>{autoReset}s</span></div>
      <button onClick={resetKiosk} style={{...bP,width:"100%",padding:"14px",fontSize:14,borderRadius:12}}>🔄 Người tiếp theo</button>
    </div>
  </div>;
  return null;
}

// ══════════════════════════════════════
// MAIN TABS
// ══════════════════════════════════════
function App(){
  // Restore session từ sessionStorage — không cần đăng nhập lại khi refresh
  const savedMe = (() => { try { const s=sessionStorage.getItem('pb_me'); return s?JSON.parse(s):null; } catch{return null;} })();

  const [loading,  setLoading]  = useState(true);
  const [saving,   setSaving]   = useState(false);
  const [me,       setMe]       = useState(savedMe);
  const [accounts, setAccounts] = useState(defaultAccounts);
  const [players,  setPlayers]  = useState(()=>buildSeed(null));
  const [history,  setHistory]  = useState([]);
  const [courts,   setCourts]   = useState(()=>Array.from({length:5},(_,i)=>({id:`c${i+1}`,name:`Sân ${i+1}`,match:null,startedAt:null})));
  const [queue,    setQueue]    = useState([]);
  const [events,   setEvents]   = useState([]);
  const [activeEventId, setActiveEventId] = useState(null);
  const [numCourts,setNumCourts]= useState(5);
  const [tab,      setTab]      = useState("dashboard");
  const [modal,    setModal]    = useState(null);
  const [scoreTarget,setScoreTarget] = useState(null);
  const [subCourt, setSubCourt] = useState(null);
  const [editingPlayer,setEditingPlayer] = useState(null);
  const [tvMode,   setTvMode]   = useState(false);
  const [toast,    setToast]    = useState(null);
  const [elapsed,  setElapsed]  = useState({});
  const [pendingChallenges, setPendingChallenges] = useState([]);
  const [scoreConfirmations, setScoreConfirmations] = useState([]);
  const [resolveTarget, setResolveTarget] = useState(null);
  const [announcement, setAnnouncement] = useState("");
  const [paymentAlerts, setPaymentAlerts] = useState([]);
  const tickRef=useRef(), saveRef=useRef(), unsubRef=useRef();
  // Refs để saveAll luôn dùng state mới nhất — tránh stale closure
  const stateRef = useRef({});
  stateRef.current = {accounts,events,players,history,courts,queue,activeEventId,numCourts,pendingChallenges,scoreConfirmations,announcement,paymentAlerts};

  // Persist me vào sessionStorage — sống qua F5, chết khi đóng tab
  const login = (user) => {
    setMe(user);
    try { sessionStorage.setItem('pb_me', JSON.stringify(user)); } catch{}
    // Sau khi login, load lại data mới nhất từ Firebase để đồng bộ
    window.STORE?.load().then(db => {
      if(db) {
        console.log('🔄 Post-login Firebase sync');
        applyDb(db);
      }
    }).catch(()=>{});
  };
  const logout = () => {
    setMe(null);
    try { sessionStorage.removeItem('pb_me'); } catch{}
  };

  // ── SAVE — luôn dùng stateRef để có state mới nhất
  const saveAll = useCallback((extra={})=>{
    const st = {...stateRef.current, ...extra};
    setSaving(true);
    window._lastSavedAt = Date.now();
    STORE.save({
      accounts: st.accounts,
      events: st.events,
      numCourts: st.numCourts,
      activeEventId: st.activeEventId,
      history: st.history.slice(0,1000),
      players: st.players.map(p=>({
        id:p.id, name:p.name, gender:p.gender, skill:p.skill, elo:p.elo, baseElo:p.baseElo||p.elo,
        dtype:p.dtype, coupleId:p.coupleId||null, coupleType:p.coupleType||null,
        gamesPlayed:p.gamesPlayed||0, wins:p.wins||0, lastPartners:p.lastPartners||[],
        createdAt:p.createdAt, phone:p.phone||"", note:p.note||"", sepc:p.sepc||0,
        checkedIn: p.checkedIn === true, // ← lưu đúng boolean
        paid:p.paid||false, paidAmount:p.paidAmount||0, payMethod:p.payMethod||"transfer",
        totalSpent:p.totalSpent||0, monthSpent:p.monthSpent||0, eventCount:p.eventCount||0,
        viewerCode: p.viewerCode || null, paymentInfo: p.paymentInfo || null
      })),
      courts: st.courts.map(c=>({
        ...c, _startedAt: c.startedAt || null
      })),
      queue: st.queue,
      pendingChallenges: st.pendingChallenges || [],
      scoreConfirmations: st.scoreConfirmations || [],
      paymentAlerts: st.paymentAlerts || [],
    });
    setTimeout(()=>setSaving(false), 500);
  },[]); // không có dependency — dùng stateRef

  // Helper: áp dụng data từ DB vào state
  const applyDb = useCallback((db) => {
    if(!db || typeof db !== 'object') return;
    if(db.accounts && Array.isArray(db.accounts.admins) && db.accounts.admins.length > 0)
      setAccounts(db.accounts);
    if(Array.isArray(db.events) && db.events.length > 0) setEvents(db.events);
    if(Array.isArray(db.players) && db.players.length > 0) setPlayers(buildSeed(db.players));
    if(Array.isArray(db.history) && db.history.length > 0) setHistory(db.history);
    // Decode placeholder: "_noEvent" = null, undefined = null
    const evId = (!db.activeEventId || db.activeEventId === '_noEvent') ? null : db.activeEventId;
    setActiveEventId(evId);
    if(typeof db.numCourts === 'number' && db.numCourts >= 2) setNumCourts(db.numCourts);
    // Decode queue placeholder: ["_empty"] = []
    setQueue(Array.isArray(db.queue) && db.queue[0] !== '_empty' ? db.queue : []);
    setPendingChallenges(Array.isArray(db.pendingChallenges) ? db.pendingChallenges : []);
    setScoreConfirmations(Array.isArray(db.scoreConfirmations) ? db.scoreConfirmations : []);
    setPaymentAlerts(Array.isArray(db.paymentAlerts) ? db.paymentAlerts : []);
    if(db.announcement !== undefined) setAnnouncement(db.announcement);
    if(Array.isArray(db.courts) && db.courts.length > 0) {
      setCourts(db.courts.map(c=>({
        ...c,
        // _startedAt là Unix timestamp tuyệt đối → dùng trực tiếp
        // Mọi thiết bị đều tính timer từ cùng 1 gốc → đồng bộ hoàn hảo
        startedAt: c.match && c._startedAt ? c._startedAt : null
      })));
    }
  }, []);

  // ── LOAD
  useEffect(()=>{
    let subscribeFired = false;

    // Subscribe: nhận update từ Firebase
    // onValue luôn fire ngay với data mới nhất — đây là nguồn tin cậy nhất
    const unsub = window.STORE?.subscribe((fbData) => {
      if(!fbData) return;

      if(!subscribeFired) {
        // Lần đầu subscribe fire = data mới nhất từ Firebase
        // LUÔN apply, bỏ qua __initialData (có thể là cache cũ)
        subscribeFired = true;
        console.log('📡 Firebase sync:', fbData._updatedAt ? new Date(fbData._updatedAt).toLocaleTimeString() : '?',
          '| checkedIn:', fbData.players?.filter(p=>p?.checkedIn).length||0,
          '| event:', fbData.activeEventId||'none');
        applyDb(fbData);
        setLoading(false);
        return;
      }

      // Các lần sau: skip echo của chính mình
      if(fbData._deviceId === window._deviceId &&
         window._lastSavedAt &&
         (Date.now() - window._lastSavedAt) < 5000) {
        console.log('⏭️ Own echo skipped');
        return;
      }

      // Update từ thiết bị khác
      console.log('🔄 Remote update:', fbData._deviceId,
        '| event:', fbData.activeEventId||'none');
      applyDb(fbData);
    });

    // Fallback: nếu Firebase không kết nối được sau 5 giây, dùng cache
    const fallbackTimer = setTimeout(() => {
      if(!subscribeFired) {
        console.warn('⚠️ Firebase timeout — using cached data');
        const cached = window.__initialData;
        if(cached) applyDb(cached);
        setLoading(false);
        subscribeFired = true;
      }
    }, 5000);

    if(unsub) unsubRef.current = unsub;
    // Subscribe to notifications from other devices
    const notifUnsub = window.NOTIF?.subscribe((notifs) => {
      setMatchNotifs(notifs);
    });
    return () => {
      if(unsubRef.current) unsubRef.current();
      clearTimeout(fallbackTimer);
      if(notifUnsub) notifUnsub();
    };
  }, [applyDb]);

  // Không dùng auto-save — mọi action đều save trực tiếp để tránh race condition

  // Timer cho sân
  useEffect(()=>{
    tickRef.current=setInterval(()=>{
      setElapsed(prev=>{const n={...prev};courts.forEach(c=>{if(c.match&&c.startedAt)n[c.id]=Math.floor((Date.now()-c.startedAt)/1000);});return n;});
    },1000);
    return()=>clearInterval(tickRef.current);
  },[courts]);

  // Sync số sân khi numCourts thay đổi (giữ trận đang đấu)
  useEffect(()=>{
    setCourts(prev=>{
      if(prev.length===numCourts) return prev;
      return Array.from({length:numCourts},(_,i)=>prev[i]||{id:`c${i+1}`,name:`Sân ${i+1}`,match:null,startedAt:null});
    });
  },[numCourts]);

  const showT=(msg,type="ok")=>setToast({msg,type});
  const playIds   = new Set(courts.flatMap(c=>c.match?[...(c.match.team1||[]),...(c.match.team2||[])].filter(Boolean).map(p=>p.id):[]));
  const available = players.filter(p=>p&&p.checkedIn&&!playIds.has(p.id));
  const activeEvent = events.find(e=>e.id===activeEventId)||null;

  // ── EVENT MANAGEMENT
  const createEvent = (ev) => {
    const newEvents = [...stateRef.current.events, ev];
    const resetPlayers = serializePlayers(stateRef.current.players.map(x=>({...x,checkedIn:false})));
    // Áp dụng số sân từ event nếu có
    const newNumCourts = ev.numCourts || stateRef.current.numCourts;
    setEvents(newEvents);
    setActiveEventId(ev.id);
    setNumCourts(newNumCourts);
    setQueue([]);
    setPlayers(resetPlayers);
    showT(`🗓️ Event "${ev.name}" · ${newNumCourts} sân${ev.maxPlayers?` · tối đa ${ev.maxPlayers} người`:""}`);
    window._lastSavedAt=Date.now();
    STORE.save({...stateRef.current, events:newEvents, activeEventId:ev.id,
      numCourts:newNumCourts, queue:[], players:resetPlayers});
    setModal(null);
  };

  const editEvent = (ev) => {
    const newEvents = stateRef.current.events.map(e=>e.id===ev.id?ev:e);
    setEvents(newEvents);
    showT("Event đã cập nhật ✏️");
    window._lastSavedAt=Date.now();
    STORE.save({...stateRef.current, events:newEvents});
  };

  const endEvent = () => {
    if(!activeEvent) return;
    window._lastSavedAt = Date.now();
    const newEvents = stateRef.current.events.map(e=>e.id===activeEvent.id?{...e,ended:true,endedAt:nowStr()}:e);
    
    let newHist = [...stateRef.current.history];
    const newCourts = stateRef.current.courts.map(c => {
      if(c.match) {
        const m = c.match;
        const wT=(m.team1||[]).filter(Boolean);
        const lT=(m.team2||[]).filter(Boolean);
        if(wT.length && lT.length){
           newHist.unshift({id:uid(),eventId:activeEvent.id,courtId:c.id,dtype:m.dtype,team1:wT,team2:lT,winner:1,scoreWinner:11,scoreLoser:11,score:"11-11",eloDelta:0,time:nowStr()});
        }
        return {...c, match:null, startedAt:null};
      }
      return c;
    });

    const total=(Number(activeEvent.courtFee)||0)+(Number(activeEvent.extraFee)||0);
    const ciCount=stateRef.current.players.filter(p=>p?.checkedIn).length||1;
    const perPerson=activeEvent.feePerPerson>0?activeEvent.feePerPerson:(total>0?Math.ceil(total/ciCount):0);
    const resetPlayers = serializePlayers(stateRef.current.players.map(x=>{
      if(!x?.name) return {...x,checkedIn:false};
      const addSpent=x.checkedIn&&x.paid?(x.paidAmount||perPerson):0;
      const addEvent=x.checkedIn?1:0;
      return {...x,checkedIn:false,paid:false,paidAmount:0,
        totalSpent:(x.totalSpent||0)+addSpent,
        eventCount:(x.eventCount||0)+addEvent,
      };
    }));
    setEvents(newEvents);
    setActiveEventId(null);
    setQueue([]);
    setCourts(newCourts);
    setHistory(newHist);
    setPlayers(resetPlayers);
    showT(`Event "${activeEvent.name}" kết thúc 💾`);
    STORE.save({...stateRef.current, events:newEvents, activeEventId:null, queue:[], courts:newCourts, history:newHist, players:resetPlayers});
  };

  const serializePlayers=pl=>pl.map(p=>({
    id:p.id,name:p.name,gender:p.gender,skill:p.skill,elo:p.elo,baseElo:p.elo,
    viewerCode:p.viewerCode||null,
    dtype:p.dtype,coupleId:p.coupleId||null,coupleType:p.coupleType||null,
    gamesPlayed:p.gamesPlayed||0,wins:p.wins||0,lastPartners:p.lastPartners||[],
    createdAt:p.createdAt,phone:p.phone||"",note:p.note||"",sepc:p.sepc||0,
    checkedIn:p.checkedIn||false, paid:p.paid||false, isNew:p.isNew||false,
    paidAmount:p.paidAmount||0,payMethod:p.payMethod||"transfer",
    totalSpent:p.totalSpent||0,monthSpent:p.monthSpent||0,eventCount:p.eventCount||0,
    membership:p.membership||null,avatarColor:p.avatarColor||null,
    avatarImg:p.avatarImg||null,pendingSkill:p.pendingSkill||null
  }));

  const exportData = () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stateRef.current));
    const dlLink = document.createElement('a');
    dlLink.href = dataStr;
    dlLink.download = `pickleball_data_${new Date().toISOString().split('T')[0]}.json`;
    dlLink.click();
    showT("📥 Đã tải Data xuống");
  };

  const handleRegister=data=>{
    let codeStr = "";
    setPlayers(prev=>{
      const ex=prev.find(p=>p.id===data.id);
      const newVCode = ex?.viewerCode || data.viewerCode || genCode();
      codeStr = newVCode;
      const newData = {...data, viewerCode: newVCode, checkedIn: true};
      let upd=ex
        ? prev.map(p=>p.id===data.id?{...p,...newData}:p)
        : [...prev,newData];
      if(data.coupleWithId&&data.coupleId)
        upd=upd.map(p=>p.id===data.coupleWithId?{...p,coupleId:data.coupleId,coupleType:data.coupleType||"couple"}:p);
      window._lastSavedAt=Date.now();
      STORE.save({...stateRef.current,players:serializePlayers(upd)});
      return upd;
    });
    setTimeout(()=>showT(`${safe(data.name)} check-in. Mã xem: ${codeStr}`), 100);
  };

  const handleCheckInAll=()=>{
    const upd=players.map(p=>p?.name?{...p,checkedIn:true}:p);
    setPlayers(upd);
    showT(`✅ Check-in tất cả ${upd.filter(p=>p?.checkedIn).length} người!`);
    window._lastSavedAt=Date.now();
    STORE.save({...stateRef.current,players:serializePlayers(upd)});
  };

      const handleConfirmScore = (scId, playerId, action) => {
    const scList = stateRef.current.scoreConfirmations;
    const idx = scList.findIndex(x=>x.id===scId);
    if(idx < 0) return;
    const sc = {...scList[idx]};
    if(action === 'agreed') sc.confirmedBy = [...(sc.confirmedBy||[]), playerId];
    if(action === 'disputed') sc.disputedBy = [...(sc.disputedBy||[]), playerId];
    
    const newScList = [...scList];
    newScList[idx] = sc;
    setScoreConfirmations(newScList);
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, scoreConfirmations: newScList});
  };

    const handleDispute = (match) => {
    const type = match._dType || 'other';
    const note = match._dNote || '';
    const disputerEntry = {id: me.id, name: me.name||me.displayName||'Người chơi', type, note};
    
    let sc = stateRef.current.scoreConfirmations.find(sc => sc.matchId === match.id);
    let newScList;
    if (!sc) {
      sc = {
        id: `sc_${uid()}`,
        matchId: match.id,
        courtName: match.courtId ? `Sân ${match.courtId}` : "Lịch sử",
        team1: match.team1,
        team2: match.team2,
        sw: match.scoreWinner,
        sl: match.scoreLoser,
        confirmedBy: [],
        disputedBy: [disputerEntry],
        timestamp: Date.now()
      };
      newScList = [...stateRef.current.scoreConfirmations, sc];
    } else {
      const existing = sc.disputedBy || [];
      if(existing.some(d => (d.id||d) === me.id)) return; // already disputed
      const updSc = {...sc, disputedBy: [...existing, disputerEntry]};
      newScList = stateRef.current.scoreConfirmations.map(x=>x.id===sc.id?updSc:x);
    }
    setScoreConfirmations(newScList);
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, scoreConfirmations: newScList});
    showT("🚩 Đã gửi khiếu nại về BQL.");
  };

  const handleResolveSC = (scId) => {
    const newScList = stateRef.current.scoreConfirmations.filter(x=>x.id!==scId);
    setScoreConfirmations(newScList);
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, scoreConfirmations: newScList});
    showT("Đã xử lý khiếu nại!");
    setResolveTarget(null);
  };

  const handleResolveWithUpdate = (scId, winner, newSw, newSl) => {
    // Update the history entry for this dispute
    const sc = stateRef.current.scoreConfirmations.find(x=>x.id===scId);
    let newHistory = stateRef.current.history;
    if(sc) {
      // winner=1 means team1 (original winner) is confirmed; winner=2 means team2 replaces
      newHistory = stateRef.current.history.map(h => {
        if(h.id !== sc.matchId && sc.matchId) return h;
        // Match by matching team composition when matchId not reliable
        const t1match = sc.team1.every(p => (h.team1||[]).some(hp=>hp.id===p.id));
        const t2match = sc.team2.every(p => (h.team2||[]).some(hp=>hp.id===p.id));
        if(!t1match || !t2match) return h;
        if(winner === 1) {
          return {...h, winner:1, scoreWinner:newSw, scoreLoser:newSl, score:`${newSw}-${newSl}`, disputed:true};
        } else {
          // Swap teams: team2 becomes winner
          return {...h, winner:2, team1:sc.team2, team2:sc.team1, scoreWinner:newSw, scoreLoser:newSl, score:`${newSw}-${newSl}`, disputed:true};
        }
      });
      setHistory(newHistory);
    }
    const newScList = stateRef.current.scoreConfirmations.filter(x=>x.id!==scId);
    setScoreConfirmations(newScList);
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, scoreConfirmations: newScList, history: newHistory.slice(0,1000)});
    showT("✅ Đã cập nhật kết quả trận đấu!");
    setResolveTarget(null);
  };

  const approvePayment = (alertId, playerId) => {
    const p = stateRef.current.players.find(x=>x.id===playerId);
    if(p) {
      const updP = stateRef.current.players.map(x=>x.id===playerId?{...x, paid:true}:x);
      setPlayers(updP);
      stateRef.current.players = updP;
    }
    const newAlerts = stateRef.current.paymentAlerts.filter(a=>a.id!==alertId);
    setPaymentAlerts(newAlerts);
    stateRef.current.paymentAlerts = newAlerts;
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, paymentAlerts: newAlerts, players: serializePlayers(stateRef.current.players)});
    showT("Đã xác nhận thanh toán ✅");
  };

  const rejectPayment = (alertId) => {
    const newAlerts = stateRef.current.paymentAlerts.filter(a=>a.id!==alertId);
    setPaymentAlerts(newAlerts);
    stateRef.current.paymentAlerts = newAlerts;
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, paymentAlerts: newAlerts});
    showT("Đã xoá yêu cầu thanh toán");
  };

  const handlePaySubmit = (bill64) => {
    const newAlert = {
      id: `pa_${uid()}`,
      playerId: me.id,
      playerName: me.name,
      method: "upload",
      time: Date.now(),
      billBase64: bill64,
      status: 'pending'
    };
    const updAlerts = [...stateRef.current.paymentAlerts.filter(a => a.playerId !== me.id || a.status !== 'pending'), newAlert];
    setPaymentAlerts(updAlerts);
    stateRef.current.paymentAlerts = updAlerts;
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, paymentAlerts: updAlerts});
    showT("Đã gửi biên lai cho Host ✅");
  };

  const handleChallenge = ({challenger, partner, opp1, opp2}) => {
    if(!challenger||!partner||!opp1||!opp2) return;
    const challenge = {
      id: `ch_${uid()}`,
      team1: [challenger, partner],
      team2: [opp1, opp2],
      dtype: 'any',
      custom: true,
      isChallenge: true,
      status: 'pending',
      requestedAt: new Date().toISOString()
    };
    const newPending = [...stateRef.current.pendingChallenges, challenge];
    setPendingChallenges(newPending);
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, pendingChallenges: newPending});
    showT(`⚔️ Kèo đã gửi đến Admin — Vui lòng chờ duyệt!`);
  };

  const approveChallenge = (id) => {
    const ch = stateRef.current.pendingChallenges.find(c=>c.id===id);
    if(!ch) return;
    const newPending = stateRef.current.pendingChallenges.filter(c=>c.id!==id);
    setPendingChallenges(newPending);
    const match = {...ch, status: 'approved'};
    const newQueue = [...stateRef.current.queue, match];
    setQueue(newQueue);
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, pendingChallenges: newPending, queue: newQueue});
    showT(`✅ Đã đưa trận thách đấu vào Hàng chờ (Queue)!`);
  };

  const rejectChallenge = (id) => {
    const newPending = stateRef.current.pendingChallenges.filter(c=>c.id!==id);
    setPendingChallenges(newPending);
    window._lastSavedAt = Date.now();
    STORE.save({...stateRef.current, pendingChallenges: newPending});
    showT(`❌ Đã gửi thông báo từ chối thách đấu.`, 'warn');
  };

  const genQueue=()=>{
    if(available.length<4){showT("Cần ít nhất 4 người!","warn");return;}
    // Build the pool from truly available (not on any court, not already in queue)
    const inQueueIds=new Set(stateRef.current.queue.flatMap(m=>[...(m.team1||[]),...(m.team2||[])].filter(Boolean).map(p=>p.id)));
    const pool=available.filter(p=>!inQueueIds.has(p.id));
    if(pool.length<4){showT("Tất cả người chơi đã ở trong queue!","warn");return;}
    const newM=[],used=new Set();
    const cm={};pool.forEach(p=>{if(p?.coupleId){if(!cm[p.coupleId])cm[p.coupleId]=[];cm[p.coupleId].push(p);}});
    Object.values(cm).forEach(pair=>{
      if(pair.length===2&&!used.has(pair[0].id)&&!used.has(pair[1].id)){
        const others=pool.filter(p=>!used.has(p.id)&&p.id!==pair[0].id&&p.id!==pair[1].id);
        if(others.length>=2){const o1=others[rng(0,Math.min(2,others.length-1))],o2=others.filter(p=>p.id!==o1.id)[rng(0,Math.max(0,Math.min(2,others.length-2)))];
          if(o1&&o2){const dt=pair[0].gender!==pair[1].gender&&o1.gender!==o2.gender?"mixed":"any";newM.push({team1:[pair[0],pair[1]],team2:[o1,o2],dtype:dt,coupleMatch:true});[pair[0].id,pair[1].id,o1.id,o2.id].forEach(id=>used.add(id));}}
      }
    });
    for(const dt of["mixed","male","female","any"]){const p2=pool.filter(p=>!used.has(p.id));if(p2.length<4)break;const m=genMatch(p2,history,dt,stateRef.current.accounts?.algo);if(m){newM.push(m);[...m.team1,...m.team2].forEach(p=>used.add(p.id));}}
    if(!newM.length){showT("Không tạo được trận!","warn");return;}
    const ts=Date.now();setQueue(p=>[...p,...newM.map(m=>({...m,queuedAt:ts}))]);showT(`Đã thêm ${newM.length} trận ⚡`);
  };

  const [matchNotifs,setMatchNotifs]=useState([]);
  const assign=(cid,mdata)=>{
    const court=courts.find(c=>c.id===cid);
    // Guard: prevent assigning players already on another active court
    const allPlayingIds=new Set(stateRef.current.courts
      .filter(c=>c.id!==cid&&c.match)
      .flatMap(c=>[...(c.match.team1||[]),...(c.match.team2||[])].filter(Boolean).map(p=>p.id)));
    const matchPlayers=[...(mdata.team1||[]),...(mdata.team2||[])].filter(Boolean);
    const conflict=matchPlayers.find(p=>allPlayingIds.has(p.id));
    if(conflict){showT(`⚠️ ${safe(conflict.name)} đang đấu ở sân khác!`,"warn");return;}
    const newCourts=stateRef.current.courts.map(c=>c.id===cid?{...c,match:{...mdata},startedAt:Date.now()}:c);
    const newQueue=stateRef.current.queue.filter(q=>q!==mdata);
    setCourts(newCourts);
    setQueue(newQueue);
    showT(`Trận bắt đầu tại ${court?.name}! 🏓`);
    // Notify players with 5-minute countdown — save to Firebase so viewers see it
    const notifId=uid();
    setMatchNotifs(prev=>{
      const updated=[...prev,{id:notifId,match:mdata,courtName:court?.name||cid,countdown:300,ready:[],assignedAt:Date.now()}];
      window.NOTIF?.save(updated);
      return updated;
    });
    // Auto-remove after 6 minutes
    setTimeout(()=>setMatchNotifs(prev=>{const upd=prev.filter(n=>n.id!==notifId);window.NOTIF?.save(upd);return upd;}),360000);
    window._lastSavedAt=Date.now();
    STORE.save({...stateRef.current,courts:newCourts.map(c=>({...c,_startedAt:c.startedAt||null})),queue:newQueue});
  };
  const handleReadyChange=(notifId,status,playerId)=>{
    setMatchNotifs(prev=>{
      const updated=prev.map(n=>{
        if(n.id!==notifId)return n;
        if(status==="ready")return{...n,ready:[...(n.ready||[]),playerId]};
        if(status==="not_ready"){return{...n,notReady:[...(n.notReady||[]),playerId],ready:(n.ready||[]).filter(id=>id!==playerId)};}
        return n;
      });
      window.NOTIF?.save(updated);
      return updated;
    });
    if(status==="not_ready") showT("Host đã nhận được! Đang tìm người thay thế...","warn");
  };
  const handleStartMatch=(notifId)=>{
    // Dismiss the notification and officially mark match as started
    setMatchNotifs(prev=>{const upd=prev.filter(n=>n.id!==notifId);window.NOTIF?.save(upd);return upd;});
    showT("Trận đã bắt đầu! Chúc mọi người chơi vui! 🏓","ok");
  };

  const autoAssign=()=>{
    const free=stateRef.current.courts.filter(c=>!c.match);
    if(!free.length){showT("Không có sân trống!","warn");return;}
    if(!stateRef.current.queue.length){showT("Queue trống!","warn");return;}

    // Build set of ALL currently playing player IDs (from existing matches)
    const alreadyPlayingIds=new Set(
      stateRef.current.courts
        .filter(c=>c.match)
        .flatMap(c=>[...(c.match.team1||[]),...(c.match.team2||[])].filter(Boolean).map(p=>p.id))
    );

    let q=[...stateRef.current.queue];
    let newCourts=[...stateRef.current.courts];
    let assigned=0;

    free.forEach(c=>{
      if(!q.length)return;
      // Find first queue entry whose players don't conflict
      const idx=q.findIndex(m=>{
        const players=[...(m.team1||[]),...(m.team2||[])].filter(Boolean);
        return players.every(p=>!alreadyPlayingIds.has(p.id));
      });
      if(idx===-1)return; // no valid match for this court
      const m=q.splice(idx,1)[0];
      // Mark these players as "now playing" so next court iteration can't reuse them
      [...(m.team1||[]),...(m.team2||[])].filter(Boolean).forEach(p=>alreadyPlayingIds.add(p.id));
      newCourts=newCourts.map(x=>x.id===c.id?{...x,match:m,startedAt:Date.now()}:x);
      assigned++;
    });

    if(!assigned){showT("Không có trận hợp lệ (người chơi đang đấu)!","warn");return;}
    setCourts(newCourts);
    setQueue(q);
    showT(`Đã gán ${assigned} trận ▶`);
    window._lastSavedAt=Date.now();
    STORE.save({...stateRef.current,
      courts:newCourts.map(c=>({...c,_startedAt:c.startedAt||null})),
      queue:q
    });
  };

  const handleScore=(w,sw,sl)=>{
    if(!activeEvent){showT("Tạo Event trước khi nhập điểm!","warn");return;}
    const court=courts.find(c=>c.id===scoreTarget);if(!court?.match)return;
    const courtIdx=courts.findIndex(c=>c.id===scoreTarget);
    const m=court.match,wT=(w===1?m.team1:m.team2).filter(Boolean),lT=(w===1?m.team2:m.team1).filter(Boolean);
    if(!wT.length||!lT.length)return;
    const delta=Math.round(28*(1-(1/(1+Math.pow(10,(teamElo(lT)-teamElo(wT))/400)))));
    const t10=m.team1?.[0],t11=m.team1?.[1],t20=m.team2?.[0],t21=m.team2?.[1];
    const np={};if(t10&&t11){np[t10.id]=t11.id;np[t11.id]=t10.id;}if(t20&&t21){np[t20.id]=t21.id;np[t21.id]=t20.id;}
    const newHEntry={id:uid(),eventId:activeEventId,courtId:scoreTarget,dtype:m.dtype,team1:m.team1.filter(Boolean),team2:m.team2.filter(Boolean),winner:w,scoreWinner:sw,scoreLoser:sl,score:`${w===1?sw:sl}-${w===1?sl:sw}`,eloDelta:delta,time:nowStr()};
    const newHistory=[newHEntry,...history];
    setHistory(newHistory);

    const gm=activeEvent?.gameMode||"normal";
    // Tính toán courts và queue mới trước khi set state
    let newCourts=[...stateRef.current.courts];
    let newQueue=[...stateRef.current.queue];

    if(gm==="king"&&courtIdx===0){
      newCourts=newCourts.map(c=>c.id===scoreTarget?{...c,match:null,startedAt:null}:c);
      newQueue=[{team1:wT,team2:wT,dtype:m.dtype,keepWinner:true},...newQueue];
    } else if(gm==="ladder"){
      newCourts=newCourts.map(c=>c.id===scoreTarget?{...c,match:null,startedAt:null}:c);
      const winnerNextIdx=Math.max(0,courtIdx-1);
      const loserNextIdx=Math.min(newCourts.length-1,courtIdx+1);
      const promoted={team1:wT.slice(0,2),team2:wT.slice(0,2),dtype:m.dtype,promoteTo:winnerNextIdx,custom:true};
      const demoted={team1:lT.slice(0,2),team2:lT.slice(0,2),dtype:m.dtype,promoteTo:loserNextIdx,custom:true};
      newQueue=[promoted,demoted,...newQueue];
    } else {
      newCourts=newCourts.map(c=>c.id===scoreTarget?{...c,match:null,startedAt:null}:c);
    }

    setCourts(newCourts);
    setQueue(newQueue);
    setScoreTarget(null);

    const newSc = {
      id: `sc_${uid()}`,
      courtName: court.name || `Sân ${court.id}`,
      matchId: court.match.id,
      team1: wT,
      team2: lT,
      sw, sl,
      confirmedBy: [],
      disputedBy: [],
      timestamp: Date.now()
    };
    const newScoreConfirmations = [...stateRef.current.scoreConfirmations, newSc];
    setScoreConfirmations(newScoreConfirmations);

    // Tính players mới
    const newPlayers=stateRef.current.players.map(x=>{
      const isW=wT.some(v=>v.id===x.id),isL=lT.some(v=>v.id===x.id);
      if(!isW&&!isL)return x;
      const lp=np[x.id]?[np[x.id],...(x.lastPartners||[])].slice(0,4):x.lastPartners||[];
      const updP={...x,elo:x.elo+(isW?delta:-delta),gamesPlayed:(x.gamesPlayed||0)+1,wins:(x.wins||0)+(isW?1:0),lastPartners:lp};
      updP.sepc=Math.round(sepc(updP,newHistory)*10)/10;
      return updP;
    });
    setPlayers(newPlayers);

    // Save 1 lần duy nhất với toàn bộ state mới
    window._lastSavedAt=Date.now();
    STORE.save({...stateRef.current,
      history:newHistory.slice(0,1000),
      players:serializePlayers(newPlayers),
      courts:newCourts.map(c=>({...c,_startedAt:c.startedAt||null})),
      queue:newQueue,
      scoreConfirmations:newScoreConfirmations
    });

    const modMsg=gm==="king"?(courtIdx===0?" 👑 Vua giữ ngai!":""):gm==="ladder"?" 🪜 Di chuyển sân!":"";
    showT(`${wT.filter(Boolean).map(p=>safe(p.name).split(" ").pop()).join(" & ")} thắng ${sw}-${sl}! ±${delta} ELO${modMsg}`);
  };

  const toggleCI=id=>{
    setPlayers(prev=>{
      const p=prev.find(x=>x.id===id);
      if(!p) return prev;
      const newCI = p.checkedIn !== true;
      // Auto-generate viewerCode when checking in if not already set
      const vcode = p.viewerCode || (newCI ? genCode() : null);
      const upd=prev.map(x=>x.id===id?{...x,checkedIn:newCI,viewerCode:vcode}:x);
      showT(`${safe(p.name)} ${newCI?"check in ✅ · Mã: "+vcode:"rời session"}`);
      window._lastSavedAt = Date.now();
      STORE.save({...stateRef.current, players:serializePlayers(upd)});
      return upd;
    });
  };

  // Thay người khi bận
  const subPlayer=(cid,pOut,pIn)=>{
    if(!pOut||!pIn)return;
    const newCourts=stateRef.current.courts.map(c=>{
      if(c.id!==cid||!c.match)return c;
      const t1=c.match.team1.map(p=>p.id===pOut.id?pIn:p);
      const t2=c.match.team2.map(p=>p.id===pOut.id?pIn:p);
      return {...c,match:{...c.match,team1:t1,team2:t2}};
    });
    setCourts(newCourts);
    setSubCourt(null);
    showT(`🔄 ${safe(pOut.name)} → ${safe(pIn.name)}`);
    window._lastSavedAt=Date.now();
    STORE.save({...stateRef.current,
      courts:newCourts.map(c=>({...c,_startedAt:c.startedAt||null}))
    });
  };

  const savePlayer=p=>{
    const newPlayers=stateRef.current.players.map(x=>x.id===p.id?p:x);
    setPlayers(newPlayers);
    setEditingPlayer(null);
    showT(`💾 Đã lưu: ${safe(p.name)}`);
    window._lastSavedAt=Date.now();
    STORE.save({...stateRef.current, players:serializePlayers(newPlayers)});
  };

  const CSS=`
    @keyframes tIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    input,select{outline:none;}
    input::placeholder{color:${G.muted};}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-thumb{background:${G.border};border-radius:3px;}
    button:active{transform:scale(.97);}
    nav::-webkit-scrollbar{display:none;}
    nav{-ms-overflow-style:none;scrollbar-width:none;}
    .hscroll::-webkit-scrollbar{display:none;}
    .hscroll{-ms-overflow-style:none;scrollbar-width:none;}
  `;

  const scoreMatch=scoreTarget?courts.find(c=>c.id===scoreTarget)?.match:null;
  const isSA=me?.role===ROLES.SA;

  if(loading) return <><style>{CSS}</style><div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:G.bg,flexDirection:"column",gap:16}}><div style={{fontSize:48}}>🏓</div><div style={{color:G.muted,fontSize:13,letterSpacing:2}}>ĐANG TẢI...</div></div></>;
  if(!me) return <><style>{CSS}</style><Login accounts={accounts} players={players} onLogin={login} loading={false}/></>;
  if(me.role===ROLES.VIEWER) return <><style>{CSS}</style>
    {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
    <ViewerMode me={me} players={players} courts={courts} history={history} queue={queue} elapsed={elapsed} events={events} activeEventId={activeEventId} numCourts={numCourts} onLogout={logout} onChallenge={handleChallenge} pendingChallenges={pendingChallenges} matchNotifs={matchNotifs} onReadyChange={handleReadyChange} onShowProfile={setEditingPlayer} onDispute={handleDispute} scoreConfirmations={scoreConfirmations} paymentAlerts={paymentAlerts} onPaySubmit={handlePaySubmit}/>
    {editingPlayer&&<PlayerSelfEditModal player={editingPlayer} onSave={savePlayer} onClose={()=>setEditingPlayer(null)} toast={showT}/>}
  </>;

  return <div style={{background:G.bg,minHeight:"100vh",padding:window.innerWidth>1000?"24px 0":"0",color:G.text,fontFamily:"'Inter',system-ui,sans-serif"}}>
    <div style={{background:G.panel,backdropFilter:"blur(40px)",maxWidth:"100%",margin:"0 auto",borderRadius:window.innerWidth>1000?24:0,boxShadow:window.innerWidth>1000?"0 20px 60px rgba(0,224,255,0.08)":"none",minHeight:window.innerWidth>1000?"calc(100vh - 48px)":"100vh",position:"relative",overflow:"hidden",paddingBottom:120}}>
    <style>{CSS}</style>
    {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}

    {/* MODALS */}
    {modal==="qr"       &&<QRModal players={players} onRegister={handleRegister} onCheckInAll={handleCheckInAll} onClose={()=>setModal(null)} activeEvent={activeEvent}/>}
    {modal==="custom"   &&<CustomModal players={players} onAdd={m=>{setQueue(p=>[...p,{...m,custom:true,queuedAt:Date.now()}]);setModal(null);showT("Custom ✏️");}} onClose={()=>setModal(null)}/>}
    {modal==="couple"   &&<CoupleModal players={players} setPlayers={setPlayers} onClose={()=>setModal(null)}/>}
    {modal==="admin"    &&<AdminModal accounts={accounts} setAccounts={setAccounts} me={me} onClose={()=>setModal(null)} toast={showT} numCourts={numCourts} setNumCourts={setNumCourts} onSaveAccounts={newAcc=>saveAll({accounts:newAcc})}/>}
    {modal==="announcement" && (
      <div style={{position:"fixed",inset:0,zIndex:999,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div style={{background:G.panel,borderRadius:20,width:"100%",maxWidth:500,padding:24,border:`1px solid ${G.border}`}}>
          <h3 style={{marginTop:0,color:G.accent}}>📢 Chọn câu Thông báo nhanh</h3>
          <div style={{fontSize:13,color:G.muted,marginBottom:16}}>Thông báo sẽ hiện ngay trên màn hình TV và ứng dụng người chơi.</div>
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:20}}>
            {["Sắp tới phần trao giải, mời mọi người tập hợp!","Xin mời Cúp Vàng và Cúp Bạc vào sân chuẩn bị!","Xin các VĐV nộp hình ảnh Bill chuyển khoản để xác nhận!","Xe máy xin vui lòng dắt sang bãi kế bên!"].map(txt=>(
               <button key={txt} onClick={()=>{setAnnouncement(txt);saveAll({announcement:txt});showT("Đã phát thông báo!");setModal(null);}} style={{...bS,textAlign:"left",padding:"12px",fontSize:14,border:`1px solid ${G.border}`,color:G.text}}>
                 {txt}
               </button>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <input id="custom-ann" placeholder="Hoặc tự gõ thông báo..." style={{flex:1,padding:"12px",borderRadius:12,border:`1px solid ${G.border}`,background:G.card,color:G.text,fontSize:14,outline:"none"}} />
            <button onClick={()=>{const el=document.getElementById("custom-ann");if(el&&el.value){setAnnouncement(el.value);saveAll({announcement:el.value});showT("Đã phát!");setModal(null);}}} style={{...bP,padding:"0 16px"}}>Phát</button>
          </div>
          <div style={{marginTop:16,display:"flex",gap:8}}>
             <button onClick={()=>{setAnnouncement("");saveAll({announcement:""});showT("Đã xoá thông báo hiện tại.");setModal(null);}} style={{...bS,flex:1,color:G.red,border:`1px solid ${G.red}44`}}>Tắt thông báo đang chạy</button>
             <button onClick={()=>setModal(null)} style={{...bS,flex:1}}>Đóng</button>
          </div>
        </div>
      </div>
    )}
    {modal==="newEvent" &&<EventModal isNew onSave={createEvent} onClose={()=>setModal(null)} currentNumCourts={numCourts}/>}
    {modal==="editEvent"&&activeEvent&&<EventModal isNew={false} event={activeEvent} onClose={()=>setModal(null)} currentNumCourts={numCourts} onSave={ev=>{
      const newEvs=stateRef.current.events.map(e=>e.id===ev.id?ev:e);
      setEvents(newEvs);window._lastSavedAt=Date.now();STORE.save({...stateRef.current,events:newEvs});
      showT("Đã cập nhật Event");setModal(null);
    }}/>}
    {scoreTarget&&scoreMatch&&<ScoreModal match={scoreMatch} onConfirm={handleScore} onClose={()=>setScoreTarget(null)}/>}
    {subCourt&&<SubModal court={subCourt} players={players} playIds={playIds} onSub={subPlayer} onClose={()=>setSubCourt(null)}/>}
    {editingPlayer&&(me.role===ROLES.VIEWER)&&<PlayerSelfEditModal player={editingPlayer} onSave={savePlayer} onClose={()=>setEditingPlayer(null)} toast={showT}/>}
    {editingPlayer&&(me.role!==ROLES.VIEWER)&&<EditPlayerModal player={editingPlayer} onSave={savePlayer} onClose={()=>setEditingPlayer(null)} toast={showT} history={history}/>}
    {tvMode&&<TVMode courts={courts} elapsed={elapsed} queue={queue} players={players} history={history} onClose={()=>setTvMode(false)} activeEvent={activeEvent}/>}

    {/* DISPUTE RESOLVE MODAL */}
    {/* SCORE DISPUTE ALERT */}
    {resolveTarget&&<div style={{position:"fixed",inset:0,zIndex:800,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      {(()=>{
        const sc=resolveTarget;
        const t1n=(sc.team1||[]).map(p=>safe(p.name).split(" ")[0]).join(" & ")||"Đội A";
        const t2n=(sc.team2||[]).map(p=>safe(p.name).split(" ")[0]).join(" & ")||"Đội B";
        const DisputeResolveInner=()=>{
          const [selW,setSelW]=React.useState(null);
          const [sw2,setSw2]=React.useState(sc.sw||11);
          const [sl2,setSl2]=React.useState(sc.sl||0);

// Đợi Firebase load xong rồi mới render app
function mountApp() {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
}

if (window._fbReady) {
  mountApp();
} else {
  document.addEventListener('fb-ready', mountApp, { once: true });
  // Fallback: nếu sau 5 giây vẫn chưa có Firebase, render với localStorage
  setTimeout(() => {
    if (!window._fbReady) {
      console.warn('Firebase timeout — using localStorage only');
      window.STORE = {
        save(data) { try { localStorage.setItem('pb_v6_save', JSON.stringify(data)); } catch(e) {} },
        async load() { try { const s = localStorage.getItem('pb_v6_save'); return s ? JSON.parse(s) : null; } catch { return null; } },
        subscribe() { return ()=>{}; }
      };
      mountApp();
    }
  }, 5000);
}

      const isStandalone = window.navigator.standalone === true;
      if(isIOS && !isStandalone && !sessionStorage.getItem('ios-prompt-shown')) {
        sessionStorage.setItem('ios-prompt-shown', '1');
        setTimeout(() => {
          const d = document.createElement('div');
          d.innerHTML = `<div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111720;border:1px solid #00FFB2;border-radius:16px;padding:14px 18px;color:#E8EFF8;font-family:sans-serif;font-size:13px;z-index:9999;max-width:320px;width:90%;box-shadow:0 8px 32px #000a;text-align:center;">
            <div style="font-size:20px;margin-bottom:6px">📲 Cài app</div>
            <div style="color:#4A5568;font-size:12px;margin-bottom:10px">Nhấn <b style="color:#00FFB2">Share</b> → <b style="color:#00FFB2">"Add to Home Screen"</b> để dùng như app thật</div>
            <button onclick="this.parentElement.parentElement.remove()" style="background:#00FFB2;color:#000;border:none;border-radius:8px;padding:7px 20px;font-weight:700;cursor:pointer;font-size:12px">OK</button>
          </div>`;
          document.body.appendChild(d);
        }, 3000);
      }
    });
  </script>
</body>
</html>
