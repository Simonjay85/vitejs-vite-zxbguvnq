        // Đánh dấu thời gian save gần nhất

          if(snap.exists()) {

            try { localStorage.setItem(LS_KEY, JSON.stringify({...d, _cachedAt: Date.now()})); } catch(e) {}

          }

            const s = localStorage.getItem(LS_KEY);
            if(s) { const d=JSON.parse(s); if(d&&typeof d==='object') return d; }
          } catch(e2) {}
        }
        return null;
      },

        return onValue(ref(db, FB_PATH), snap => {
          if(!snap.exists()) return;
          const d = snap.val();
          try { localStorage.setItem(LS_KEY, JSON.stringify({...d, _cachedAt: Date.now()})); } catch(e) {}
          cb(d);
        });
      }
    };

    (async () => {

      }

// ── KOOTORO
function kootoro(player, history) {
  if(!player||!history) return 0;
  let k=0;
  history.forEach(h=>{
    if(!h?.team1||!h?.team2) return;
    const in1=h.team1.some(p=>p?.id===player.id), in2=h.team2.some(p=>p?.id===player.id);
    if(!in1&&!in2) return;
    const won=(in1&&h.winner===1)||(in2&&h.winner===2);
    const my=(in1?h.team1:h.team2).filter(Boolean), opp=(in1?h.team2:h.team1).filter(Boolean);
    const diff=teamElo(opp)-teamElo(my), margin=Math.abs((h.scoreWinner||11)-(h.scoreLoser||0));
    let pts=won?10:-3; pts+=(diff/100)*(won?4:-2); pts+=won?Math.min(margin*0.5,4):-(margin*0.2);
    k+=pts;
  });
  return Math.round(k*10)/10;
}

// ── SCORE
const validScore = (a,b) => { if(isNaN(a)||isNaN(b)||a<0||b<0||a===b) return false; const w=Math.max(a,b),l=Math.min(a,b); return l<10?w===11:w-l===2; };
const winner = (a,b) => validScore(a,b)?(a>b?1:2):null;

// ── MATCH GEN
function genMatch(pool, history, dtype) {
  let cands=[...pool].filter(p=>p?.id&&p?.name);
  if(dtype==="male") cands=cands.filter(p=>p.gender==="M");
  else if(dtype==="female") cands=cands.filter(p=>p.gender==="F");
  if(cands.length<4) return null;
  const pri=p=>history.filter(h=>h?.team1&&h?.team2&&[...h.team1,...h.team2].some(x=>x?.id===p.id)).length+(p.gamesPlayed||0)*0.5;
  const top=[...cands].sort((a,b)=>pri(a)-pri(b)).slice(0,Math.min(cands.length,20));
  let best=null, bs=Infinity;
  for(let i=0;i<800;i++){
    const sh=[...top].sort(()=>Math.random()-0.5), [a,b,c,d]=sh;
    if(!a||!b||!c||!d) continue;
    if(dtype==="male"&&[a,b,c,d].some(x=>x.gender!=="M")) continue;
    if(dtype==="female"&&[a,b,c,d].some(x=>x.gender!=="F")) continue;
    if(dtype==="mixed"&&!(a.gender!==b.gender&&c.gender!==d.gender)) continue;
    const rep=(a.lastPartners?.includes(b.id)?280:0)+(c.lastPartners?.includes(d.id)?280:0);
    const diff=Math.abs(teamElo([a,b])-teamElo([c,d]));
    const sc=rep+(diff>40?diff*2.5:diff*0.4)+(pri(a)+pri(b)+pri(c)+pri(d))*1.2;
    if(sc<bs){bs=sc;best={team1:[a,b],team2:[c,d],diff:Math.round(diff),dtype};}
  }
  return best;
}

  [[list[0].id,list[3].id,"couple"],[list[8].id,list[9].id,"spouse"],[list[20].id,list[21].id,"couple"]].forEach(([id1,id2,ct])=>{

function Login({accounts,onLogin,loading}){
  const [mode,setMode]=useState("choose");
  const [user,setUser]=useState(""),[pass,setPass]=useState(""),[code,setCode]=useState(""),[err,setErr]=useState("");
  const [checking,setChecking]=useState(false);

  const tryAdmin=async()=>{
    setChecking(true);setErr("");
    try{
      // Fetch fresh accounts từ Firebase để host thiết bị khác login được
      const fresh=await window.STORE?.load();
      const freshAccounts=fresh?.accounts||accounts;
      const all=[...(freshAccounts?.admins||[]),...(freshAccounts?.hosts||[])];
      const u=all.find(u=>safe(u.name).toLowerCase()===safe(user).toLowerCase().trim()&&u.password===pass);
      u?onLogin(u):setErr("Tên hoặc mật khẩu không đúng");
    }catch(e){
      // Fallback local accounts
      const all=[...(accounts?.admins||[]),...(accounts?.hosts||[])];
      const u=all.find(u=>safe(u.name).toLowerCase()===safe(user).toLowerCase().trim()&&u.password===pass);
      u?onLogin(u):setErr("Tên hoặc mật khẩu không đúng");
    }
    setChecking(false);
  };

  // Viewer: luôn fetch Firebase để lấy viewerCode mới nhất
  const tryViewer=async()=>{
    const inputCode=safe(code).trim().toUpperCase();
    if(!inputCode){setErr("Nhập mã truy cập");return;}
    setChecking(true);setErr("");
    try{
      // Thử fresh từ Firebase trước
      const fresh=await window.STORE?.load();
      const freshCode=(fresh?.accounts?.viewerCode||"").toUpperCase();
      const localCode=(accounts?.viewerCode||"PICKLE").toUpperCase();
      if(inputCode===freshCode||inputCode===localCode||inputCode==="PICKLE"){
        onLogin({id:"v_"+uid(),name:"Khán giả",role:ROLES.VIEWER,password:""});
      } else {
        setErr("Mã truy cập không đúng");
      }
    }catch(e){
      // Fallback local
      const localCode=(accounts?.viewerCode||"PICKLE").toUpperCase();
      inputCode===localCode
        ?onLogin({id:"v_"+uid(),name:"Khán giả",role:ROLES.VIEWER,password:""})
        :setErr("Mã truy cập không đúng");
    }
    setChecking(false);
  };
  return <div style={{minHeight:"100vh",background:G.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{width:420,maxWidth:"100%"}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{width:64,height:64,borderRadius:18,background:`linear-gradient(135deg,${G.accent},${G.blue})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 12px"}}>🏓</div>
        <div style={{fontSize:22,fontWeight:900,color:"#fff",letterSpacing:2}}>PICKLEBALL SOCIAL</div>
        <div style={{fontSize:11,color:G.muted,marginTop:4,letterSpacing:1.5}}>KOOTORO RATING SYSTEM</div>
      </div>
      {mode==="choose"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <button onClick={()=>{setMode("admin");setErr("");}} style={{...bP,padding:"16px",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}><span>🎮</span> Đăng nhập Admin / Host</button>
        <button onClick={()=>{setMode("viewer");setErr("");}} style={{...bS,padding:"16px",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:10,border:`1px solid ${G.gold}55`,color:G.gold}}><span>👁</span> Xem điểm & Bảng xếp hạng</button>
        <div style={{textAlign:"center",padding:"10px",borderRadius:8,background:G.panel,border:`1px solid ${G.border}`,fontSize:10,color:G.dim}}>💡 Khán giả dùng mã truy cập do Host cung cấp</div>
      </div>}
      {mode==="admin"&&<div style={{background:G.panel,borderRadius:16,padding:24,border:`1px solid ${G.border}`}}>
        <div style={{fontSize:14,fontWeight:800,color:G.text,marginBottom:16}}>🎮 Đăng nhập quản trị</div>
        <Fld label="TÊN ĐĂNG NHẬP"><input value={user} onChange={e=>{setUser(e.target.value);setErr("");}} placeholder="Super Admin..." style={iS} onKeyDown={e=>e.key==="Enter"&&tryAdmin()}/></Fld>
        <Fld label="MẬT KHẨU"><input type="password" value={pass} onChange={e=>{setPass(e.target.value);setErr("");}} placeholder="Mật khẩu..." style={iS} onKeyDown={e=>e.key==="Enter"&&tryAdmin()}/></Fld>
        {err&&<div style={{color:G.red,fontSize:11,marginBottom:12,padding:"6px 10px",borderRadius:6,background:G.red+"12"}}>{err}</div>}
        <div style={{display:"flex",gap:8}}>
          <button onClick={tryAdmin} disabled={checking} style={{...bP,flex:1,padding:"11px 0",opacity:checking?0.6:1}}>{checking?"⏳ Đang kiểm tra...":"Đăng nhập ▶"}</button>
          <button onClick={()=>{setMode("choose");setErr("");}} style={bS}>← Quay lại</button>
        </div>
        <div style={{marginTop:12,padding:"8px 12px",borderRadius:8,background:G.card,fontSize:10,color:G.dim}}>Mặc định: <span style={{color:G.accent}}>Super Admin</span> / <span style={{color:G.accent}}>admin2024</span></div>
      </div>}
      {mode==="viewer"&&<div style={{background:G.panel,borderRadius:16,padding:24,border:`1px solid ${G.gold}33`}}>
        <div style={{fontSize:14,fontWeight:800,color:G.gold,marginBottom:16}}>👁 Xem trực tiếp</div>
        <Fld label="MÃ TRUY CẬP">
          <input value={code} onChange={e=>{setCode(e.target.value.toUpperCase());setErr("");}} placeholder="VD: AB12CD" maxLength={8}
            style={{...iS,textAlign:"center",fontSize:24,fontWeight:900,letterSpacing:8,color:G.gold}} onKeyDown={e=>e.key==="Enter"&&tryViewer()}/>
        </Fld>
        {err&&<div style={{color:G.red,fontSize:11,marginBottom:12,padding:"6px 10px",borderRadius:6,background:G.red+"12"}}>{err}</div>}
        <div style={{display:"flex",gap:8}}>
          <button onClick={tryViewer} disabled={checking} style={{...bP,flex:1,padding:"11px 0",background:`linear-gradient(135deg,${G.gold},${G.red})`,opacity:checking?0.6:1}}>{checking?"⏳ Đang kiểm tra...":"Vào xem 👁"}</button>
          <button onClick={()=>{setMode("choose");setErr("");}} style={bS}>← Quay lại</button>
        </div>
      </div>}
    </div>
  </div>;
}

        <div style={{fontSize:10,color:G.muted,marginBottom:16}}>Màn login → "Xem trực tiếp" → nhập mã trên</div>

      <div style={{fontSize:13,color:G.text,marginBottom:14}}>Số sân hiện tại: <b style={{color:G.accent,fontSize:22}}>{numCourts}</b></div>

          <span>🎮</span><div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:G.text}}>{h.name}</div></div><RBadge role={h.role}/>

function ChgPass({me,accounts,setAccounts,toast,onSave}){
  const [o,setO]=useState(""),[n,setN]=useState(""),[c2,setC2]=useState(""),[err,setErr]=useState("");
  const go=()=>{
    if(me.password!==o){setErr("Mật khẩu cũ không đúng");return;}
    if(n.length<4){setErr("Tối thiểu 4 ký tự");return;}
    if(n!==c2){setErr("Xác nhận không khớp");return;}
    const newAccounts={...accounts,admins:(accounts.admins||[]).map(a=>a.id===me.id?{...a,password:n}:a),hosts:(accounts.hosts||[]).map(h=>h.id===me.id?{...h,password:n}:h)};
    setAccounts(newAccounts);
    onSave(newAccounts); // lưu Firebase ngay
    setO("");setN("");setC2("");setErr("");toast("Đã đổi mật khẩu 🔐");
  };
  return <>
    <Fld label="MẬT KHẨU HIỆN TẠI"><input type="password" value={o} onChange={e=>{setO(e.target.value);setErr("");}} style={iS}/></Fld>
    <Fld label="MẬT KHẨU MỚI"><input type="password" value={n} onChange={e=>{setN(e.target.value);setErr("");}} style={iS}/></Fld>
    <Fld label="XÁC NHẬN"><input type="password" value={c2} onChange={e=>{setC2(e.target.value);setErr("");}} style={iS} onKeyDown={e=>e.key==="Enter"&&go()}/></Fld>
    {err&&<div style={{color:G.red,fontSize:11,marginBottom:10}}>{err}</div>}
    <button onClick={go} style={{...bP,width:"100%"}}>🔐 Đổi mật khẩu</button>
  </>;
}

function ScoreModal({match,onConfirm,onClose}){
  const [s1,setS1]=useState(""),[s2,setS2]=useState("");
  const n1=parseInt(s1)||0,n2=parseInt(s2)||0;
  const ok=s1!==""&&s2!==""&&validScore(n1,n2),wi=ok?winner(n1,n2):null,deuced=n1>=10&&n2>=10;
  const hint=()=>{if(!s1||!s2)return"Nhập tỉ số";if(n1===n2)return"Không thể bằng điểm";if(!deuced){const w=Math.max(n1,n2);if(w<11)return"Cần đến 11 điểm";if(w>11)return"Không quá 11 khi chưa deuce";}else{const d=Math.abs(n1-n2);if(d<2)return"Deuce: dẫn 2 điểm";if(d>2)return"Dẫn đúng 2 là thắng";}return ok?`✅ Đội ${wi===1?"A":"B"} thắng!`:"Không hợp lệ";};
  const t1n=(match?.team1||[]).filter(Boolean).map(p=>safe(p.name).split(" ").pop()).join(" & ")||"A";
  const t2n=(match?.team2||[]).filter(Boolean).map(p=>safe(p.name).split(" ").pop()).join(" & ")||"B";
  return <MBox title="📊 Nhập tỉ số" sub="11 điểm thắng · Deuce 10-10: dẫn 2" onClose={onClose} w={380}>
    <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:10,alignItems:"center",marginBottom:14}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:11,color:G.accent,fontWeight:700,marginBottom:5}}>{t1n}</div>
        <input type="number" min="0" max="99" value={s1} onChange={e=>setS1(e.target.value)} placeholder="0" style={{...iS,fontSize:30,fontWeight:900,textAlign:"center",padding:"10px 6px",color:ok&&wi===1?G.accent:G.text,border:`2px solid ${ok&&wi===1?G.accent:G.border}`}}/>
      </div>
      <div style={{fontSize:16,fontWeight:800,color:G.dim,marginTop:14,textAlign:"center"}}>:</div>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:11,color:G.gold,fontWeight:700,marginBottom:5}}>{t2n}</div>
        <input type="number" min="0" max="99" value={s2} onChange={e=>setS2(e.target.value)} placeholder="0" style={{...iS,fontSize:30,fontWeight:900,textAlign:"center",padding:"10px 6px",color:ok&&wi===2?G.gold:G.text,border:`2px solid ${ok&&wi===2?G.gold:G.border}`}}/>
      </div>
    </div>
    {deuced&&<div style={{textAlign:"center",padding:"5px",borderRadius:7,background:G.purple+"18",color:G.purple,fontSize:11,fontWeight:700,marginBottom:10}}>🔥 DEUCE</div>}
    <div style={{textAlign:"center",padding:"7px",borderRadius:7,background:ok?G.accent+"12":G.card,border:`1px solid ${ok?G.accent+"44":G.border}`,color:ok?G.accent:G.muted,fontSize:11,marginBottom:12}}>{hint()}</div>
    <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>
      {[[11,0],[11,5],[11,7],[11,9],[12,10],[13,11]].map(([w,l])=>(
        <button key={`${w}-${l}`} onClick={()=>{setS1(String(w));setS2(String(l));}} style={{padding:"3px 9px",borderRadius:5,border:`1px solid ${s1===String(w)&&s2===String(l)?G.accent:G.border}`,background:s1===String(w)&&s2===String(l)?G.accent+"22":"transparent",color:s1===String(w)&&s2===String(l)?G.accent:G.muted,cursor:"pointer",fontSize:10,fontWeight:600}}>{w}-{l}</button>
      ))}
    </div>
    <div style={{display:"flex",gap:7}}>
      <button onClick={()=>{if(!ok)return;const sw=wi===1?n1:n2,sl=wi===1?n2:n1;onConfirm(wi,sw,sl);}} disabled={!ok} style={{...bP,flex:1,padding:"10px 0",opacity:ok?1:.4}}>✅ Xác nhận</button>
      <button onClick={onClose} style={{...bS,padding:"10px 12px"}}>Huỷ</button>
    </div>
  </MBox>;
}

    <div style={{padding:"10px 12px",borderRadius:9,background:G.card,border:`1px solid ${G.border}`,marginBottom:14}}>

      {showReset&&<div style={{marginTop:10}}>
        <div style={{fontSize:10,color:G.red,marginBottom:8}}>⚠️ Không thể hoàn tác!</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button onClick={()=>{onSave({...player,...f,name:f.name.trim(),elo:SKILL_ELO[f.skill]||1200,baseElo:SKILL_ELO[f.skill]||1200,gamesPlayed:0,wins:0,kootoro:0,lastPartners:[],totalSpent:0,monthSpent:0,eventCount:0,paidAmount:0});toast(`Reset toàn bộ: ${f.name}`,"warn");}} style={{padding:"5px 9px",borderRadius:7,border:`1px solid ${G.red}44`,background:"transparent",color:G.red,fontWeight:600,cursor:"pointer",fontSize:10}}>Reset tất cả</button>
          <button onClick={()=>{onSave({...player,...f,name:f.name.trim(),kootoro:0});toast(`Reset Kootoro: ${f.name}`,"warn");}} style={{padding:"5px 9px",borderRadius:7,border:`1px solid ${G.red}44`,background:"transparent",color:G.red,fontWeight:600,cursor:"pointer",fontSize:10}}>Reset Kootoro</button>
          <button onClick={()=>{onSave({...player,...f,name:f.name.trim(),totalSpent:0,monthSpent:0,paidAmount:0});toast(`Reset chi phí: ${f.name}`,"warn");}} style={{padding:"5px 9px",borderRadius:7,border:`1px solid ${G.red}44`,background:"transparent",color:G.red,fontWeight:600,cursor:"pointer",fontSize:10}}>Reset chi phí</button>
        </div>

    <div style={{display:"flex",gap:8}}><button onClick={save} style={{...bP,flex:1,padding:"11px 0"}}>💾 Lưu thay đổi</button><button onClick={onClose} style={bS}>Huỷ</button></div>
  </MBox>;
}

// ══════════════════════════════════════
// SUB PLAYER MODAL — thay người khi bận
// ══════════════════════════════════════
function SubModal({court,players,playIds,onSub,onClose}){
  const [out,setOut]=useState(null),[inp,setInp]=useState(null);
  const team=[...(court.match?.team1||[]),...(court.match?.team2||[])].filter(Boolean);
  const avail=players.filter(p=>p?.checkedIn&&!playIds.has(p.id)&&p.name).sort((a,b)=>(a.gamesPlayed||0)-(b.gamesPlayed||0));
  const sorted=[...avail].sort((a,b)=>out?Math.abs((a.elo||0)-(out.elo||0))-Math.abs((b.elo||0)-(out.elo||0)):0);
  return <MBox title="🔄 Thay người" sub={`${court.name} — chọn ra & vào`} onClose={onClose} w={480}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
      <div>
        <div style={{fontSize:9,color:G.red,fontWeight:700,marginBottom:7}}>NGƯỜI RA (bận việc)</div>
        {team.map(p=><button key={p.id} onClick={()=>setOut(p)} style={{width:"100%",display:"flex",alignItems:"center",gap:7,padding:"8px 10px",borderRadius:8,cursor:"pointer",textAlign:"left",marginBottom:5,border:`2px solid ${out?.id===p.id?G.red:G.border}`,background:out?.id===p.id?G.red+"18":"transparent"}}>
          <div style={{flex:1}}><div style={{fontSize:11,fontWeight:700,color:G.text}}>{safe(p.name)}</div><div style={{display:"flex",gap:3,marginTop:2}}><span style={{fontSize:10,color:p.gender==="M"?"#60a5fa":"#f472b6"}}>{p.gender==="M"?"♂":"♀"}</span><span style={{fontSize:10,padding:"1px 5px",borderRadius:3,background:SKILL_COLOR[p.skill]+"25",color:SKILL_COLOR[p.skill],fontWeight:700}}>{p.skill}</span></div></div>
          <span style={{fontSize:9,color:G.muted}}>{p.elo}</span>
        </button>)}
      </div>
      <div>
        <div style={{fontSize:9,color:G.accent,fontWeight:700,marginBottom:7}}>NGƯỜI VÀO {out&&<span style={{color:G.gold,fontSize:8}}>(ELO ~{out.elo})</span>}</div>
        {!avail.length?<div style={{color:G.dim,fontSize:11}}>Không có ai chờ</div>:
        sorted.slice(0,6).map(p=>{const diff=out?Math.abs((p.elo||0)-(out.elo||0)):0;return <button key={p.id} onClick={()=>setInp(p)} style={{width:"100%",display:"flex",alignItems:"center",gap:7,padding:"8px 10px",borderRadius:8,cursor:"pointer",textAlign:"left",marginBottom:5,border:`2px solid ${inp?.id===p.id?G.accent:G.border}`,background:inp?.id===p.id?G.accent+"18":"transparent"}}>
          <div style={{flex:1}}><div style={{fontSize:11,fontWeight:700,color:G.text}}>{safe(p.name)}</div><div style={{display:"flex",gap:3,marginTop:2}}><span style={{fontSize:10,color:p.gender==="M"?"#60a5fa":"#f472b6"}}>{p.gender==="M"?"♂":"♀"}</span><span style={{fontSize:10,padding:"1px 5px",borderRadius:3,background:SKILL_COLOR[p.skill]+"25",color:SKILL_COLOR[p.skill],fontWeight:700}}>{p.skill}</span></div></div>
          <span style={{fontSize:9,color:diff<40?G.accent:diff<80?G.gold:G.red,fontWeight:700}}>Δ{diff}</span>
        </button>;})}
      </div>
    </div>
    {out&&inp&&<div style={{padding:"8px 12px",borderRadius:8,background:G.accent+"10",border:`1px solid ${G.accent}44`,marginBottom:12,fontSize:11,color:G.accent}}>🔄 <b>{safe(out.name)}</b> ra · <b>{safe(inp.name)}</b> vào (Δ ELO: {Math.abs((out.elo||0)-(inp.elo||0))})</div>}
    <div style={{display:"flex",gap:7}}>
      <button onClick={()=>onSub(court.id,out,inp)} disabled={!out||!inp} style={{...bP,flex:1,opacity:out&&inp?1:.4}}>🔄 Xác nhận thay</button>
      <button onClick={onClose} style={bS}>Huỷ</button>
    </div>
  </MBox>;
}

// QR MODAL
// ══════════════════════════════════════
function QRModal({players,onRegister,onClose,onCheckInAll,activeEvent}){
  const [step,setStep]=useState("scan"),[sname,setSname]=useState("");
  const [form,setForm]=useState({name:"",gender:"M",skill:"3.0",dtype:"any",cwith:"",ctype:"couple",paid:false});
  const [err,setErr]=useState(""),[added,setAdded]=useState(null),[search,setSearch]=useState("");
  const sq=safe(search).toLowerCase();
  const filtered=players.filter(p=>p&&p.name&&safe(p.name).toLowerCase().includes(sq));
  const checkedIn=players.filter(p=>p&&p.checkedIn&&p.name);
  const notIn=players.filter(p=>p&&p.name&&!p.checkedIn);
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const simulate=()=>{
    const ni=players.filter(p=>p&&!p.checkedIn&&p.name);
    if(ni.length>0&&Math.random()>0.3){const p=ni[rng(0,ni.length-1)];setForm({name:p.name,gender:p.gender,skill:p.skill,dtype:p.dtype||"any",cwith:"",ctype:"couple"});setSname(p.name);setStep("form");}
    else{setSname("");setForm({name:"",gender:"M",skill:"3.0",dtype:"any",cwith:"",ctype:"couple",paid:false});setStep("form");}
  };
  const submit=()=>{
    if(!safe(form.name).trim()){setErr("Nhập tên");return;}setErr("");
    const ex=players.find(p=>p&&safe(p.name).toLowerCase()===safe(form.name).toLowerCase().trim());
    if(ex){const cid=form.cwith?(ex.coupleId||`couple-${uid()}`):ex.coupleId;const reg={...ex,gender:form.gender,skill:form.skill,dtype:form.dtype,checkedIn:true,paid:form.paid||ex.paid||false,coupleId:form.cwith?cid:ex.coupleId,coupleType:form.cwith?form.ctype:ex.coupleType,coupleWithId:form.cwith||null,isNew:false};onRegister(reg);setAdded(reg);}
    else{const np={id:uid(),name:form.name.trim(),gender:form.gender,skill:form.skill,elo:skillElo(form.skill),dtype:form.dtype,checkedIn:true,paid:form.paid||false,gamesPlayed:0,wins:0,lastPartners:[],coupleId:form.cwith?`couple-${uid()}`:null,coupleType:form.cwith?form.ctype:null,coupleWithId:form.cwith||null,createdAt:nowStr(),isNew:true};onRegister(np);setAdded(np);}
    setStep("success");
  };
  return <Overlay onClose={onClose}>
    <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:18,width:490,maxWidth:"96vw",maxHeight:"94vh",overflowY:"auto"}}>
      <div style={{padding:"18px 22px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontSize:16,fontWeight:800,color:G.text}}>{step==="scan"?"📷 QR Check-in":step==="form"?"📝 Đăng ký":"✅ Check in!"}</div>
          <div style={{fontSize:10,color:G.muted,marginTop:2}}>{step==="scan"?`${checkedIn.length} đã vào · ${notIn.length} chưa vào`:step==="form"?"Điền thông tin":"Vào hàng chờ"}</div></div>
        <button onClick={onClose} style={{...bS,padding:"4px 9px",fontSize:14}}>✕</button>
      </div>
      <div style={{padding:"14px 22px 22px"}}>
        {step==="scan"&&<>
          {/* Check-in tất cả */}
          {notIn.length>0&&<button onClick={()=>{if(confirm(`Check-in tất cả ${notIn.length} người chưa vào?`))onCheckInAll();}} style={{...bP,width:"100%",marginBottom:10,background:`linear-gradient(135deg,${G.accent},${G.blue})`,padding:"11px 0",fontSize:13}}>
            ✅ Check-in tất cả ({notIn.length} người)
          </button>}
          <div style={{background:G.card,borderRadius:12,padding:18,textAlign:"center",marginBottom:14,border:`1px solid ${G.border}`}}>
            <div style={{width:100,height:100,margin:"0 auto 10px",background:G.dim+"44",borderRadius:10,border:`2px dashed ${G.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:36}}>⬛</div>
            <div style={{fontSize:11,color:G.muted,marginBottom:12}}>Hướng camera vào QR code</div>
            <button onClick={simulate} style={bP}>🎲 Giả lập quét QR</button>
          </div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Tìm tên..." style={{...iS,marginBottom:10}}/>
          <div style={{maxHeight:190,overflowY:"auto",display:"flex",flexDirection:"column",gap:5}}>
            {filtered.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderRadius:8,background:G.card,border:`1px solid ${p.checkedIn?G.accent+"55":G.border}`}}>
              <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:G.text}}>{safe(p.name)}</div>
                <div style={{display:"flex",gap:3,marginTop:2,flexWrap:"wrap"}}><GBadge gender={p.gender}/><SBadge skill={p.skill}/><DBadge dtype={p.dtype}/>{p.coupleId&&<CBadge type={p.coupleType}/>}</div></div>
              {p.checkedIn?<Chip label="✅ IN" color={G.accent}/>:<button onClick={()=>{setForm({name:p.name,gender:p.gender,skill:p.skill,dtype:p.dtype||"any",cwith:"",ctype:"couple"});setSname(p.name);setStep("form");}} style={{...bP,fontSize:10,padding:"4px 10px"}}>Đăng ký</button>}
            </div>)}
          </div>
          <button onClick={()=>{setForm({name:safe(search).trim(),gender:"M",skill:"3.0",dtype:"any",cwith:"",ctype:"couple"});setSname("");setStep("form");}} style={{...bP,width:"100%",marginTop:12,padding:"10px 0"}}>➕ Thêm người chơi mới</button>
        </>}
        {step==="form"&&<>
          {sname&&<div style={{padding:"7px 12px",borderRadius:8,background:G.accent+"12",border:`1px solid ${G.accent}33`,marginBottom:14,fontSize:11,color:G.accent,fontWeight:600}}>🎯 Nhận dạng: <strong>{sname}</strong></div>}
          <Fld label="TÊN"><input value={form.name} onChange={e=>{sf("name",e.target.value);setErr("");}} placeholder="VD: Minh Tuấn..." style={iS} autoFocus onKeyDown={e=>e.key==="Enter"&&submit()}/></Fld>
          <Fld label="GIỚI TÍNH"><div style={{display:"flex",gap:7}}>{[{v:"M",l:"♂ Nam",c:"#60a5fa"},{v:"F",l:"♀ Nữ",c:"#f472b6"}].map(g=><button key={g.v} onClick={()=>sf("gender",g.v)} style={{flex:1,padding:"9px 0",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13,border:`2px solid ${form.gender===g.v?g.c:G.border}`,background:form.gender===g.v?g.c+"25":"transparent",color:form.gender===g.v?g.c:G.muted}}>{g.l}</button>)}</div></Fld>
          <Fld label="TRÌNH ĐỘ">
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:5,marginBottom:5}}>
              {SKILL_LEVELS.map(s=>{const c=SKILL_COLOR[s];const sel=form.skill===s;return <button key={s} onClick={()=>sf("skill",s)} style={{padding:"8px 3px",borderRadius:7,cursor:"pointer",fontWeight:700,fontSize:11,textAlign:"center",border:`2px solid ${sel?c:G.border}`,background:sel?c+"28":"transparent",color:sel?c:G.muted}}><div>{s}</div></button>;})}
            </div>
          </Fld>
          <Fld label="KIỂU ĐÔI">
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5}}>{DTYPE_OPT.map(d=>{const sel=form.dtype===d.val;return <button key={d.val} onClick={()=>sf("dtype",d.val)} style={{padding:"7px 3px",borderRadius:7,cursor:"pointer",fontSize:10,fontWeight:700,textAlign:"center",border:`2px solid ${sel?d.color:G.border}`,background:sel?d.color+"22":"transparent",color:sel?d.color:G.muted}}>{d.label}</button>;})}</div>
          </Fld>
          <Fld label="💳 THANH TOÁN">
            <div style={{display:"flex",gap:8}}>
              {[{v:false,l:"⏳ Chưa TT",c:G.gold},{v:true,l:"✅ Đã TT",c:G.accent}].map(o=><button key={String(o.v)} onClick={()=>sf("paid",o.v)} style={{flex:1,padding:"10px 0",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:13,border:`2px solid ${form.paid===o.v?o.c:G.border}`,background:form.paid===o.v?o.c+"22":"transparent",color:form.paid===o.v?o.c:G.muted}}>{o.l}</button>)}
            </div>
          </Fld>
          <Fld label="CẶP ĐÔI (tuỳ chọn)">
            <div style={{display:"flex",gap:7,marginBottom:7}}>{[{v:"couple",l:"💑 Couple"},{v:"spouse",l:"💍 Vợ/Chồng"}].map(t=><button key={t.v} onClick={()=>sf("ctype",t.v)} style={{flex:1,padding:"6px 0",borderRadius:7,cursor:"pointer",fontWeight:700,fontSize:10,border:`2px solid ${form.ctype===t.v?G.pink:G.border}`,background:form.ctype===t.v?G.pink+"22":"transparent",color:form.ctype===t.v?G.pink:G.muted}}>{t.l}</button>)}</div>
            <select value={form.cwith} onChange={e=>sf("cwith",e.target.value)} style={{...iS,fontSize:11}}>
              <option value="">-- Không kết đôi --</option>
              {checkedIn.filter(p=>safe(p.name).toLowerCase()!==safe(form.name).toLowerCase().trim()).map(p=><option key={p.id} value={p.id}>{safe(p.name)} ({p.gender}, {p.skill})</option>)}
            </select>
          </Fld>
          {err&&<div style={{color:G.red,fontSize:11,marginBottom:10}}>{err}</div>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={submit} style={{...bP,flex:1,padding:"11px 0"}}>✅ Check in</button>
            <button onClick={()=>setStep("scan")} style={bS}>← Quay lại</button>
          </div>
        </>}
        {step==="success"&&added&&<>
          <div style={{textAlign:"center",padding:"16px 0 10px"}}>
            <div style={{fontSize:40,marginBottom:8}}>🎉</div>
            <div style={{fontSize:18,fontWeight:900,color:G.accent,marginBottom:4}}>{safe(added.name)}</div>
            <div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:10}}><GBadge gender={added.gender}/><SBadge skill={added.skill}/></div>
            {/* Trạng thái thanh toán */}
            <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:12}}>
              {added.paid
                ?<div style={{padding:"6px 18px",borderRadius:20,background:G.accent+"22",border:`1px solid ${G.accent}55`,color:G.accent,fontWeight:700,fontSize:12}}>✅ Đã thanh toán</div>
                :<div style={{padding:"6px 18px",borderRadius:20,background:G.gold+"22",border:`1px solid ${G.gold}55`,color:G.gold,fontWeight:700,fontSize:12}}>⏳ Chưa thanh toán</div>
              }
            </div>
          </div>
          {/* QR thanh toán nếu chưa TT */}
          {!added.paid&&<PayQRBox qrUrl={activeEvent?.qrUrl} courtFee={activeEvent?.courtFee} extraFee={activeEvent?.extraFee} players={players}/>}
          {/* Mark paid button */}
          {!added.paid&&<button onClick={()=>{setAdded(a=>({...a,paid:true}));onRegister({...added,paid:true});}} style={{...bP,width:"100%",marginBottom:8,background:`linear-gradient(135deg,${G.accent},${G.blue})`}}>✅ Đánh dấu đã thanh toán</button>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setStep("scan");setSname("");setSearch("");setAdded(null);}} style={{...bP,flex:1,padding:"11px 0"}}>📷 Check in tiếp</button>
            <button onClick={onClose} style={{...bS,padding:"11px 14px"}}>Xong</button>
          </div>
        </>}
      </div>
    </div>
  </Overlay>;
}

// CUSTOM MATCH
// ══════════════════════════════════════
function CustomModal({players,onAdd,onClose}){
  const av=players.filter(p=>p&&p.checkedIn&&p.name);
  const [sel,setSel]=useState([]),[dtype,setDtype]=useState("mixed");
  const tog=id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p.slice(-3),id]);
  const t1=sel.slice(0,2).map(id=>av.find(p=>p.id===id)).filter(Boolean);
  const t2=sel.slice(2,4).map(id=>av.find(p=>p.id===id)).filter(Boolean);
  const diff=t1.length===2&&t2.length===2?Math.abs(teamElo(t1)-teamElo(t2)):null;
  return <MBox title="✏️ Custom Match" sub="Chọn 4: 2 đầu=A · 2 sau=B" onClose={onClose} w={520}>
    <div style={{display:"flex",gap:6,marginBottom:12}}>{DTYPE_OPT.map(d=><button key={d.val} onClick={()=>setDtype(d.val)} style={{flex:1,padding:"6px 4px",borderRadius:7,cursor:"pointer",fontSize:10,fontWeight:700,textAlign:"center",border:`2px solid ${dtype===d.val?d.color:G.border}`,background:dtype===d.val?d.color+"22":"transparent",color:dtype===d.val?d.color:G.muted}}>{d.label}</button>)}</div>
    <div style={{display:"flex",gap:12,marginBottom:12}}>
      <div style={{flex:1,padding:"8px 10px",borderRadius:9,background:G.accent+"10",border:`1px solid ${G.accent}30`,minHeight:56}}>
        <div style={{fontSize:9,color:G.accent,fontWeight:700,marginBottom:4}}>TEAM A</div>

function CoupleModal({players,setPlayers,onClose}){
  const [sel,setSel]=useState([]),[ct,setCt]=useState("couple");
  const cm={};players.forEach(p=>{if(p?.coupleId){if(!cm[p.coupleId])cm[p.coupleId]=[];cm[p.coupleId].push(p);}});
  const tog=id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p.slice(-1),id]);
  const link=()=>{if(sel.length!==2)return;const cid=`${ct}-${uid()}`;setPlayers(p=>p.map(x=>sel.includes(x.id)?{...x,coupleId:cid,coupleType:ct}:x));setSel([]);};
  const unlink=cid=>setPlayers(p=>p.map(x=>x.coupleId===cid?{...x,coupleId:null,coupleType:null}:x));
  return <MBox title="💑 Couple / Vợ chồng" onClose={onClose} w={480}>
    {Object.entries(cm).length>0&&<div style={{marginBottom:14}}>
      {Object.entries(cm).map(([cid,pp])=><div key={cid} style={{display:"flex",alignItems:"center",gap:9,padding:"7px 11px",borderRadius:8,background:G.card,border:`1px solid ${G.pink}44`,marginBottom:6}}>
        <span>{pp[0]?.coupleType==="spouse"?"💍":"💑"}</span>
        <div style={{flex:1,display:"flex",gap:8}}>{pp.map(p=><span key={p.id} style={{fontSize:11,fontWeight:700,color:G.text}}>{safe(p.name)}</span>)}</div>
        <button onClick={()=>unlink(cid)} style={bR}>✕</button>
      </div>)}
    </div>}
    <div style={{display:"flex",gap:7,marginBottom:9}}>{[{v:"couple",l:"💑 Couple"},{v:"spouse",l:"💍 Vợ/Chồng"}].map(t=><button key={t.v} onClick={()=>setCt(t.v)} style={{flex:1,padding:"7px 0",borderRadius:7,cursor:"pointer",fontWeight:700,fontSize:11,border:`2px solid ${ct===t.v?G.pink:G.border}`,background:ct===t.v?G.pink+"22":"transparent",color:ct===t.v?G.pink:G.muted}}>{t.l}</button>)}</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,maxHeight:220,overflowY:"auto",marginBottom:11}}>
      {players.filter(p=>p&&p.checkedIn&&p.name).map(p=>{const s=sel.includes(p.id);return <button key={p.id} onClick={()=>tog(p.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 9px",borderRadius:7,cursor:"pointer",textAlign:"left",border:`2px solid ${s?G.pink:G.border}`,background:s?G.pink+"20":"transparent"}}>
        <div style={{flex:1}}><div style={{fontSize:11,fontWeight:700,color:G.text}}>{safe(p.name)}</div><div style={{display:"flex",gap:2}}><GBadge gender={p.gender}/><SBadge skill={p.skill}/></div></div>
        {s&&<span style={{color:G.pink}}>✓</span>}
      </button>;})}
    </div>
    <div style={{display:"flex",gap:7}}>
      <button onClick={link} disabled={sel.length!==2} style={{...bP,flex:1,opacity:sel.length===2?1:.4}}>💑 Kết đôi ({sel.length}/2)</button>
      <button onClick={onClose} style={bS}>Đóng</button>
    </div>
  </MBox>;
}

function TBlock({team,label,color}){

  return <div style={{padding:"6px 9px",borderRadius:8,background:color+"12",border:`1px solid ${color}30`}}>
    <div style={{fontSize:8,color,fontWeight:700,letterSpacing:.8,marginBottom:4}}>{label}</div>
    {team.filter(Boolean).map(p=><div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2}}>
      <div style={{display:"flex",alignItems:"center",gap:3}}><span style={{fontSize:11,fontWeight:700,color:G.text}}>{safe(p.name)}</span><SBadge skill={p.skill}/></div>
      <div style={{display:"flex",gap:2}}><GBadge gender={p.gender}/></div>
    </div>)}
    <div style={{fontSize:9,color,fontWeight:700,borderTop:`1px solid ${color}20`,paddingTop:3,marginTop:3}}>⌀ {teamElo(team)}</div>

function CourtCard({court,elapsed,onScore,onAssign,next,readOnly,onSub,courtIdx,gameMode}){
  const m=court.match;
  const mm=String(Math.floor((elapsed||0)/60)).padStart(2,"0"),ss=String((elapsed||0)%60).padStart(2,"0");
  const dc=DTYPE_OPT.find(d=>d.val===(m?.dtype||"any"))||DTYPE_OPT[3];
  const diff=m?Math.abs(teamElo(m.team1)-teamElo(m.team2)):0;
  const isKing=gameMode==="king"&&courtIdx===0;
  const courtLabel=isKing?"👑 Vua":gameMode==="ladder"?`🪜 #${(courtIdx||0)+1}`:court.name;
  const borderCol=isKing?G.gold+(m?"99":"44"):m?dc.color+"77":G.border;
  return <div style={{background:G.panel,border:`2px solid ${borderCol}`,borderRadius:13,overflow:"hidden",display:"flex",flexDirection:"column",minHeight:140}}>
    {/* Header */}
    <div style={{padding:"6px 10px",background:isKing?G.gold+"14":m?dc.color+"14":G.card,display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px solid ${G.border}`}}>
      <div style={{fontWeight:800,fontSize:12,color:isKing?G.gold:G.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{courtLabel}</div>
      <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
        {m&&<div style={{fontFamily:"monospace",fontSize:11,fontWeight:900,color:isKing?G.gold:dc.color}}>{mm}:{ss}</div>}
        <div style={{padding:"2px 6px",borderRadius:5,fontSize:9,fontWeight:700,whiteSpace:"nowrap",
          background:m?G.red+"20":G.accent+"20",
          color:m?G.red:G.accent,
          border:`1px solid ${m?G.red+"55":G.accent+"55"}`}}>
          {m?"LIVE":"TRỐNG"}
        </div>
      </div>
    </div>
    {/* Body */}
    <div style={{padding:"8px 10px",flex:1}}>
      {m?(<>
        {/* Team A */}
        <div style={{marginBottom:4}}>
          <div style={{fontSize:8,color:G.accent,fontWeight:700,letterSpacing:1,marginBottom:2}}>TEAM A</div>
          {(m.team1||[]).filter(Boolean).map(p=>(
            <div key={p.id} style={{fontSize:11,fontWeight:700,color:G.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{safe(p.name)}</div>
          ))}
        </div>
        <div style={{textAlign:"center",fontSize:8,color:G.dim,marginBottom:4}}>VS · Δ{diff}{diff<40?"✓":"⚠"}</div>
        {/* Team B */}
        <div style={{marginBottom:6}}>
          <div style={{fontSize:8,color:G.gold,fontWeight:700,letterSpacing:1,marginBottom:2}}>TEAM B</div>
          {(m.team2||[]).filter(Boolean).map(p=>(
            <div key={p.id} style={{fontSize:11,fontWeight:700,color:G.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{safe(p.name)}</div>
          ))}
        </div>
        {!readOnly&&<div style={{display:"flex",gap:4}}>
          <button onClick={()=>onScore(court.id)} style={{...bP,flex:1,padding:"7px 0",fontSize:11}}>📊 Tỉ số</button>
          {onSub&&<button onClick={()=>onSub(court)} style={{padding:"7px 8px",borderRadius:8,border:`1px solid ${G.border}`,background:"transparent",color:G.muted,cursor:"pointer",fontSize:11}}>🔄</button>}
        </div>}
      </>):(
        <div style={{textAlign:"center",padding:"12px 0"}}>
          <div style={{fontSize:26,marginBottom:4}}>{isKing?"👑":"🏓"}</div>
          <div style={{fontSize:10,color:G.muted,marginBottom:8}}>{isKing?"Chờ Vua":"Sân trống"}</div>
          {!readOnly&&next?.length
            ? <div style={{display:"flex",gap:3,justifyContent:"center",flexWrap:"wrap"}}>
                {next.slice(0,2).map((q,i)=>{const qc=DTYPE_OPT.find(d=>d.val===q.dtype)?.color||G.accent;return <button key={i} onClick={()=>onAssign(court.id,q)} style={{padding:"5px 8px",borderRadius:6,border:`1px solid ${qc}`,background:qc+"14",color:qc,fontWeight:700,cursor:"pointer",fontSize:10}}>▶ Gán</button>;})}
              </div>
            : <div style={{fontSize:9,color:G.dim}}>Chưa có trận</div>
          }
        </div>
      )}

  </div>;
}

function HCard({h}){

      <div style={{textAlign:"center"}}><div style={{fontSize:14,fontWeight:900,color:G.accent}}>{h.score||"?"}</div></div>
      <div style={{textAlign:"right"}}>{h.team2.filter(Boolean).map(p=><div key={p.id} style={{fontSize:10,fontWeight:700,color:h.winner===2?G.gold:G.muted}}>{h.winner===2?"🏆 ":""}{safe(p.name)}</div>)}</div>
    </div>

}

              return <div key={i} style={{display:"flex",alignItems:"center",gap:7,padding:"7px 11px",borderRadius:8,background:G.panel,border:`1px solid ${G.border}`}}>
                <span style={{fontSize:10,fontWeight:800,color:G.muted,minWidth:16}}>#{i+1}</span>
                <span style={{fontSize:10,padding:"1px 5px",borderRadius:3,background:dc.color+"20",color:dc.color,fontWeight:600}}>{dc.label}</span>
                <div style={{flex:1,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                  {(q.team1||[]).filter(Boolean).map(p=><span key={p.id} style={{fontSize:10,color:G.accent,fontWeight:600}}>{safe(p.name).split(" ").pop()}</span>)}
                  <span style={{fontSize:9,color:G.dim}}>vs</span>
                  {(q.team2||[]).filter(Boolean).map(p=><span key={p.id} style={{fontSize:10,color:G.gold,fontWeight:600}}>{safe(p.name).split(" ").pop()}</span>)}
                </div>
                <span style={{fontSize:9,color:diff<40?G.accent:G.gold,fontWeight:700}}>Δ{diff}</span>
              </div>;
            })}
          </div>
        </div>}
        {history.slice(0,4).length>0&&<><div style={{fontSize:9,color:G.muted,fontWeight:700,letterSpacing:2,marginBottom:7}}>KẾT QUẢ GẦN ĐÂY</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:7}}>{history.slice(0,4).map(h=><HCard key={h.id} h={h}/>)}</div></>}
      </div>}

        <div style={{fontSize:14,fontWeight:800,color:G.text,marginBottom:12}}>⚔️ Hàng chờ ({queue.length} trận)</div>
        {!queue.length?<div style={{color:G.dim,fontSize:12,textAlign:"center",padding:"40px 0",borderRadius:12,border:`1px solid ${G.border}`,background:G.panel}}>Chưa có trận nào trong hàng chờ</div>:
        <div style={{display:"flex",flexDirection:"column",gap:6}}>{queue.map((q,i)=><QRow key={i} q={q} idx={i} courts={courts} readOnly/>)}</div>}
        {/* Players waiting */}
        <div style={{marginTop:14}}>
          <div style={{fontSize:10,fontWeight:700,color:G.accent,letterSpacing:2,marginBottom:8}}>⏳ ĐANG CHỜ ({players.filter(p=>p?.checkedIn&&!courts.flatMap(c=>c.match?[...(c.match.team1||[]),...(c.match.team2||[])]:[])).filter(Boolean).some(pp=>pp.id===undefined)?0:players.filter(p=>p?.checkedIn).length-courts.flatMap(c=>c.match?[...(c.match.team1||[]),...(c.match.team2||[])].filter(Boolean):[]).length} người)</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {(()=>{const playingIds=new Set(courts.flatMap(c=>c.match?[...(c.match.team1||[]),...(c.match.team2||[])].filter(Boolean).map(p=>p.id):[]));return players.filter(p=>p?.checkedIn&&!playingIds.has(p.id)&&p.name).sort((a,b)=>(a.gamesPlayed||0)-(b.gamesPlayed||0)).map(p=><div key={p.id} style={{padding:"4px 9px",borderRadius:6,background:G.card,border:`1px solid ${G.border}`,fontSize:10,display:"flex",gap:4,alignItems:"center"}}><span style={{color:p.gender==="M"?"#60a5fa":"#f472b6"}}>{p.gender==="M"?"♂":"♀"}</span><span style={{color:G.text,fontWeight:600}}>{safe(p.name)}</span><span style={{fontSize:9,padding:"1px 4px",borderRadius:3,background:SKILL_COLOR[p.skill]+"25",color:SKILL_COLOR[p.skill]}}>{p.skill}</span></div>);})()}
          </div>
        </div>
      </div>}
      {vtab==="leaderboard"&&<LeaderView ranked={ranked}/>}
      {vtab==="history"&&<HistoryTab history={history} events={events} players={players} readOnly/>}
      {vtab==="analytics"&&<AnalyticsView players={players} history={history} courts={courts}/>}
    </main>
  </div>;
}

// CourtCard lite cho Viewer (không có action buttons)
function CourtCardViewer({court,elapsed,courtIdx,gameMode}){
  const m=court.match;
  const mm=String(Math.floor((elapsed||0)/60)).padStart(2,"0"),ss=String((elapsed||0)%60).padStart(2,"0");
  const dc=DTYPE_OPT.find(d=>d.val===(m?.dtype||"any"))||DTYPE_OPT[3];
  const diff=m?Math.abs(teamElo(m.team1)-teamElo(m.team2)):0;
  const isKing=gameMode==="king"&&courtIdx===0;
  const courtLabel=isKing?`👑 Sân Vua`:(gameMode==="ladder"?`🪜 Sân #${courtIdx+1}`:court.name);
  const borderCol=isKing?G.gold+(m?"99":"44"):m?dc.color+"77":G.border;
  return <div style={{background:G.panel,border:`2px solid ${borderCol}`,borderRadius:14,overflow:"hidden"}}>
    <div style={{padding:"8px 12px",background:isKing?G.gold+"14":m?dc.color+"14":G.card,display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px solid ${G.border}`}}>
      <div><div style={{fontWeight:800,fontSize:13,color:isKing?G.gold:G.text}}>{courtLabel}</div>{m&&<span style={{fontSize:10,padding:"1px 5px",borderRadius:3,background:dc.color+"20",color:dc.color,fontWeight:600}}>{dc.label}</span>}</div>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        {m&&<div style={{fontFamily:"monospace",fontSize:14,fontWeight:900,color:isKing?G.gold:dc.color}}>{mm}:{ss}</div>}
        <span style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:m?G.red+"20":G.accent+"20",color:m?G.red:G.accent,fontWeight:700}}>{m?"🔴 LIVE":"🟢 TRỐNG"}</span>
      </div>
    </div>
    <div style={{padding:10}}>
      {m?<>
        <div style={{padding:"6px 8px",borderRadius:8,background:G.accent+"12",border:`1px solid ${G.accent}30`,marginBottom:3}}>
          {(m.team1||[]).filter(Boolean).map(p=><div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:1}}><span style={{fontSize:11,fontWeight:700,color:G.text}}>{safe(p.name)}</span><span style={{fontSize:9,padding:"1px 4px",borderRadius:3,background:SKILL_COLOR[p.skill]+"25",color:SKILL_COLOR[p.skill]}}>{p.skill}</span></div>)}
          <div style={{fontSize:9,color:G.accent,fontWeight:700,borderTop:`1px solid ${G.accent}20`,paddingTop:3,marginTop:2}}>⌀ ELO {teamElo(m.team1)}</div>
        </div>
        <div style={{textAlign:"center",padding:"2px 0",fontSize:9,color:G.dim}}>VS · Δ{diff}{diff<40?" ✓":""}</div>
        <div style={{padding:"6px 8px",borderRadius:8,background:G.gold+"12",border:`1px solid ${G.gold}30`}}>
          {(m.team2||[]).filter(Boolean).map(p=><div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:1}}><span style={{fontSize:11,fontWeight:700,color:G.text}}>{safe(p.name)}</span><span style={{fontSize:9,padding:"1px 4px",borderRadius:3,background:SKILL_COLOR[p.skill]+"25",color:SKILL_COLOR[p.skill]}}>{p.skill}</span></div>)}
          <div style={{fontSize:9,color:G.gold,fontWeight:700,borderTop:`1px solid ${G.gold}20`,paddingTop:3,marginTop:2}}>⌀ ELO {teamElo(m.team2)}</div>
        </div>
      </>:<div style={{textAlign:"center",padding:"12px 0"}}>
        <div style={{fontSize:22,marginBottom:4}}>{isKing?"👑":"🏓"}</div>
        <div style={{fontSize:10,color:G.muted}}>{isKing?"Đang chờ Vua":"Sân trống"}</div>
      </div>}
    </div>
  </div>;
}

// HISTORY TAB — lịch sử theo event & tổng hợp
// ══════════════════════════════════════
function HistoryTab({history, events, players, readOnly, onEditEvent, onDeleteEvent, activeEventId}){
  const [view, setView] = useState("event");   // "event" | "all"
  const [selEvId, setSelEvId] = useState(activeEventId||"all");
  const [search, setSearch] = useState("");
  const [filterDtype, setFilterDtype] = useState("all");
  const [editingEv, setEditingEv] = useState(null);

  // Gom history theo eventId
  const byEvent = {};
  history.forEach(h=>{
    const eid = h.eventId||"legacy";
    if(!byEvent[eid]) byEvent[eid]=[];
    byEvent[eid].push(h);
  });

  const eventList = events||[];
  const sq = safe(search).toLowerCase();

  const filterH = (hs) => {
    let arr = [...hs];
    if(sq) arr=arr.filter(h=>[...(h.team1||[]),...(h.team2||[])].filter(Boolean).some(p=>safe(p.name).toLowerCase().includes(sq)));
    if(filterDtype!=="all") arr=arr.filter(h=>h.dtype===filterDtype);
    return arr;
  };

  // Stats cho một list history
  const calcStats = (hs) => {
    const total=hs.length;
    const byDtype={};
    const topWinner={};
    hs.forEach(h=>{
      byDtype[h.dtype]=(byDtype[h.dtype]||0)+1;
      const wt=(h.winner===1?h.team1:h.team2)||[];
      wt.filter(Boolean).forEach(p=>{topWinner[p.id]=(topWinner[p.id]||{name:p.name,wins:0});topWinner[p.id].wins++;});
    });
    const topP=Object.values(topWinner).sort((a,b)=>b.wins-a.wins).slice(0,3);
    const avgEloD=total?Math.round(hs.reduce((s,h)=>s+(h.eloDelta||0),0)/total):0;
    return {total,byDtype,topP,avgEloD};
  };

  // Render 1 event block
  const renderEventBlock = (ev, hs, collapsed, onToggle) => {
    const st=calcStats(hs);
    return <div key={ev.id} style={{background:G.panel,borderRadius:12,border:`1px solid ${ev.id===activeEventId?G.accent+"66":G.border}`,marginBottom:12,overflow:"hidden"}}>
      {/* Header */}
      <div onClick={onToggle} style={{padding:"10px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",background:ev.id===activeEventId?G.accent+"10":G.card,borderBottom:collapsed?undefined:`1px solid ${G.border}`}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:13,fontWeight:800,color:G.text}}>{ev.name}</span>
            {ev.id===activeEventId&&<Chip label="🔴 ACTIVE" color={G.accent} sm/>}
          </div>
          <div style={{display:"flex",gap:8,marginTop:3,flexWrap:"wrap"}}>
            <span style={{fontSize:10,color:G.muted}}>{ev.date}</span>
            {ev.location&&<span style={{fontSize:10,color:G.blue}}>📍 {ev.location}</span>}
            <span style={{fontSize:10,color:G.gold}}>⚔️ {hs.length} trận</span>
            {ev.note&&<span style={{fontSize:10,color:G.dim}}>💬 {ev.note}</span>}
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {!readOnly&&<>
            <button onClick={e=>{e.stopPropagation();setEditingEv(ev);}} style={{...bS,padding:"3px 8px",fontSize:10}}>✏️</button>
          </>}
          <span style={{color:G.muted,fontSize:12}}>{collapsed?"▶":"▼"}</span>
        </div>
      </div>

      {!collapsed&&<div style={{padding:"10px 14px"}}>
        {/* Stats row */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:7,marginBottom:12}}>
          <div style={{textAlign:"center",padding:"7px",borderRadius:8,background:G.card,border:`1px solid ${G.border}`}}><div style={{fontSize:18,fontWeight:900,color:G.accent}}>{st.total}</div><div style={{fontSize:8,color:G.muted}}>Tổng trận</div></div>
          <div style={{textAlign:"center",padding:"7px",borderRadius:8,background:G.card,border:`1px solid ${G.border}`}}><div style={{fontSize:18,fontWeight:900,color:G.gold}}>±{st.avgEloD}</div><div style={{fontSize:8,color:G.muted}}>Avg ELO Δ</div></div>
          <div style={{textAlign:"center",padding:"7px",borderRadius:8,background:G.card,border:`1px solid ${G.border}`,gridColumn:"span 2"}}>
            <div style={{fontSize:8,color:G.muted,marginBottom:4}}>TOP THẮNG</div>
            {st.topP.map((p,i)=><span key={i} style={{fontSize:9,color:G.gold,marginRight:6}}>{["🥇","🥈","🥉"][i]}{p.name}×{p.wins}</span>)}
            {!st.topP.length&&<span style={{fontSize:9,color:G.dim}}>–</span>}
          </div>
        </div>

        {/* Filters */}
        <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Tên..." style={{...iS,maxWidth:140,fontSize:11}}/>
          <select value={filterDtype} onChange={e=>setFilterDtype(e.target.value)} style={{...iS,maxWidth:110,fontSize:11}}>
            <option value="all">Tất cả kiểu</option>
            {DTYPE_OPT.map(d=><option key={d.val} value={d.val}>{d.label}</option>)}
          </select>
        </div>

        {/* Match list */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:7}}>
          {filterH(hs).map(h=><HCard key={h.id} h={h}/>)}
        </div>
        {!filterH(hs).length&&<div style={{textAlign:"center",color:G.dim,padding:"16px 0",fontSize:11}}>Không có trận nào</div>}
      </div>}
    </div>;
  };

  // State collapse per event
  const [collapsed, setCollapsed] = useState({});
  const togCollapse = id => setCollapsed(p=>({...p,[id]:!p[id]}));

  // View: theo event
  const renderByEvent = () => {
    if(!eventList.length) return <div style={{textAlign:"center",color:G.dim,padding:"32px 0",fontSize:12}}>Chưa có event nào. Tạo event đầu tiên!</div>;
    return eventList.slice().reverse().map(ev=>{
      const hs=byEvent[ev.id]||[];
      return renderEventBlock(ev, hs, !!collapsed[ev.id], ()=>togCollapse(ev.id));
    });
  };

  // View: tổng hợp tất cả
  const renderAll = () => {
    const allH = filterH(history);
    const st = calcStats(history);
    return <>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:14}}>
        {[{l:"Tổng trận",v:st.total,c:G.accent},{l:"Events",v:eventList.length,c:G.blue},{l:"Avg ELO Δ",v:`±${st.avgEloD}`,c:G.gold},{l:"Người chơi",v:players.length,c:G.purple},{l:"Hôm nay",v:(byEvent[activeEventId]||[]).length,c:G.red}].map(s=>(
          <div key={s.l} style={{textAlign:"center",padding:"10px 6px",borderRadius:10,background:G.panel,border:`1px solid ${G.border}`}}>
            <div style={{fontSize:20,fontWeight:900,color:s.c}}>{s.v}</div><div style={{fontSize:8,color:G.muted,marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>
      {/* By dtype */}
      <div style={{background:G.panel,borderRadius:10,border:`1px solid ${G.border}`,padding:"10px 14px",marginBottom:12}}>
        <div style={{fontSize:9,color:G.muted,fontWeight:700,letterSpacing:1,marginBottom:8}}>PHÂN LOẠI KIỂU ĐÔI</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          {DTYPE_OPT.map(d=>{const cnt=st.byDtype[d.val]||0;return <div key={d.val} style={{padding:"5px 12px",borderRadius:7,background:d.color+"15",border:`1px solid ${d.color}33`}}>
            <span style={{fontSize:11,color:d.color,fontWeight:700}}>{d.label}</span><span style={{fontSize:11,color:G.muted,marginLeft:6}}>{cnt} trận</span>
          </div>;})}
        </div>
      </div>
      {/* Filters */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Tên..." style={{...iS,maxWidth:150,fontSize:11}}/>
        <select value={filterDtype} onChange={e=>setFilterDtype(e.target.value)} style={{...iS,maxWidth:120,fontSize:11}}>
          <option value="all">Tất cả kiểu</option>
          {DTYPE_OPT.map(d=><option key={d.val} value={d.val}>{d.label}</option>)}
        </select>
        <span style={{fontSize:10,color:G.muted,alignSelf:"center"}}>{allH.length}/{history.length} trận</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:7}}>
        {allH.map(h=><HCard key={h.id} h={h}/>)}
      </div>
      {!allH.length&&<div style={{textAlign:"center",color:G.dim,padding:"24px 0",fontSize:11}}>Không tìm thấy</div>}
    </>;
  };

  return <div>
    {editingEv&&<EventModal event={editingEv} onSave={ev=>{onEditEvent&&onEditEvent(ev);setEditingEv(null);}} onClose={()=>setEditingEv(null)} isNew={false}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{fontSize:14,fontWeight:800,color:G.text}}>📋 Lịch sử trận đấu</div>
      <div style={{display:"flex",gap:4}}>
        <button onClick={()=>setView("event")} style={{...bS,color:view==="event"?G.accent:G.muted,borderColor:view==="event"?G.accent:G.border,fontSize:11}}>🗓️ Theo event</button>
        <button onClick={()=>setView("all")} style={{...bS,color:view==="all"?G.accent:G.muted,borderColor:view==="all"?G.accent:G.border,fontSize:11}}>📊 Tổng hợp</button>
      </div>
    </div>
    {view==="event"?renderByEvent():renderAll()}
  </div>;
}

}

// ── PayQRBox: hiện QR thanh toán sau check-in
function PayQRBox({qrUrl,courtFee,extraFee,players}){
  const total=(Number(courtFee)||0)+(Number(extraFee)||0);
  const ciCount=players.filter(p=>p?.checkedIn).length||1;
  const perPerson=total>0?Math.ceil(total/ciCount):0;
  if(!total&&!qrUrl) return null;
  return <div style={{background:G.card,border:`1px solid ${G.gold}44`,borderRadius:12,padding:14,marginBottom:12,textAlign:"center"}}>
    <div style={{fontSize:11,fontWeight:700,color:G.gold,marginBottom:8}}>💰 CHI PHÍ BUỔI CHƠI</div>
    {total>0&&<div style={{marginBottom:8}}>
      <div style={{fontSize:20,fontWeight:900,color:G.gold}}>{perPerson.toLocaleString("vi-VN")}đ</div>
      <div style={{fontSize:10,color:G.muted}}>/ người ({ciCount} người check-in · tổng {total.toLocaleString("vi-VN")}đ)</div>
    </div>}
    {qrUrl&&qrUrl.startsWith("http")&&<div>
      <div style={{fontSize:10,color:G.muted,marginBottom:6}}>Quét để thanh toán</div>
      <img src={`https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(qrUrl)}`}
        style={{borderRadius:8,border:`2px solid ${G.gold}44`}} alt="QR TT" onError={e=>e.target.style.display='none'}/>
    </div>}
    {qrUrl&&!qrUrl.startsWith("http")&&<div style={{padding:"8px 12px",borderRadius:8,background:G.gold+"12",fontSize:12,color:G.gold,fontWeight:700}}>{qrUrl}</div>}
  </div>;
}

// ── CostTab: quản lý chi phí tất cả event
function CostTab({events,players,activeEventId,onUpdatePlayer,onUpdateEvent}){
  const [view,setView]=useState("event"); // event | player
  const [selEv,setSelEv]=useState(activeEventId||[...events].reverse()[0]?.id||"");

  // ── EVENT VIEW
  const ev=events.find(e=>e.id===selEv);
  const total=(Number(ev?.courtFee)||0)+(Number(ev?.extraFee)||0);
  const evPlayers=players.filter(p=>p?.checkedIn); // current event players
  const paidPlayers=evPlayers.filter(p=>p?.paid);
  const unpaidPlayers=evPlayers.filter(p=>!p?.paid);
  const perPerson=total>0&&evPlayers.length>0?Math.ceil(total/evPlayers.length):0;
  const collected=paidPlayers.reduce((s,p)=>s+(p.paidAmount||perPerson),0);
  const profit=collected-total;

  // ── PLAYER STATS (all-time)
  const now=new Date();
  const thisMonth=now.getMonth();
  const thisYear=now.getFullYear();

  const playerStats=players.filter(p=>p?.name).map(p=>{
    // Sum up cost across all events player participated in
    // We track totalSpent on the player object, updated each time they pay
    const spent=p.totalSpent||0;
    const monthSpent=p.monthSpent||0;
    const evCount=p.eventCount||0;
    return {...p,spent,monthSpent,evCount};
  }).sort((a,b)=>b.spent-a.spent);

  const fmtVND=v=>v?v.toLocaleString("vi-VN")+"đ":"0đ";

  // Toggle paid for a player in current event
  const togglePaid=(p)=>{
    const nowPaid=!p.paid;
    const amt=nowPaid?perPerson:0;
    const newSpent=(p.totalSpent||0)+(nowPaid?perPerson:-(p.paidAmount||perPerson));
    onUpdatePlayer({...p, paid:nowPaid, paidAmount:nowPaid?perPerson:0,
      totalSpent:Math.max(0,newSpent),
      payMethod:nowPaid?(p.payMethod||"transfer"):p.payMethod
    });
  };

  const setPayMethod=(p,method)=>{
    onUpdatePlayer({...p,payMethod:method});
  };

  const setCustomAmt=(p,amt)=>{
    const diff=amt-(p.paidAmount||0);
    onUpdatePlayer({...p,paidAmount:amt,totalSpent:Math.max(0,(p.totalSpent||0)+diff)});
  };

  // ── TABS
  return <div>
    <div style={{display:"flex",gap:6,marginBottom:16,borderBottom:`1px solid ${G.border}`,paddingBottom:10}}>
      {[{id:"event",l:"📅 Theo Event"},{id:"player",l:"👥 Theo Người chơi"}].map(t=>
        <button key={t.id} onClick={()=>setView(t.id)}
          style={{padding:"7px 16px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",
            border:`1px solid ${view===t.id?G.gold:G.border}`,
            background:view===t.id?G.gold+"18":"transparent",
            color:view===t.id?G.gold:G.muted}}>
          {t.l}
        </button>
      )}
    </div>

    {/* ══ EVENT VIEW ══ */}
    {view==="event"&&<>
      {/* Event selector */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
        {[...events].reverse().map(e=><button key={e.id} onClick={()=>setSelEv(e.id)}
          style={{padding:"5px 12px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer",
            border:`1px solid ${selEv===e.id?G.accent:G.border}`,
            background:selEv===e.id?G.accent+"18":"transparent",
            color:selEv===e.id?G.accent:G.muted}}>
          {e.name}
        </button>)}
      </div>

      {ev&&<>
        {/* Event header + cost */}
        <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:13,padding:16,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <div style={{fontSize:15,fontWeight:800,color:G.text}}>{ev.name}</div>
              <div style={{fontSize:11,color:G.muted}}>{ev.date}{ev.location&&` · 📍${ev.location}`}</div>
            </div>
            {ev.ended&&<span style={{fontSize:10,padding:"2px 8px",borderRadius:6,background:G.muted+"22",color:G.muted,fontWeight:600}}>Đã KT</span>}
          </div>

          {/* Quick cost stats */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:10}}>
            {[
              {l:"👥 Người check-in",v:evPlayers.length+" người",c:G.blue},
              {l:"💰 Chi phí/người",v:fmtVND(perPerson),c:G.gold},
              {l:"🏟️ Giá sân",v:fmtVND(Number(ev.courtFee)||0),c:G.purple},
              {l:"🧾 Chi phí khác",v:fmtVND(Number(ev.extraFee)||0),c:G.muted},
            ].map(s=><div key={s.l} style={{padding:"9px 11px",borderRadius:9,background:G.card,border:`1px solid ${G.border}`}}>
              <div style={{fontSize:9,color:G.muted,marginBottom:2}}>{s.l}</div>
              <div style={{fontSize:13,fontWeight:900,color:s.c}}>{s.v}</div>

        {/* Revenue summary */}

            {l:"Đã thu",v:fmtVND(collected),c:"#34d399",bg:"#34d39918"},
            {l:"Tổng CP",v:fmtVND(total),c:G.gold,bg:G.gold+"12"},

          ].map(s=><div key={s.l} style={{padding:"11px 8px",borderRadius:11,background:s.bg,border:`1px solid ${s.c}44`,textAlign:"center"}}>
            <div style={{fontSize:9,color:s.c,fontWeight:700,marginBottom:3}}>{s.l}</div>
            <div style={{fontSize:14,fontWeight:900,color:s.c}}>{s.v}</div>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:800,color:G.text}}>
              💳 Thanh toán ({paidPlayers.length}/{evPlayers.length})
            </div>
            <div style={{display:"flex",gap:5}}>
              <span style={{fontSize:10,color:"#34d399",fontWeight:600}}>✅{paidPlayers.length}</span>
              <span style={{fontSize:10,color:G.red,fontWeight:600}}>⏳{unpaidPlayers.length}</span>

              onAmount={a=>setCustomAmt(p,a)}/>)}
          </div>
        </div>
      </>}
      {!ev&&<div style={{color:G.dim,fontSize:12,textAlign:"center",padding:40}}>Không có event nào</div>}
    </>}

    {/* ══ PLAYER VIEW ══ */}
    {view==="player"&&<>
      <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:13,padding:14,marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:800,color:G.text,marginBottom:12}}>🏆 Top chi tiêu</div>
        {playerStats.length===0&&<div style={{color:G.dim,fontSize:11}}>Chưa có dữ liệu</div>}

            <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",
              borderRadius:10,background:i<3?G.gold+"08":G.card,
              border:`1px solid ${i===0?G.gold+"44":G.border}`}}>
              <div style={{fontSize:16,width:24,textAlign:"center",flexShrink:0}}>
                {i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}`}

                <div style={{fontSize:12,fontWeight:700,color:G.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{safe(p.name)}</div>
                <div style={{fontSize:10,color:G.muted,marginTop:1,display:"flex",gap:8}}>
                  <span>🎾 {p.gamesPlayed||0} trận</span>
                  <span>📅 {p.evCount||0} event</span>
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:13,fontWeight:900,color:G.gold}}>{fmtVND(p.spent)}</div>
                {p.monthSpent>0&&<div style={{fontSize:9,color:G.muted}}>tháng này: {fmtVND(p.monthSpent)}</div>}
              </div>
            </div>
          ))}
          {playerStats.filter(p=>p.spent===0&&p.gamesPlayed===0).length>0&&
            <div style={{fontSize:10,color:G.dim,textAlign:"center",padding:"8px 0"}}>
              + {playerStats.filter(p=>p.spent===0&&p.gamesPlayed===0).length} người chưa có dữ liệu
            </div>}
        </div>
      </div>

      {/* All events summary */}
      <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:13,padding:14}}>
        <div style={{fontSize:11,fontWeight:800,color:G.text,marginBottom:12}}>📅 Tổng kết theo event</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {[...events].reverse().map(e=>{
            const ePlayers=players.filter(p=>p?.checkedIn);
            const eTotal=(Number(e.courtFee)||0)+(Number(e.extraFee)||0);
            const ePaid=ePlayers.filter(p=>p?.paid);
            const eCollected=ePaid.reduce((s,p)=>s+(p.paidAmount||0),0);
            const eProfit=eCollected-eTotal;
            return <div key={e.id} style={{padding:"11px 13px",borderRadius:11,background:G.card,border:`1px solid ${G.border}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div>
                  <div style={{fontSize:12,fontWeight:700,color:G.text}}>{e.name}</div>
                  <div style={{fontSize:10,color:G.muted}}>{e.date}{e.location&&` · ${e.location}`}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:11,fontWeight:700,color:eProfit>=0?"#34d399":G.red}}>
                    {eProfit>=0?"💚":"🔴"} {eProfit>=0?"Lời":"Lỗ"} {fmtVND(Math.abs(eProfit))}
                  </div>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5}}>
                {[
                  {l:"Người chơi",v:ePlayers.length},
                  {l:"Chi phí sân",v:fmtVND(Number(e.courtFee)||0)},
                  {l:"Chi phí khác",v:fmtVND(Number(e.extraFee)||0)},
                  {l:"Đã thu",v:fmtVND(eCollected)},
                ].map(s=><div key={s.l} style={{textAlign:"center"}}>
                  <div style={{fontSize:9,color:G.muted}}>{s.l}</div>
                  <div style={{fontSize:11,fontWeight:700,color:G.text}}>{s.v}</div>
                </div>)}
              </div>
            </div>;
          })}
        </div>
      </div>
    </>}
  </div>;
}

// ── Row thanh toán cho từng người trong CostTab

        background:p.paid?"#34d39922":G.gold+"22",color:p.paid?"#34d399":G.gold,flexShrink:0}}>

    </div>
    {editing&&<div style={{padding:"8px 11px 11px",borderTop:`1px solid ${G.border}`,background:G.bg}}>
      {/* Payment method */}
      <div style={{display:"flex",gap:6,marginBottom:8}}>
        {[{v:"transfer",l:"🏦 Chuyển khoản"},{v:"cash",l:"💵 Tiền mặt"},{v:"free",l:"🎁 Miễn phí"}].map(m=>
          <button key={m.v} onClick={()=>onMethod(m.v)}
            style={{flex:1,padding:"6px 4px",borderRadius:7,fontSize:10,fontWeight:700,cursor:"pointer",
              border:`2px solid ${p.payMethod===m.v?G.accent:G.border}`,

          </button>)}

      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <input type="number" value={customAmt} onChange={e=>setCustomAmt(Number(e.target.value))}
          style={{...{background:"#0f1e33",border:"1px solid #172840",borderRadius:8,padding:"7px 10px",color:"#dde6f5",fontSize:12},flex:1}}/>
        <button onClick={()=>{onAmount(customAmt);setEditing(false);}}
          style={{padding:"7px 14px",borderRadius:8,border:"none",background:"#00c9a7",color:"#000",fontWeight:700,fontSize:12,cursor:"pointer"}}>
          Lưu
        </button>
      </div>
    </div>}
  </div>;
}

  if(!editing) return <button onClick={()=>setEditing(true)}
    style={{fontSize:10,color:"#4a6480",border:"1px solid #172840",borderRadius:7,padding:"4px 10px",background:"transparent",cursor:"pointer"}}>
    ✏️ Sửa chi phí
  </button>;
  return <div style={{background:"#060c18",borderRadius:10,padding:12,border:"1px solid #172840",marginTop:8}}>

      <div><div style={{fontSize:9,color:"#4a6480",marginBottom:4}}>GIÁ SÂN</div><input type="number" value={cf} onChange={e=>setCf(e.target.value)} style={iS2}/></div>
      <div><div style={{fontSize:9,color:"#4a6480",marginBottom:4}}>CHI PHÍ KHÁC</div><input type="number" value={ef} onChange={e=>setEf(e.target.value)} style={iS2}/></div>
    </div>
    <div style={{marginBottom:8}}><div style={{fontSize:9,color:"#4a6480",marginBottom:4}}>GHI CHÚ</div><input value={fn} onChange={e=>setFn(e.target.value)} style={iS2}/></div>
    <div style={{marginBottom:8}}><div style={{fontSize:9,color:"#4a6480",marginBottom:4}}>LINK/QR THANH TOÁN</div><input value={qr} onChange={e=>setQr(e.target.value)} style={iS2}/></div>
    <div style={{display:"flex",gap:6}}>

}

  const numCourts=courts.length;
  const liveCount=courts.filter(c=>c.match).length;
  const stats=[
    {i:"👥",l:"Tổng",    v:players.length,                                          c:G.blue},
    {i:"✅",l:"Check-in", v:ci,                                                       c:G.accent},

    {i:"🔴",l:"Live",    v:liveCount,                                                c:G.red},
    {i:"📋",l:"Queue",   v:queue.length,                                             c:"#f59e0b"},

      <span style={{fontSize:12,fontWeight:800,color:G.accent}}>🗓️ {activeEvent.name}</span>
      {activeEvent.location&&<span style={{fontSize:10,color:G.muted}}>📍 {activeEvent.location}</span>}
      <span style={{fontSize:10,color:G.muted,marginLeft:"auto"}}>{activeEvent.date}</span>
    </div>}

    {/* Stats grid — 3 cột trên mobile, 6 trên desktop */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginBottom:10}}>
      {stats.map(s=>(
        <div key={s.l} style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:11,padding:"10px 6px",textAlign:"center"}}>
          <div style={{fontSize:18,marginBottom:2}}>{s.i}</div>
          <div style={{fontSize:26,fontWeight:900,color:s.c,lineHeight:1}}>{s.v}</div>
          <div style={{fontSize:9,color:G.muted,marginTop:3,fontWeight:600}}>{s.l}</div>

      <div style={{fontSize:9,color:G.muted,fontWeight:700,letterSpacing:3,marginBottom:8}}>⚡ QUEUE {queue.length>0&&`(${queue.length})`}</div>

          </div>
      }
      {/* Action buttons — 2x2 grid trên mobile */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
        <button onClick={onQR}    style={{...bP,background:`linear-gradient(135deg,${G.gold},${G.red})`,   fontSize:12,padding:"11px 8px"}}>📷 QR Check-in</button>
        <button onClick={onCustom} style={{...bS,color:G.purple,border:`1px solid ${G.purple}44`,fontSize:12,padding:"11px 8px"}}>✏️ Custom</button>
        <button onClick={genQ}    style={{...bS,fontSize:12,padding:"11px 8px"}}>🎲 Tạo trận</button>
        <button onClick={autoAss} style={{...bP,fontSize:12,padding:"11px 8px"}}>▶ Auto gán</button>
      </div>
    </div>

    {/* Courts — 2 cột trên mobile */}

    <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:12}}>
      {courts.map((c,i)=><CourtCard key={c.id} court={c} elapsed={elapsed[c.id]||0} next={next} onScore={onScore} onAssign={onAssign} courtIdx={i} gameMode={activeEvent?.gameMode||"normal"}/>)}
    </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:8}}>
        {history.filter(h=>h.eventId===activeEvent?.id).slice(0,4).map(h=><HCard key={h.id} h={h}/>)}
      </div>
    </>}
  </div>;
}

function PlayersTab({players,playIds,history,onToggle,onAdd,onCouple,onQR,onEdit,onResetAll}){
  const [search,setSearch]=useState(""),[fG,setFG]=useState("all"),[fS,setFS]=useState("all");
  const [fSt,setFSt]=useState("all"),[sort,setSort]=useState("kootoro");
  let list=[...players].filter(p=>p?.name);
  const sq=safe(search).toLowerCase();
  if(sq)list=list.filter(p=>safe(p.name).toLowerCase().includes(sq)||safe(p.phone||"").includes(sq));
  if(fG!=="all")list=list.filter(p=>p.gender===fG);if(fS!=="all")list=list.filter(p=>p.skill===fS);
  if(fSt==="in")list=list.filter(p=>p.checkedIn);else if(fSt==="out")list=list.filter(p=>!p.checkedIn);
  else if(fSt==="playing")list=list.filter(p=>playIds.has(p.id));else if(fSt==="couple")list=list.filter(p=>p.coupleId);
  list.sort((a,b)=>{if(sort==="kootoro")return (b.kootoro||0)-(a.kootoro||0);if(sort==="elo")return(b.elo||0)-(a.elo||0);if(sort==="name")return safe(a.name).localeCompare(safe(b.name));return(b.gamesPlayed||0)-(a.gamesPlayed||0);});
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={{fontSize:14,fontWeight:800,color:G.text}}>👥 Người chơi ({players.length})</div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
        {onResetAll&&<button onClick={onResetAll} style={{padding:"5px 9px",borderRadius:7,border:`1px solid ${G.red}44`,background:"transparent",color:G.red,fontWeight:600,cursor:"pointer",fontSize:10}}>⚠️ Reset mùa</button>}
        <button onClick={onQR} style={{...bP,background:`linear-gradient(135deg,${G.gold},${G.red})`,fontSize:11}}>📷 QR</button>
        <button onClick={onCouple} style={{...bS,color:G.pink,border:`1px solid ${G.pink}44`}}>💑</button>
        <button onClick={onAdd} style={bP}>+ Thêm</button>
      </div>
    </div>
    <div style={{display:"flex",gap:5,marginBottom:9,flexWrap:"wrap"}}>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Tên / SĐT..." style={{...iS,maxWidth:160}}/>
      <select value={fG} onChange={e=>setFG(e.target.value)} style={{...iS,maxWidth:80}}><option value="all">Tất cả</option><option value="M">♂ Nam</option><option value="F">♀ Nữ</option></select>
      <select value={fS} onChange={e=>setFS(e.target.value)} style={{...iS,maxWidth:100}}><option value="all">Mọi trình</option>{SKILL_LEVELS.map(s=><option key={s} value={s}>{s}</option>)}</select>
      <select value={fSt} onChange={e=>setFSt(e.target.value)} style={{...iS,maxWidth:115}}><option value="all">Tất cả</option><option value="in">✅ Check-in</option><option value="out">❌ Chưa vào</option><option value="playing">🔴 Đang đấu</option><option value="couple">💑 Couple</option></select>
      <select value={sort} onChange={e=>setSort(e.target.value)} style={{...iS,maxWidth:110}}><option value="kootoro">↓ Kootoro</option><option value="elo">↓ ELO</option><option value="name">↓ Tên</option><option value="games">↓ Trận</option></select>
    </div>
    <div style={{background:G.panel,borderRadius:11,border:`1px solid ${G.border}`,overflow:"hidden"}}>
      <div style={{display:"grid",gridTemplateColumns:"145px 48px 58px 88px 55px 44px 46px 68px 90px",padding:"7px 12px",borderBottom:`1px solid ${G.border}`,fontSize:9,color:G.muted,fontWeight:700}}>
        <div>TÊN</div><div>G</div><div>TRÌNH</div><div>TRẠNG THÁI</div><div>ELO</div><div>TRẬN</div><div>WIN%</div><div>KOOTORO</div><div>ACTION</div>
