          <div style={{fontSize:11,fontWeight:700,color:G.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:3}}>
            {p.phone&&<span title={p.phone} style={{fontSize:8,color:G.blue}}>📱</span>}
            {safe(p.name)}{p.coupleId&&<CBadge type={p.coupleType}/>}
          </div>
          <div><GBadge gender={p.gender}/></div><div><SBadge skill={p.skill}/></div>
          <div>{playing?<Chip label="🔴 Đấu" color={G.red}/>:p.checkedIn?<Chip label="⏳ Chờ" color={G.purple}/>:<Chip label="❌ Out" color={G.muted}/>}</div>
          <div style={{fontSize:12,fontWeight:900,color:SKILL_COLOR[p.skill]||G.muted}}>{p.elo||"?"}</div>
          <div style={{fontSize:10,color:G.muted}}>{p.gamesPlayed||0}</div>
          <div style={{fontSize:10,color:wr>=50?G.accent:G.red,fontWeight:700}}>{wr}%</div>
          <div style={{fontSize:11,fontWeight:800,color:k>0?G.gold:k<0?G.red:G.muted}}>{k>0?"+":""}{k}</div>
          <div style={{display:"flex",gap:3}}>
            {onEdit&&<button onClick={()=>onEdit(p)} style={{padding:"3px 7px",borderRadius:5,border:`1px solid ${G.border}`,background:"transparent",color:G.muted,cursor:"pointer",fontSize:9,fontWeight:700}}>✏️</button>}
            <button onClick={()=>onToggle(p.id)} style={{padding:"3px 8px",borderRadius:5,border:"none",cursor:"pointer",fontWeight:700,fontSize:9,background:p.checkedIn?G.accent+"22":`linear-gradient(135deg,${G.accent},${G.blue})`,color:p.checkedIn?G.accent:"#fff"}}>{p.checkedIn?"✅":"IN"}</button>
          </div>
        </div>;
      })}
    </div>
  </div>;
}

function QueueTab({queue,setQueue,courts,available,history,elapsed,onScore,onAssign,genQ,autoAss,onCustom}){
  const playIds=new Set(courts.flatMap(c=>c.match?[...(c.match.team1||[]),...(c.match.team2||[])].filter(Boolean).map(p=>p.id):[]));
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
      <div style={{fontSize:14,fontWeight:800,color:G.text}}>⚔️ Queue & Live</div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={onCustom} style={{...bS,color:G.purple,border:`1px solid ${G.purple}44`}}>✏️ Custom</button>
        <button onClick={genQ} style={bS}>🎲 Tạo trận</button>
        <button onClick={autoAss} style={bP}>▶ Auto gán</button>
      </div>
    </div>
    <div style={{background:G.panel,border:`1px solid ${G.border}`,borderRadius:11,padding:11,marginBottom:11}}>
      <div style={{fontSize:9,color:G.muted,fontWeight:700,marginBottom:7}}>⏳ CHỜ ({available.length})</div>
      {!available.length?<div style={{color:G.dim,fontSize:11}}>Tất cả đang đấu</div>:
      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
        {available.sort((a,b)=>(a.gamesPlayed||0)-(b.gamesPlayed||0)).map(p=>(
          <div key={p.id} style={{padding:"4px 9px",borderRadius:7,background:G.card,border:`1px solid ${(p.gamesPlayed||0)===0?G.gold+"66":G.border}`,display:"flex",alignItems:"center",gap:5}}>
            {(p.gamesPlayed||0)===0&&<span style={{fontSize:9,color:G.gold}}>🆕</span>}
            <span style={{fontSize:11,fontWeight:700,color:G.text}}>{safe(p.name)}</span><SBadge skill={p.skill}/><GBadge gender={p.gender}/>
          </div>
        ))}
      </div>}
    </div>
    {queue.length>0&&<div style={{marginBottom:11}}>
      <div style={{fontSize:9,color:G.muted,fontWeight:700,marginBottom:6}}>📋 QUEUE ({queue.length})</div>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>{queue.map((q,i)=><QRow key={i} q={q} idx={i} courts={courts} onAssign={onAssign} onRemove={()=>setQueue(p=>p.filter((_,j)=>j!==i))}/>)}</div>
    </div>}
    <div style={{fontSize:9,color:G.muted,fontWeight:700,marginBottom:6}}>🔴 ĐANG ĐẤU</div>
    {!courts.filter(c=>c.match).length?<div style={{color:G.dim,fontSize:11}}>Chưa có</div>:
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:9}}>
      {courts.filter(c=>c.match).map(c=><CourtCard key={c.id} court={c} elapsed={elapsed[c.id]||0} next={[]} onScore={onScore} onAssign={onAssign}/>)}
    </div>}
  </div>;
}

// ══════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════
function App(){
  // Restore session từ sessionStorage — không cần đăng nhập lại khi refresh
  const savedMe = (() => { try { const s=sessionStorage.getItem('pb_me'); return s?JSON.parse(s):null; } catch{return null;} })();

  const [loading,  setLoading]  = useState(true);
  const [saving,   setSaving]   = useState(false);
  const [me,       setMe]       = useState(savedMe);
  const [accounts, setAccounts] = useState(defaultAccounts);
  const [players,  setPlayers]  = useState(()=>buildSeed(null));
  const [history,  setHistory]  = useState([]);
  const [courts,   setCourts]   = useState(()=>Array.from({length:5},(_,i)=>({id:`c${i+1}`,name:`Sân ${i+1}`,match:null,startedAt:null})));
  const [queue,    setQueue]    = useState([]);
  const [events,   setEvents]   = useState([]);
  const [activeEventId, setActiveEventId] = useState(null);
  const [numCourts,setNumCourts]= useState(5);
  const [tab,      setTab]      = useState("dashboard");
  const [modal,    setModal]    = useState(null);
  const [scoreTarget,setScoreTarget] = useState(null);
  const [subCourt, setSubCourt] = useState(null);
  const [editingPlayer,setEditingPlayer] = useState(null);
  const [tvMode,   setTvMode]   = useState(false);
  const [toast,    setToast]    = useState(null);
  const [elapsed,  setElapsed]  = useState({});
  const tickRef=useRef(), saveRef=useRef(), unsubRef=useRef();
  // Refs để saveAll luôn dùng state mới nhất — tránh stale closure
  const stateRef = useRef({});
  stateRef.current = {accounts,events,players,history,courts,queue,activeEventId,numCourts};

  // Persist me vào sessionStorage — sống qua F5, chết khi đóng tab
  const login = (user) => {
    setMe(user);
    try { sessionStorage.setItem('pb_me', JSON.stringify(user)); } catch{}
    // Sau khi login, load lại data mới nhất từ Firebase để đồng bộ
    window.STORE?.load().then(db => {
      if(db) {
        console.log('🔄 Post-login Firebase sync');
        applyDb(db);
      }
    }).catch(()=>{});
  };
  const logout = () => {
    setMe(null);
    try { sessionStorage.removeItem('pb_me'); } catch{}
  };

  // ── SAVE — luôn dùng stateRef để có state mới nhất
  const saveAll = useCallback((extra={})=>{
    const st = {...stateRef.current, ...extra};
    setSaving(true);
    window._lastSaveAt = Date.now();
    STORE.save({
      accounts: st.accounts,
      events: st.events,
      numCourts: st.numCourts,
      activeEventId: st.activeEventId,
      history: st.history.slice(0,1000),
      players: st.players.map(p=>({
        id:p.id, name:p.name, gender:p.gender, skill:p.skill, elo:p.elo, baseElo:p.baseElo||p.elo,
        dtype:p.dtype, coupleId:p.coupleId||null, coupleType:p.coupleType||null,
        gamesPlayed:p.gamesPlayed||0, wins:p.wins||0, lastPartners:p.lastPartners||[],
        createdAt:p.createdAt, phone:p.phone||"", note:p.note||"", kootoro:p.kootoro||0,
        checkedIn: p.checkedIn === true, // ← lưu đúng boolean
        paid:p.paid||false, paidAmount:p.paidAmount||0, payMethod:p.payMethod||"transfer",
        totalSpent:p.totalSpent||0, monthSpent:p.monthSpent||0, eventCount:p.eventCount||0
      })),
      courts: st.courts.map(c=>({
        ...c, _elapsed: c.startedAt ? Math.floor((Date.now()-c.startedAt)/1000) : 0
      })),
      queue: st.queue,
    });
    setTimeout(()=>setSaving(false), 500);
  },[]); // không có dependency — dùng stateRef

  // Helper: áp dụng data từ DB vào state
  const applyDb = useCallback((db) => {
    if(!db || typeof db !== 'object') return;
    if(db.accounts && Array.isArray(db.accounts.admins) && db.accounts.admins.length > 0)
      setAccounts(db.accounts);
    if(Array.isArray(db.events) && db.events.length > 0) setEvents(db.events);
    if(Array.isArray(db.players) && db.players.length > 0) setPlayers(buildSeed(db.players));
    if(Array.isArray(db.history) && db.history.length > 0) setHistory(db.history);
    if(db.activeEventId !== undefined) setActiveEventId(db.activeEventId||null);
    if(typeof db.numCourts === 'number' && db.numCourts >= 2) setNumCourts(db.numCourts);
    if(Array.isArray(db.queue)) setQueue(db.queue);
    if(Array.isArray(db.courts) && db.courts.length > 0) {
      setCourts(db.courts.map(c=>({
        ...c,
        // Dùng _elapsed từ Firebase để tính startedAt đồng bộ mọi thiết bị
        // _elapsed = số giây đã trôi qua khi save → startedAt = now - elapsed
        startedAt: c.match && typeof c._elapsed === 'number' && c._elapsed >= 0
          ? Date.now() - c._elapsed * 1000
          : null
      })));
    }
  }, []);

  // ── LOAD
  useEffect(()=>{
    const initDb = window.__initialData;
    if(initDb) applyDb(initDb);
    setLoading(false);

    // Subscribe: nhận tất cả update từ Firebase
    const unsub = window.STORE?.subscribe((fbData) => {
      if(!fbData) return;

      // Bỏ qua nếu chính thiết bị này vừa save trong 1 giây vừa rồi
      // (tránh apply lại data mình vừa set — đã có trong state rồi)
      const isMyOwnSave = fbData._deviceId === window._deviceId &&
                          window._lastSavedAt &&
                          (Date.now() - window._lastSavedAt) < 1000;
      if(isMyOwnSave) {
        console.log('⏭️ Own save echo — skipped');
        return;
      }

      // Thiết bị khác save → apply toàn bộ để đồng bộ
      console.log('🔄 Remote update from device:', fbData._deviceId);
      applyDb(fbData);
    });
    if(unsub) unsubRef.current = unsub;
    return () => { if(unsubRef.current) unsubRef.current(); };
  }, [applyDb]);

  // Auto-save: chỉ cho history và events (không có dependency trên players/courts để tránh race condition)
  useEffect(()=>{
    if(!me||me.role===ROLES.VIEWER) return;
    if(!history.length && !activeEventId) return;
    clearTimeout(saveRef.current);
    saveRef.current=setTimeout(()=>{
      window._lastSaveAt=Date.now();
      saveAll();
    },3000);
  },[history,activeEventId,numCourts,me]);

  // Timer cho sân
  useEffect(()=>{
    tickRef.current=setInterval(()=>{
      setElapsed(prev=>{const n={...prev};courts.forEach(c=>{if(c.match&&c.startedAt)n[c.id]=Math.floor((Date.now()-c.startedAt)/1000);});return n;});
    },1000);
    return()=>clearInterval(tickRef.current);
  },[courts]);

  // Sync số sân khi numCourts thay đổi (giữ trận đang đấu)
  useEffect(()=>{
    setCourts(prev=>{
      if(prev.length===numCourts) return prev;
      return Array.from({length:numCourts},(_,i)=>prev[i]||{id:`c${i+1}`,name:`Sân ${i+1}`,match:null,startedAt:null});
    });
  },[numCourts]);

  const playIds   = new Set(courts.flatMap(c=>c.match?[...(c.match.team1||[]),...(c.match.team2||[])].filter(Boolean).map(p=>p.id):[]));
  const available = players.filter(p=>p&&p.checkedIn&&!playIds.has(p.id));
  const activeEvent = events.find(e=>e.id===activeEventId)||null;
  const showT=(msg,type="ok")=>setToast({msg,type});

  // ── EVENT MANAGEMENT
  const createEvent = (ev) => {
    const newEvents = [...stateRef.current.events, ev];
    // Giữ nguyên players, chỉ reset checkedIn — data players được GIỮ LẠI cho event sau
    const resetPlayers = serializePlayers(stateRef.current.players.map(x=>({...x,checkedIn:false})));
    setEvents(newEvents);
    setActiveEventId(ev.id);
    setQueue([]);
    setPlayers(resetPlayers);
    showT(`🗓️ Event "${ev.name}" đã tạo! ${resetPlayers.length} người chơi sẵn sàng.`);
    window._lastSaveAt=Date.now();
    STORE.save({...stateRef.current, events:newEvents, activeEventId:ev.id, queue:[], players:resetPlayers});
    setModal(null);
  };

  const editEvent = (ev) => {
    const newEvents = stateRef.current.events.map(e=>e.id===ev.id?ev:e);
    setEvents(newEvents);
    showT("Event đã cập nhật ✏️");
    window._lastSaveAt=Date.now();
    STORE.save({...stateRef.current, events:newEvents});
  };

  const endEvent = () => {
    if(!activeEvent) return;
    const newEvents = stateRef.current.events.map(e=>e.id===activeEvent.id?{...e,ended:true,endedAt:nowStr()}:e);
    // Finalize: update totalSpent and eventCount for players who checked in
    const total=(Number(activeEvent.courtFee)||0)+(Number(activeEvent.extraFee)||0);
    const ciCount=stateRef.current.players.filter(p=>p?.checkedIn).length||1;
    const perPerson=total>0?Math.ceil(total/ciCount):0;
    // Giữ nguyên players với ELO/stats — reset checkedIn, cộng dồn chi phí
    const resetPlayers = serializePlayers(stateRef.current.players.map(x=>{
      if(!x?.name) return {...x,checkedIn:false};
      const addSpent=x.checkedIn&&x.paid?(x.paidAmount||perPerson):0;
      const addEvent=x.checkedIn?1:0;
      return {...x,checkedIn:false,paid:false,paidAmount:0,
        totalSpent:(x.totalSpent||0)+addSpent,
        eventCount:(x.eventCount||0)+addEvent,
      };
    }));
    setEvents(newEvents);
    setActiveEventId(null);
    setQueue([]);
    setPlayers(resetPlayers);
    showT(`Event "${activeEvent.name}" kết thúc 💾 · ${resetPlayers.length} người chơi đã lưu.`);
    window._lastSaveAt=Date.now();
    STORE.save({...stateRef.current, events:newEvents, activeEventId:null, queue:[], players:resetPlayers});
  };

  const serializePlayers=pl=>pl.map(p=>({
    id:p.id,name:p.name,gender:p.gender,skill:p.skill,elo:p.elo,baseElo:p.baseElo||p.elo,
    dtype:p.dtype,coupleId:p.coupleId||null,coupleType:p.coupleType||null,
    gamesPlayed:p.gamesPlayed||0,wins:p.wins||0,lastPartners:p.lastPartners||[],
    createdAt:p.createdAt,phone:p.phone||"",note:p.note||"",kootoro:p.kootoro||0,
    checkedIn:p.checkedIn||false,paid:p.paid||false,
    paidAmount:p.paidAmount||0,payMethod:p.payMethod||"transfer",
    totalSpent:p.totalSpent||0,monthSpent:p.monthSpent||0,eventCount:p.eventCount||0
  }));

  const handleRegister=data=>{
    setPlayers(prev=>{
      const ex=prev.find(p=>p.id===data.id);
      let upd=ex
        ? prev.map(p=>p.id===data.id?{...p,...data,checkedIn:true}:p)
        : [...prev,{...data,checkedIn:true}];
      if(data.coupleWithId&&data.coupleId)
        upd=upd.map(p=>p.id===data.coupleWithId?{...p,coupleId:data.coupleId,coupleType:data.coupleType||"couple"}:p);
      window._lastSaveAt=Date.now();
      STORE.save({...stateRef.current,players:serializePlayers(upd)});
      return upd;
    });
    showT(`${safe(data.name)} đã check in! 🎉`);
  };

  const handleCheckInAll=()=>{
    const upd=players.map(p=>p?.name?{...p,checkedIn:true}:p);
    setPlayers(upd);
    showT(`✅ Check-in tất cả ${upd.filter(p=>p?.checkedIn).length} người!`);
    window._lastSaveAt=Date.now();
    STORE.save({...stateRef.current,players:serializePlayers(upd)});
  };

  const genQueue=()=>{
    if(available.length<4){showT("Cần ít nhất 4 người!","warn");return;}
    const newM=[],used=new Set();
    const cm={};available.forEach(p=>{if(p?.coupleId){if(!cm[p.coupleId])cm[p.coupleId]=[];cm[p.coupleId].push(p);}});
    Object.values(cm).forEach(pair=>{
      if(pair.length===2&&!used.has(pair[0].id)&&!used.has(pair[1].id)){
        const others=available.filter(p=>!used.has(p.id)&&p.id!==pair[0].id&&p.id!==pair[1].id);
        if(others.length>=2){const o1=others[rng(0,Math.min(2,others.length-1))],o2=others.filter(p=>p.id!==o1.id)[rng(0,Math.max(0,Math.min(2,others.length-2)))];
          if(o1&&o2){const dt=pair[0].gender!==pair[1].gender&&o1.gender!==o2.gender?"mixed":"any";newM.push({team1:[pair[0],pair[1]],team2:[o1,o2],dtype:dt,coupleMatch:true});[pair[0].id,pair[1].id,o1.id,o2.id].forEach(id=>used.add(id));}}
      }
    });
    for(const dt of["mixed","male","female","any"]){const pool=available.filter(p=>!used.has(p.id));if(pool.length<4)break;const m=genMatch(pool,history,dt);if(m){newM.push(m);[...m.team1,...m.team2].forEach(p=>used.add(p.id));}}
    if(!newM.length){showT("Không tạo được trận!","warn");return;}
    setQueue(p=>[...p,...newM]);showT(`Đã thêm ${newM.length} trận ⚡`);
  };

  const assign=(cid,mdata)=>{
    const newCourts=stateRef.current.courts.map(c=>c.id===cid?{...c,match:{...mdata},startedAt:Date.now()}:c);
    const newQueue=stateRef.current.queue.filter(q=>q!==mdata);
    setCourts(newCourts);
    setQueue(newQueue);
    showT(`Trận bắt đầu tại ${courts.find(c=>c.id===cid)?.name}! 🏓`);
    window._lastSaveAt=Date.now();
    STORE.save({...stateRef.current,
      courts:newCourts.map(c=>({...c,
        _elapsed: c.startedAt ? Math.floor((Date.now()-c.startedAt)/1000) : 0,
        _startedTs: c.match ? (c._startedTs || Date.now()) : null
      })),
      queue:newQueue
    });
  };

  const autoAssign=()=>{
    const free=stateRef.current.courts.filter(c=>!c.match);
    if(!free.length){showT("Không có sân trống!","warn");return;}
    if(!stateRef.current.queue.length){showT("Queue trống!","warn");return;}
    let q=[...stateRef.current.queue];
    let newCourts=[...stateRef.current.courts];
    free.forEach(c=>{
      if(!q.length)return;
      const m=q.shift();
      newCourts=newCourts.map(x=>x.id===c.id?{...x,match:m,startedAt:Date.now()}:x);
    });
    setCourts(newCourts);
    setQueue(q);
    showT(`Đã gán ${free.length - (stateRef.current.queue.length - q.length < free.length ? 0:0)} trận ▶`);
    window._lastSaveAt=Date.now();
    STORE.save({...stateRef.current,
      courts:newCourts.map(c=>({...c,_elapsed:c.startedAt?Math.floor((Date.now()-c.startedAt)/1000):0})),
      queue:q
    });
  };

  const handleScore=(w,sw,sl)=>{
    if(!activeEvent){showT("Tạo Event trước khi nhập điểm!","warn");return;}
    const court=courts.find(c=>c.id===scoreTarget);if(!court?.match)return;
    const courtIdx=courts.findIndex(c=>c.id===scoreTarget);
    const m=court.match,wT=(w===1?m.team1:m.team2).filter(Boolean),lT=(w===1?m.team2:m.team1).filter(Boolean);
    if(!wT.length||!lT.length)return;
    const delta=Math.round(28*(1-(1/(1+Math.pow(10,(teamElo(lT)-teamElo(wT))/400)))));
    const t10=m.team1?.[0],t11=m.team1?.[1],t20=m.team2?.[0],t21=m.team2?.[1];
    const np={};if(t10&&t11){np[t10.id]=t11.id;np[t11.id]=t10.id;}if(t20&&t21){np[t20.id]=t21.id;np[t21.id]=t20.id;}
    const newHEntry={id:uid(),eventId:activeEventId,courtId:scoreTarget,dtype:m.dtype,team1:m.team1.filter(Boolean),team2:m.team2.filter(Boolean),winner:w,scoreWinner:sw,scoreLoser:sl,score:`${w===1?sw:sl}-${w===1?sl:sw}`,eloDelta:delta,time:nowStr()};
    const newHistory=[newHEntry,...history];
    setHistory(newHistory);

    const gm=activeEvent?.gameMode||"normal";
    // Tính toán courts và queue mới trước khi set state
    let newCourts=[...stateRef.current.courts];
    let newQueue=[...stateRef.current.queue];

    if(gm==="king"&&courtIdx===0){
      newCourts=newCourts.map(c=>c.id===scoreTarget?{...c,match:null,startedAt:null}:c);
      newQueue=[{team1:wT,team2:wT,dtype:m.dtype,keepWinner:true},...newQueue];
    } else if(gm==="ladder"){
      newCourts=newCourts.map(c=>c.id===scoreTarget?{...c,match:null,startedAt:null}:c);
      const winnerNextIdx=Math.max(0,courtIdx-1);
      const loserNextIdx=Math.min(newCourts.length-1,courtIdx+1);
      const promoted={team1:wT.slice(0,2),team2:wT.slice(0,2),dtype:m.dtype,promoteTo:winnerNextIdx,custom:true};
      const demoted={team1:lT.slice(0,2),team2:lT.slice(0,2),dtype:m.dtype,promoteTo:loserNextIdx,custom:true};
      newQueue=[promoted,demoted,...newQueue];
    } else {
      newCourts=newCourts.map(c=>c.id===scoreTarget?{...c,match:null,startedAt:null}:c);
    }

    setCourts(newCourts);
    setQueue(newQueue);
    setScoreTarget(null);

    // Tính players mới
    const newPlayers=stateRef.current.players.map(x=>{
      const isW=wT.some(v=>v.id===x.id),isL=lT.some(v=>v.id===x.id);
      if(!isW&&!isL)return x;
      const lp=np[x.id]?[np[x.id],...(x.lastPartners||[])].slice(0,4):x.lastPartners||[];
      const updP={...x,elo:x.elo+(isW?delta:-delta),gamesPlayed:(x.gamesPlayed||0)+1,wins:(x.wins||0)+(isW?1:0),lastPartners:lp};
      updP.kootoro=Math.round(kootoro(updP,newHistory)*10)/10;
      return updP;
    });
    setPlayers(newPlayers);

    // Save 1 lần duy nhất với toàn bộ state mới
    window._lastSaveAt=Date.now();
    STORE.save({...stateRef.current,
      history:newHistory.slice(0,1000),
      players:serializePlayers(newPlayers),
      courts:newCourts.map(c=>({...c,_elapsed:c.startedAt?Math.floor((Date.now()-c.startedAt)/1000):0})),
      queue:newQueue
    });

    const modMsg=gm==="king"?(courtIdx===0?" 👑 Vua giữ ngai!":""):gm==="ladder"?" 🪜 Di chuyển sân!":"";
    showT(`${wT.filter(Boolean).map(p=>safe(p.name).split(" ").pop()).join(" & ")} thắng ${sw}-${sl}! ±${delta} ELO${modMsg}`);
  };

  const toggleCI=id=>{
    setPlayers(prev=>{
      const p=prev.find(x=>x.id===id);
      if(!p) return prev;
      const newCI = p.checkedIn !== true; // toggle chính xác
      const upd=prev.map(x=>x.id===id?{...x,checkedIn:newCI}:x);
      showT(`${safe(p.name)} ${newCI?"check in ✅":"rời session"}`);
      window._lastSaveAt = Date.now();
      STORE.save({...stateRef.current, players:serializePlayers(upd)});
      return upd;
    });
  };

  // Thay người khi bận
  const subPlayer=(cid,pOut,pIn)=>{
    if(!pOut||!pIn)return;
    setCourts(prev=>prev.map(c=>{
      if(c.id!==cid||!c.match)return c;
      const t1=c.match.team1.map(p=>p.id===pOut.id?pIn:p);
      const t2=c.match.team2.map(p=>p.id===pOut.id?pIn:p);
      return {...c,match:{...c.match,team1:t1,team2:t2}};
    }));
    setSubCourt(null);
    showT(`🔄 ${safe(pOut.name)} → ${safe(pIn.name)}`);
  };

  // Lưu thay đổi người chơi
  const savePlayer=p=>{
    setPlayers(prev=>prev.map(x=>x.id===p.id?p:x));
    setEditingPlayer(null);
    showT(`💾 Đã lưu: ${safe(p.name)}`);
  };

  const CSS=`
    @keyframes tIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    input,select{outline:none;}
    input::placeholder{color:${G.muted};}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-thumb{background:${G.border};border-radius:3px;}
    button:active{transform:scale(.97);}
    nav::-webkit-scrollbar{display:none;}
    nav{-ms-overflow-style:none;scrollbar-width:none;}
    .hscroll::-webkit-scrollbar{display:none;}
    .hscroll{-ms-overflow-style:none;scrollbar-width:none;}
  `;

  const scoreMatch=scoreTarget?courts.find(c=>c.id===scoreTarget)?.match:null;
  const isSA=me?.role===ROLES.SA;

  if(loading) return <><style>{CSS}</style><div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:G.bg,flexDirection:"column",gap:16}}><div style={{fontSize:48}}>🏓</div><div style={{color:G.muted,fontSize:13,letterSpacing:2}}>ĐANG TẢI...</div></div></>;
  if(!me) return <><style>{CSS}</style><Login accounts={accounts} onLogin={login} loading={false}/></>;
  if(me.role===ROLES.VIEWER) return <><style>{CSS}</style>
    {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
    <ViewerMode players={players} courts={courts} history={history} queue={queue} elapsed={elapsed} events={events} activeEventId={activeEventId} numCourts={numCourts} onLogout={logout}/>
  </>;

  return <div style={{minHeight:"100vh",background:G.bg,color:G.text,fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
    <style>{CSS}</style>
    {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}

    {/* MODALS */}
    {modal==="qr"       &&<QRModal players={players} onRegister={handleRegister} onCheckInAll={handleCheckInAll} onClose={()=>setModal(null)} activeEvent={activeEvent}/>}
    {modal==="custom"   &&<CustomModal players={players} onAdd={m=>{setQueue(p=>[...p,{...m,custom:true}]);setModal(null);showT("Custom ✏️");}} onClose={()=>setModal(null)}/>}
    {modal==="couple"   &&<CoupleModal players={players} setPlayers={setPlayers} onClose={()=>setModal(null)}/>}
    {modal==="admin"    &&<AdminModal accounts={accounts} setAccounts={setAccounts} me={me} onClose={()=>setModal(null)} toast={showT} numCourts={numCourts} setNumCourts={setNumCourts} onSaveAccounts={newAcc=>saveAll({accounts:newAcc})}/>}
    {modal==="newEvent" &&<EventModal isNew onSave={createEvent} onClose={()=>setModal(null)}/>}
    {scoreTarget&&scoreMatch&&<ScoreModal match={scoreMatch} onConfirm={handleScore} onClose={()=>setScoreTarget(null)}/>}
    {subCourt&&<SubModal court={subCourt} players={players} playIds={playIds} onSub={subPlayer} onClose={()=>setSubCourt(null)}/>}
    {editingPlayer&&<EditPlayerModal player={editingPlayer} onSave={savePlayer} onClose={()=>setEditingPlayer(null)} toast={showT}/>}
    {tvMode&&<TVMode courts={courts} elapsed={elapsed} queue={queue} players={players} history={history} onClose={()=>setTvMode(false)}/>}

    {/* HEADER — compact mobile */}
    <header style={{background:G.panel,borderBottom:`1px solid ${G.border}`,position:"sticky",top:0,zIndex:200}}>
      {/* Row 1: Logo + event + key stats + settings */}
      <div style={{height:50,display:"flex",alignItems:"center",gap:8,padding:"0 10px"}}>
        {/* Logo */}
        <div style={{width:32,height:32,borderRadius:9,flexShrink:0,background:`linear-gradient(135deg,${G.accent},${G.blue})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🏓</div>
        {/* Title + role */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:900,fontSize:12,color:"#fff",lineHeight:1.1,display:"flex",alignItems:"center",gap:5}}>
            PICKLEBALL <SaveDot saving={saving}/>
          </div>
          <div style={{fontSize:9,color:G.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {safe(me.name)} · {activeEvent?activeEvent.name:"Chưa có event"}
          </div>
        </div>
        {/* Key stats — compact chips */}
        <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
          <div style={{padding:"3px 7px",borderRadius:6,background:G.accent+"18",border:`1px solid ${G.accent}44`,fontSize:11,fontWeight:700,color:G.accent}}>
            ✅{players.filter(p=>p?.checkedIn).length}
          </div>
          <div style={{padding:"3px 7px",borderRadius:6,background:G.red+"18",border:`1px solid ${G.red}44`,fontSize:11,fontWeight:700,color:G.red}}>
            🔴{courts.filter(c=>c.match).length}
          </div>
          {/* Event toggle */}
          {activeEvent
            ? <div style={{display:"flex",alignItems:"center",gap:3,padding:"3px 8px",borderRadius:6,background:G.accent+"12",border:`1px solid ${G.accent}44`,maxWidth:90,overflow:"hidden"}}>
                <span style={{fontSize:9,color:G.accent,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{activeEvent.name}</span>
                <button onClick={endEvent} style={{padding:"1px 3px",borderRadius:3,border:"none",background:"transparent",color:G.red,cursor:"pointer",fontSize:10,fontWeight:700,flexShrink:0}}>✕</button>
              </div>
            : <button onClick={()=>setModal("newEvent")} style={{...bP,background:`linear-gradient(135deg,${G.gold},${G.purple})`,fontSize:9,padding:"4px 8px",flexShrink:0}}>🗓️</button>
          }
          {isSA&&<button onClick={()=>setModal("admin")} style={{...bS,color:G.gold,border:`1px solid ${G.gold}44`,padding:"4px 7px",fontSize:12}}>⚙️</button>}
        </div>
      </div>
      {/* Row 2: Quick action strip — scroll horizontal */}
      <div className="hscroll" style={{display:"flex",gap:5,padding:"4px 10px 6px",overflowX:"auto"}}>
        <button onClick={()=>setModal("qr")} style={{...bP,background:`linear-gradient(135deg,${G.gold},${G.red})`,fontSize:10,padding:"5px 11px",flexShrink:0,borderRadius:7}}>📷 QR</button>
        <button onClick={()=>setTab("kiosk")} style={{...bP,background:`linear-gradient(135deg,${G.purple},${G.pink})`,fontSize:10,padding:"5px 11px",flexShrink:0,borderRadius:7}}>📲 Kiosk</button>
        <button onClick={()=>setModal("couple")} style={{...bS,color:G.pink,border:`1px solid ${G.pink}44`,fontSize:10,padding:"5px 10px",flexShrink:0,borderRadius:7}}>💑 Cặp</button>
        <button onClick={()=>setTvMode(true)} style={{...bS,fontSize:10,padding:"5px 10px",flexShrink:0,borderRadius:7}}>📺 TV</button>
        <div style={{padding:"4px 8px",borderRadius:7,background:G.gold+"12",border:`1px solid ${G.gold}33`,fontSize:9,color:G.gold,fontWeight:700,flexShrink:0,display:"flex",alignItems:"center",cursor:"pointer"}} onClick={()=>setModal("admin")}>
          👁 {accounts?.viewerCode||"PICKLE"}
        </div>
        <RBadge role={me.role}/>
        <button onClick={logout} style={{...bS,fontSize:10,padding:"5px 10px",flexShrink:0,borderRadius:7,color:G.red,border:`1px solid ${G.red}33`}}>← Xuất</button>
      </div>
    </header>

    {/* EVENT ALERT nếu chưa có */}
    {!activeEvent&&<div style={{background:`linear-gradient(90deg,${G.gold}18,${G.purple}18)`,borderBottom:`1px solid ${G.gold}44`,padding:"8px 16px",display:"flex",alignItems:"center",gap:10}}>
      <span style={{fontSize:11,color:G.gold}}>⚠️ Chưa có event nào đang chạy.</span>
      <button onClick={()=>setModal("newEvent")} style={{...bP,background:`linear-gradient(135deg,${G.gold},${G.purple})`,fontSize:11,padding:"5px 14px"}}>🗓️ Tạo Event ngay</button>
      <span style={{fontSize:10,color:G.dim}}>Tạo event để lưu lịch sử trận đấu theo ngày</span>
    </div>}

    {/* NAV */}
    <nav style={{display:"flex",gap:2,padding:"4px 10px",background:G.panel,borderBottom:`1px solid ${G.border}`,overflowX:"auto"}}>
      {TABS.map(t=>{const isK=t.id==="kiosk",isH=t.id==="history";const ac=isK?G.purple:isH?G.gold:G.accent;const act=tab===t.id;return <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"6px 10px",borderRadius:6,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,whiteSpace:"nowrap",background:act?ac+"22":"transparent",color:act?ac:G.muted,borderBottom:act?`2px solid ${ac}`:"2px solid transparent",flexShrink:0}}>{t.l}</button>;})}
    </nav>

    {/* MAIN CONTENT */}
    <main className="main-pad" style={{padding:"10px 12px",maxWidth:1800,margin:"0 auto"}}>
      {tab==="dashboard"  &&<DashTab courts={courts} players={players} queue={queue} history={history} elapsed={elapsed} available={available} next={queue.slice(0,3)} onScore={id=>setScoreTarget(id)} onAssign={assign} genQ={genQueue} autoAss={autoAssign} onCustom={()=>setModal("custom")} onQR={()=>setModal("qr")} activeEvent={activeEvent}/>}
      {tab==="courts"     &&<div>
        {activeEvent?.gameMode&&activeEvent.gameMode!=="normal"&&(()=>{const gm=GAME_MODES.find(m=>m.val===activeEvent.gameMode);return <div style={{padding:"8px 14px",borderRadius:9,background:activeEvent.gameMode==="king"?G.gold+"14":G.purple+"14",border:`1px solid ${activeEvent.gameMode==="king"?G.gold:G.purple}44`,marginBottom:10,display:"flex",alignItems:"center",gap:9}}>
          <span style={{fontSize:18}}>{gm?.label.split(" ")[0]}</span>
          <div><div style={{fontSize:12,fontWeight:800,color:activeEvent.gameMode==="king"?G.gold:G.purple}}>{gm?.label}</div><div style={{fontSize:10,color:G.muted}}>{gm?.desc}</div></div>
        </div>;})()}
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:14}}>{courts.map((c,i)=><CourtCard key={c.id} court={c} elapsed={elapsed[c.id]||0} next={queue.slice(0,3)} onScore={id=>setScoreTarget(id)} onAssign={assign} onSub={setSubCourt} courtIdx={i} gameMode={activeEvent?.gameMode||"normal"}/>)}</div>
        {queue.length>0&&<><div style={{fontSize:9,color:G.muted,fontWeight:700,marginBottom:6}}>⚔️ HÀNG CHỜ ({queue.length})</div><div style={{display:"flex",flexDirection:"column",gap:5}}>{queue.map((q,i)=><QRow key={i} q={q} idx={i} courts={courts} onAssign={assign}/>)}</div></>}
      </div>}
      {tab==="players"    &&<PlayersTab players={players} playIds={playIds} history={history} onToggle={toggleCI} onAdd={()=>setModal("qr")} onCouple={()=>setModal("couple")} onQR={()=>setModal("qr")} onEdit={setEditingPlayer} onResetAll={()=>{if(!confirm("Reset ELO + Kootoro TẤT CẢ về mùa mới?"))return;setPlayers(p=>p.map(x=>({...x,elo:SKILL_ELO[x.skill]||1200,baseElo:SKILL_ELO[x.skill]||1200,kootoro:0,gamesPlayed:0,wins:0,lastPartners:[]})));showT("🔄 Reset tất cả xong!","warn");}}/>}
      {tab==="queue"      &&<QueueTab queue={queue} setQueue={setQueue} courts={courts} available={available} history={history} elapsed={elapsed} onScore={id=>setScoreTarget(id)} onAssign={assign} genQ={genQueue} autoAss={autoAssign} onCustom={()=>setModal("custom")}/>}
      {tab==="leaderboard"&&<LeaderView ranked={[...players].filter(p=>p?.name).map(p=>({...p,k:kootoro(p,history)})).sort((a,b)=>b.k-a.k)}/>}
      {tab==="history"    &&<HistoryTab history={history} events={events} players={players} activeEventId={activeEventId} onEditEvent={editEvent}/>}
      {tab==="analytics"  &&<AnalyticsView players={players} history={history} courts={courts}/>}
      {tab==="kiosk"      &&<KioskTab players={players} onRegister={handleRegister} queue={queue} courts={courts} history={history}/>}
      {tab==="cost"       &&<CostTab events={events} players={players} activeEventId={activeEventId} onUpdatePlayer={p=>{const upd=stateRef.current.players.map(x=>x.id===p.id?p:x);setPlayers(upd);window._lastSaveAt=Date.now();STORE.save({...stateRef.current,players:serializePlayers(upd)});}} onUpdateEvent={ev=>{const newEvs=stateRef.current.events.map(e=>e.id===ev.id?ev:e);setEvents(newEvs);window._lastSaveAt=Date.now();STORE.save({...stateRef.current,events:newEvs});}}/>}
    </main>
  </div>;
}

// Đợi Firebase load xong rồi mới render app
function mountApp() {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
}

if (window._fbReady) {
  mountApp();
} else {
  document.addEventListener('fb-ready', mountApp, { once: true });
  // Fallback: nếu sau 5 giây vẫn chưa có Firebase, render với localStorage
  setTimeout(() => {
    if (!window._fbReady) {
      console.warn('Firebase timeout — using localStorage only');
      window.STORE = {
        save(data) { try { localStorage.setItem('pb_v6_save', JSON.stringify(data)); } catch(e) {} },
        async load() { try { const s = localStorage.getItem('pb_v6_save'); return s ? JSON.parse(s) : null; } catch { return null; } },
        subscribe() { return ()=>{}; }
      };
      mountApp();
    }
  }, 5000);
}
</script>
  <script>
    if('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('SW registered ✅'))
          .catch(e => console.warn('SW failed:', e));
      });
    }
    // iOS install prompt
    window.addEventListener('load', () => {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.navigator.standalone === true;
      if(isIOS && !isStandalone && !sessionStorage.getItem('ios-prompt-shown')) {
        sessionStorage.setItem('ios-prompt-shown', '1');
        setTimeout(() => {
          const d = document.createElement('div');
          d.innerHTML = `<div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0b1524;border:1px solid #00c9a7;border-radius:16px;padding:14px 18px;color:#dde6f5;font-family:sans-serif;font-size:13px;z-index:9999;max-width:320px;width:90%;box-shadow:0 8px 32px #000a;text-align:center;">
            <div style="font-size:20px;margin-bottom:6px">📲 Cài app</div>
            <div style="color:#4a6480;font-size:12px;margin-bottom:10px">Nhấn <b style="color:#00c9a7">Share</b> → <b style="color:#00c9a7">"Add to Home Screen"</b> để dùng như app thật</div>
            <button onclick="this.parentElement.parentElement.remove()" style="background:#00c9a7;color:#000;border:none;border-radius:8px;padding:7px 20px;font-weight:700;cursor:pointer;font-size:12px">OK</button>
          </div>`;
          document.body.appendChild(d);
        }, 3000);
      }
    });
  </script>
</body>
