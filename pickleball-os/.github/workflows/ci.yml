name: Pickleball OS CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pickleball_test
  REDIS_URL: redis://localhost:6379

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pickleball_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm install

    - name: Run Prisma DB migrations
      working-directory: ./backend
      run: npx prisma migrate deploy

    - name: Run Backend Integration Tests (Jest)
      working-directory: ./backend
      run: npm run test

    - name: Cypress E2E Tests
      uses: cypress-io/github-action@v5
      with:
        working-directory: ./cypress
        build: npm run build
        start: npm start
        wait-on: 'http://localhost:5000'

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend/Frontend to Production Stub
        run: echo "Deploying to Vercel/Render and AWS..."
